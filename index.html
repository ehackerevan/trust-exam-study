<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>臺灣信託業務人員專業測驗：生活圖解重點教材</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>

  <style>
    :root {
      --font-main: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      /* Dark Theme (Default) */
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-tertiary: #1f2937;
      --bg-card: rgba(31, 41, 55, 0.75);
      --bg-card-hover: rgba(55, 65, 81, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(16, 185, 129, 0.35);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-subtle: #6b7280;
      
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: rgba(16, 185, 129, 0.15);
      --accent: #3b82f6;
      --accent-light: rgba(59, 130, 246, 0.15);
      --warning: #f59e0b;
      --danger: #ef4444;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.6);
      
      --sidebar-width: 320px;
      --topbar-height: 64px;
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-color: rgba(0, 0, 0, 0.08);
      --border-highlight: rgba(16, 185, 129, 0.5);
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #94a3b8;
      
      --primary: #059669;
      --primary-hover: #047857;
      --primary-light: rgba(5, 150, 105, 0.1);
      --accent: #2563eb;
      --accent-light: rgba(37, 99, 235, 0.1);
      --warning: #d97706;
      --danger: #dc2626;
      
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-subtle);
    }

    /* ==================== 法規語意色彩引擎 (Legal Syntax Highlighting) ==================== */
    .legal-word {
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1.25;
    }

    /* 禁止詞 (Red) */
    .legal-ban {
      color: #f87171;
      background: rgba(239, 68, 68, 0.14);
      border-bottom: 2px solid #ef4444;
    }
    [data-theme="light"] .legal-ban {
      color: #dc2626;
      background: rgba(239, 68, 68, 0.12);
      border-bottom: 2px solid #dc2626;
    }

    /* 義務詞 (Blue) */
    .legal-duty {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.14);
      border-bottom: 2px solid #3b82f6;
    }
    [data-theme="light"] .legal-duty {
      color: #2563eb;
      background: rgba(59, 130, 246, 0.12);
      border-bottom: 2px solid #2563eb;
    }

    /* 裁量詞 (Purple) */
    .legal-allow {
      color: #c084fc;
      background: rgba(168, 85, 247, 0.14);
      border-bottom: 1.5px dashed #a855f7;
    }
    [data-theme="light"] .legal-allow {
      color: #9333ea;
      background: rgba(168, 85, 247, 0.12);
      border-bottom: 1.5px dashed #9333ea;
    }

    /* 條件但書 (Amber) */
    .legal-condition {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.14);
      border-bottom: 1.5px solid #f59e0b;
    }
    [data-theme="light"] .legal-condition {
      color: #d97706;
      background: rgba(245, 158, 11, 0.12);
      border-bottom: 1.5px solid #d97706;
    }

    /* 時間期限 (Cyan) */
    .legal-time {
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.16);
      border-bottom: 2px double #06b6d4;
      text-shadow: 0 0 6px rgba(34, 211, 238, 0.3);
    }
    [data-theme="light"] .legal-time {
      color: #0891b2;
      background: rgba(6, 182, 212, 0.12);
      border-bottom: 2px double #0891b2;
      text-shadow: none;
    }

    /* ==================== 官方條文卡片 (Law Card Details) ==================== */
    .law-card {
      margin: 24px 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .law-card summary {
      padding: 14px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      transition: background 0.2s;
    }
    .law-card summary:hover {
      background: var(--bg-card-hover);
    }
    .law-card-content {
      padding: 16px 20px;
      font-size: 0.92rem;
      line-height: 1.8;
      border-top: 1px solid var(--border-color);
    }
    .law-card-content p {
      margin-bottom: 12px;
    }
    .law-card-content p:last-child {
      margin-bottom: 0;
    }

    /* Layout Containers */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Top Bar */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      font-size: 1.25rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 本機進度狀態 Badge */
    .progress-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .btn-action {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-action.highlight {
      background: linear-gradient(135deg, var(--danger), #b91c1c);
      color: #fff;
      border: none;
    }

    .btn-icon {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Sidebar Content */
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px 10px 34px;
      min-height: 44px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 0.9rem;
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      min-height: 48px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      margin-bottom: 4px;
      position: relative;
    }
    .menu-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-main);
    }
    .menu-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    .menu-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .menu-item-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .menu-item-info {
      flex: 1;
      min-width: 0;
    }

    .menu-item-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .menu-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-subtle);
    }

    /* Content Area */
    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .article-wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Markdown Styling */
    .markdown-body {
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .markdown-body h1 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .markdown-body h2 {
      font-size: 1.55rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .markdown-body h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1.2em;
      background: var(--primary);
      border-radius: 2px;
    }

    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 18px;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border-radius: 0 8px 8px 0;
      margin: 24px 0;
      color: var(--text-muted);
    }
    .markdown-body blockquote strong {
      color: var(--text-main);
    }

    /* ==================== 響應式表格：桌機表格 / 平板換行 / 手機卡片 ==================== */
    .table-scroll-wrapper {
      position: relative;
      width: 100%;
      margin: 1.5rem 0;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-scroll-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 14px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .table-mode-note {
      color: var(--text-muted);
      font-weight: 500;
      text-align: right;
    }

    .table-scroll-inner {
      width: 100%;
      overflow: visible;
      display: block;
    }

    .markdown-body table,
    .table-scroll-inner table {
      width: 100% !important;
      min-width: 0 !important;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.9rem;
      table-layout: auto;
    }

    .markdown-body th,
    .table-scroll-inner th {
      background: var(--bg-tertiary);
      color: var(--text-main);
      font-weight: 700;
      text-align: left;
      padding: 11px 14px;
      border-bottom: 2px solid var(--border-highlight);
      border-right: 1px solid var(--border-color);
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .markdown-body td,
    .table-scroll-inner td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--text-muted);
      vertical-align: top;
      line-height: 1.6;
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: anywhere !important;
    }

    .markdown-body th:last-child,
    .table-scroll-inner th:last-child,
    .markdown-body td:last-child,
    .table-scroll-inner td:last-child {
      border-right: none;
    }

    .markdown-body tr:last-child td,
    .table-scroll-inner tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:hover td,
    .table-scroll-inner tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* 平板：保留表格，但固定欄寬並允許標題、內容自然換行。 */
    @media (max-width: 900px) and (min-width: 641px) {
      .table-scroll-inner {
        overflow: visible !important;
      }

      .markdown-body table,
      .table-scroll-inner table {
        table-layout: fixed !important;
        width: 100% !important;
      }

      .markdown-body th,
      .table-scroll-inner th,
      .markdown-body td,
      .table-scroll-inner td {
        padding: 9px 10px;
        font-size: 0.84rem;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
      }

      .table-mode-note {
        max-width: 52%;
      }
    }

    /* 手機：每一列自動轉成卡片，完全不需要左右滑動。 */
    @media (max-width: 640px) {
      .table-scroll-wrapper {
        border: none;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }

      .table-scroll-hint {
        border: 1px solid var(--border-color);
        border-radius: 9px;
        margin-bottom: 10px;
        padding: 8px 10px;
      }

      .table-mode-note {
        display: none;
      }

      .table-scroll-inner {
        overflow: visible !important;
        width: 100%;
      }

      .table-scroll-inner table,
      .markdown-body .table-scroll-inner table {
        display: block;
        width: 100% !important;
        min-width: 0 !important;
        table-layout: auto !important;
        background: transparent;
      }

      .table-scroll-inner thead {
        display: none;
      }

      .table-scroll-inner tbody {
        display: block;
        width: 100%;
      }

      .table-scroll-inner tbody tr {
        display: block;
        width: 100%;
        margin: 0 0 12px;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg-card);
        box-shadow: var(--shadow-sm);
      }

      .table-scroll-inner tbody td {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border-right: none !important;
        border-bottom: 1px solid var(--border-color);
        padding: 10px 12px;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--text-main);
        background: transparent;
      }

      .table-scroll-inner tbody td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 4px;
        color: var(--text-subtle);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .table-scroll-inner tbody td:first-child {
        color: var(--primary);
        font-size: 1.02rem;
        font-weight: 800;
        background: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-highlight);
      }

      .table-scroll-inner tbody td:first-child::before {
        display: none;
      }

      .table-scroll-inner tbody td:last-child {
        border-bottom: none;
      }

      .table-scroll-inner tbody tr:hover td {
        background: transparent;
      }

      .table-scroll-inner tbody tr:hover td:first-child {
        background: var(--bg-tertiary);
      }
    }

    .markdown-body strong {
      color: var(--primary);
      font-weight: 600;
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border-color);
      margin: 36px 0;
    }

    /* 內頁導覽卡片連結 */
    .chapter-card-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .chapter-card-link:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* ==================== 向量圖檔容器 (SVG Figure) ==================== */
    .diagram-figure {
      margin: 32px 0;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .diagram-figure:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 36px rgba(16, 185, 129, 0.15);
    }

    .diagram-figure-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
    }

    .diagram-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .diagram-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-lightbox-trigger {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      min-height: 38px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-lightbox-trigger:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .diagram-img-container {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1120;
      cursor: zoom-in;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .zoomable-svg {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      transition: transform 0.2s ease;
    }

    .diagram-caption {
      text-align: center;
      padding: 8px 16px;
      font-size: 0.82rem;
      color: var(--text-subtle);
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ==================== 題庫系統雙軌切換架構 ==================== */
    .quiz-section {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 2px dashed var(--border-color);
    }

    .quiz-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .quiz-tab-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .quiz-tab-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 全真題庫工具列 */
    .bank-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .bank-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .bank-select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      min-height: 40px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }

    .bank-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
      user-select: none;
    }
    .bank-checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .bank-status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 題目卡片 */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .quiz-meta {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quiz-question {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      min-height: 48px;
      font-size: 0.95rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      line-height: 1.5;
    }
    .quiz-option:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--primary);
    }

    .quiz-option.selected-correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }
    .quiz-option.selected-wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .quiz-explain {
      margin-top: 14px;
      padding: 14px 18px;
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-main);
      display: none;
    }
    .quiz-explain.show {
      display: block;
    }

    /* 分頁按鈕列 */
    .bank-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-page {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Bottom Navigation */
    .bottom-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-nav:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ==================== 圖片燈箱 (Lightbox Modal) ==================== */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 16, 0.94);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox-modal.active,
    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px 12px 0 0;
      color: #fff;
    }

    .lightbox-title {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lightbox-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lb-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      min-height: 40px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lb-btn.close {
      background: #ef4444;
      border-color: #dc2626;
    }

    .lightbox-body {
      width: 100%;
      max-width: 1200px;
      height: 80vh;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: none;
      border-radius: 0 0 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .lightbox-body img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 8px;
      transition: transform 0.2s ease-out;
      user-select: none;
      shape-rendering: geometricPrecision !important;
      text-rendering: geometricPrecision !important;
      image-rendering: -webkit-optimize-contrast;
      transform-origin: center center;
    }
    @media (max-width: 768px) {
      .lightbox-body {
        padding: 10px !important;
        align-items: flex-start !important;
        justify-content: flex-start !important;
      }
      .lightbox-body img {
        min-width: 800px !important; /* 手機燈箱預設展開為 800px 高清原尺寸，任意拖曳漫遊查看！ */
        max-width: none !important;
        max-height: none !important;
      }
    }

    /* 側邊欄抽屜遮罩 (手機/平板) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 25;
    }
    .sidebar-overlay.active,
    .sidebar-overlay.open {
      display: block;
    }

    /* ==================== 響應式優化 (Mobile & Tablet) ==================== */
    @media (max-width: 960px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .mobile-menu-btn {
        display: flex;
      }
      .content-container {
        padding: 20px 16px;
      }
      .markdown-body h1 {
        font-size: 1.7rem;
      }
      .markdown-body h2 {
        font-size: 1.35rem;
      }
      .progress-pill {
        display: none;
      }
    }
  
    /* ==================== 手機與平板極致好讀專用響應式樣式 ==================== */
    
    /* 表格滑動樣式已整合至全域區塊 */

    /* 觀念標籤與題目標記 */
    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--accent-light);
      color: var(--accent);
      margin-bottom: 8px;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    /* 行動端底部浮動捷徑列 (Mobile Action Bar) */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 1000;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.25);
      padding: 0 8px;
      justify-content: space-around;
      align-items: center;
    }
    .mobile-bar-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 500;
      min-width: 52px;
      min-height: 48px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .mobile-bar-btn:active {
      transform: scale(0.92);
      color: var(--primary);
    }
    .mobile-bar-btn.active {
      color: var(--primary);
      font-weight: 700;
    }
    .mobile-bar-btn span.icon {
      font-size: 1.15rem;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    /* 官方條文 Modal 樣式 */
    .laws-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .laws-modal-overlay.open {
      display: flex;
    }
    .laws-modal-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .laws-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
    }
    .laws-modal-header h3 {
      font-size: 1.1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .laws-modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .law-select-box {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
    }
    .law-article-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .law-article-card h5 {
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .law-article-card p {
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* 平板適配 (<= 1024px) */
    @media (max-width: 1024px) {
      :root {
        --sidebar-width: 280px;
      }
      #main-content {
        padding: 0 16px;
      }
      #contentContainer {
        max-width: 100%;
      }
      .table-scroll-hint {
        display: flex;
      }
    }

    /* 手機直向與小螢幕 (<= 768px) */
    @media (max-width: 768px) {
      body {
        padding-bottom: 64px; /* 留給底部快捷工具列空間 */
      }
      .mobile-bottom-bar {
        display: flex;
      }
      #topbar {
        height: 52px;
        padding: 0 12px;
      }
      #breadcrumbTitle {
        font-size: 0.88rem;
        max-width: 180px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #globalStatsPill {
        display: none;
      }
      #quickCrunchBtn {
        padding: 4px 8px;
        font-size: 0.75rem;
      }
      #themeToggleBtn {
        width: 38px;
        height: 38px;
      }
      
      #contentContainer {
        padding: 16px 8px;
      }
      #markdownOutput {
        font-size: 0.98rem;
        line-height: 1.75;
      }
      #markdownOutput h1 {
        font-size: 1.4rem;
        margin: 1.2rem 0 0.8rem 0;
      }
      #markdownOutput h2 {
        font-size: 1.2rem;
        margin: 1.1rem 0 0.6rem 0;
      }
      #markdownOutput h3 {
        font-size: 1.05rem;
        margin: 0.9rem 0 0.5rem 0;
      }
      #markdownOutput img {
        max-width: 100%;
        border-radius: 6px;
      }
      
      /* 刷題區塊手機適配 */
      #quizSection {
        padding: 16px 8px;
      }
      .bank-toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .bank-toolbar select {
        width: 100%;
      }
      .bank-card {
        padding: 14px 12px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .bank-opt-btn {
        min-height: 48px;
        padding: 12px 14px;
        font-size: 0.92rem;
        line-height: 1.45;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }
      #bankPagination {
        flex-wrap: wrap;
        gap: 8px;
      }
      #bankPrevBtn, #bankNextBtn {
        min-height: 44px;
        padding: 8px 16px;
        font-size: 0.9rem;
      }
      
      /* 側欄滿版抽屜 */
      #sidebar {
        width: 82%;
        max-width: 310px;
      }
    }

    /* 超窄機身 (<= 380px) */
    @media (max-width: 380px) {
      #breadcrumbTitle {
        max-width: 130px;
      }
      .bank-opt-btn {
        font-size: 0.85rem;
        padding: 10px 10px;
      }
    }

  
    /* ==================== 核心圖解卡片與手機高清滑動 (SVG 模糊徹底解決方案) ==================== */
    .diagram-interactive-card {
      margin: 28px 0;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .diagram-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(31, 41, 55, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .diagram-card-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .diagram-card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
      min-width: 140px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .diagram-card-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .diagram-scroll-hint {
      font-size: 0.75rem;
      font-weight: 600;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px dashed rgba(56, 189, 248, 0.4);
      white-space: nowrap;
      display: none;
    }
    .btn-diagram-zoom {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.5);
      color: #93c5fd;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 6px 14px;
      min-height: 36px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;

    .btn-diagram-zoom:hover,
    .btn-diagram-zoom:active {
      background: #2563eb;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .diagram-card-canvas {
      position: relative;
      padding: 16px;
      background: #0b1120;
      cursor: zoom-in;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x pan-y;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .diagram-svg-img {
      display: block;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      shape-rendering: geometricPrecision !important;
      text-rendering: geometricPrecision !important;
      image-rendering: -webkit-optimize-contrast;
      transition: transform 0.2s ease;

    .diagram-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;

      background: rgba(15, 23, 42, 0.7);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.82rem;
      color: var(--text-subtle);
    }
    .diagram-quick-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-size: 0.82rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: underline;
      transition: color 0.2s;

    .diagram-quick-btn:hover {
      color: #60a5fa;

    /* 手機/平板響應式優化（寬度 <= 768px） */
    @media (max-width: 768px) {
      .diagram-scroll-hint {
        display: inline-block !important; /* 手機端自動提示左右滑動 */
      }
      .diagram-card-canvas {
        justify-content: flex-start !important; /* 靠左排列，支援左右流暢滑動 */
        padding: 14px 10px !important;

lass=\"topic-stat-rank\">9</span><span>集合帳戶受益權淨值與退出</span></span><span class=\"topic-stat-track\" aria-hidden=\"true\"><span class=\"topic-stat-fill\" style=\"width:6.34%\"></span></span><span class=\"topic-stat-value\">9 題<span class=\"topic-stat-percent\">1.9%</span></span></li><li class=\"topic-stat-row\"><span class=\"topic-stat-label\"><span class=\"topic-stat-rank\">10</span><span>安養退休與保險金信託</span></span><span class=\"topic-stat-track\" aria-hidden=\"true\"><span class=\"topic-stat-fill\" style=\"width:2.82%\"></span></span><span class=\"topic-stat-value\">4 題<span class=\"topic-stat-percent\">0.8%</span></span></li><li class=\"topic-stat-row\"><span class=\"topic-stat-label\"><span class=\"topic-stat-rank\">11</span><span>子女教育與保險信託應用</span></span><span class=\"topic-stat-track\" aria-hidden=\"true\"><span class=\"topic-stat-fill\" style=\"width:1.41%\"></span></span><span class=\"topic-stat-value\">2 題<span class=\"topic-stat-percent\">0.4%</span></span></li></ol><p class=\"topic-stat-note\">橫條以本圖最高題數為比較基準；占比以 473 題為分母。</p></section>\n\n</details>\n\n<!-- topic-statistics:end -->\n"},{"id":"c01","filename":"01_信託法規精粹_生活圖解篇.md","title":"信託法基礎與獨立性","icon":"🛡️","badge":"必考 45%","weight":"信託法規核心","markdown":"# 第 01 章：信託法基礎與信託財產獨立性（生活圖解篇）\n\n---\n\n## 🎯 本章學習導航與核心地圖\n\n依本站歷屆題庫整理，信託財產獨立性（第 12 條）、公示與對抗要件（第 4 條）、詐害信託撤銷權（第 6、7 條）及受託人義務（第 22～35 條）都是高頻考點。本章以下內容以現行《信託法》條文為準。\n\n![🏛️ 信託基本三面關係與法定架構](images/chart_01_01.svg)\n\n---\n\n## 💡 一、信託的本質與生活化白話比喻\n\n### 1. 什麼是信託？（信託法第 1 條）\n> **法條原意**：稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。\n\n*   **實務情境（高齡安養與二代教育金傳承信託）**：\n    王老先生（**委託人**）將 1,000 萬元資金信託移轉予臺灣銀行信託部（**受託人**），簽訂信託契約，約定受託銀行每月撥付 3 萬元作為王老先生的生活安養費（**自益信託部分**），並約定在孫子小明考上大學後，每學期撥付 10 萬元學雜費與留學基金（**他益信託部分**）。\n    *   ① **財產權實質移轉**：1,000 萬元所有權名義已合法移轉至臺銀信託專戶，王老先生若日後經商失利遭一般債權人追討，原則上不得對信託財產強制執行；但信託法第 12 條所列例外情形不在此限；\n    *   ② **分別管理義務**：臺銀必須將這筆資金與自有營運資產嚴格分帳、獨立列管；\n    *   ③ **稅務效果**：孫子小明如取得他益信託利益，可能構成遺產及贈與稅法所定的視同贈與；申報義務與價值計算應依遺產及贈與稅法規定判斷。\n*   **四大核心構成要件**：\n    1.  **委託人必須把「財產權移轉或處分」給受託人**：受託人必須取得外觀上的所有權或名義，若只是口頭委託代跑腿、財產沒有過戶或移轉，僅是民法上的「委任」，而不是信託！\n    2.  **必須有「信託目的」**：目的必須合法、可能、確定，且不能違反公共秩序與善良風俗。\n    3.  **受託人是「為受益人利益」或「特定目的」而管理**：不是為受託人自己賺錢。\n    4.  **信託財產必須具體確定**：不能是抽象概念（例如不能以「未來可能發生的好運」為信託財產）。\n\n---\n\n## 🛡️ 二、信託的分類：一張圖秒懂\n\n![📚 信託三大核心法定分類架構](images/chart_01_02.svg)\n\n> **🔥 考古題必考陷阱（何者錯誤）**：\n> *   **陷阱 1**：自然人得否以「宣言信託」設立信託？\n>     *   👉 **錯誤。**《信託法》第 71 條的宣言信託，是法人為增進公共利益，經決議並取得目的事業主管機關許可後，對外宣言自為委託人及受託人。自然人不適用此一宣言信託制度。\n> *   **陷阱 2**：法定信託在台灣存在嗎？\n>     *   👉 **非基於法律行為**！台灣信託法採設立信託主義（契約、遺囑、宣言），「法定信託」非由當事人之設立行為成立，為英美法系產物，非我國信託法規定之設立型態。\n\n---\n\n## 🔰 三、信託財產的獨立性\n\n信託財產移轉或處分予受託人後，法律賦予其獨立性；它不因受託人死亡或破產而成為受託人的遺產或破產財團，且原則上不得任意強制執行。\n\n![🛡️ 信託財產獨立性與強制執行界線](images/chart_01_03.svg)\n\n### 1. 信託財產獨立性的五項核心規則（信託法第 9～14 條）\n1.  **物上代位性（第 9 條，換形不換質）**：信託財產因管理、處分、滅失、毀損取得之賠償金、保險給付或變賣價金，仍屬信託財產。即使型態由房屋轉為現金，也不因此成為受託人自有財產；是否得強制執行仍依第 12 條及其他法律判斷。\n2.  **不屬於受託人之遺產（第 10 條）**：受託人死亡時，信託財產由新受託人接手，**不列入受託人的遺產**！\n3.  **不屬於受託人之破產財團（第 11 條）**：受託人個人經商失敗宣布破產，信託財產**不屬於受託人的破產財團**。\n4.  **禁止強制執行之原則（第 12 條第 1 項）**：任何人不得隨意對信託財產聲請法院查封拍賣。\n5.  **禁止抵銷（第 13 條）**：老王欠受託人個人 100 萬，但老王對信託財產有 100 萬債權，**兩者不得主張抵銷**！\n\n---\n\n### 🚨 2. 防彈衣的「三大破防例外」（得強制執行之例外）\n\n這是**歷屆出題頻率最高（考超過 80 次）**的條文：**信託法第 12 條第 1 項但書**！\n\n![⚖️ 信託財產強制執行判斷流程與三大破防例外](images/chart_01_04.svg)\n\n> **🔥 審題重點**：\n> *   委託人的普通債權人拿本票裁定，要去查封信託財產？ ❌ **不可以！違反第 12 條！**\n> *   銀行在房子信託前，就已經設定了第一順位最高限額抵押權，委託人違約不繳房貸，銀行可否拍賣信託房屋？ ⭕ **可以！此為「信託前已存在之權利」！**\n> *   受託人請水電師傅修繕信託的公寓水管，修繕完畢積欠工程款 10 萬元，水電師傅可否向法院聲請對信託公寓強制執行？ ⭕ **可以！此為「因處理信託事務所生之權利」！**\n\n---\n\n## 🪪 四、信託公示制度：對抗要件（信託法第 4 條）\n\n信託不是兩個人在抽屜裡偷偷簽約就能對抗全世界，必須「公示」，不然第三人根本不知道財產已經信託！\n\n| 財產類型 | 公示與生效規定 | 未登記之法律效果 |\n| :--- | :--- | :--- |\n| **應登記之財產權**<br/>（如：土地、房屋、船舶、航空器、商標權、專利權） | 必須向地政機關或主管機關辦妥**信託登記** | **法定對抗要件而非成立要件**！信託契約在委託人與受託人間債權仍合法有效，但**對外喪失阻擋第三人強制執行之對抗力**（如盾牌未舉起，第三人仍得拍賣取償） |\n| **有價證券** | 依目的事業主管機關規定，在證券或其他表彰權利文件上**載明為信託財產**；股票或公司債券另須**通知發行公司** | 未依法載明為信託財產，**不得對抗第三人**；股票或公司債券未通知發行公司，**不得對抗發行公司** |\n\n> **💡 實務精選案例【精華地漏辦信託專簿登記之對抗風險】**：\n> 陳董將名下一筆市價 5,000 萬元的精華土地信託移轉給好友張三管理，契約完全合法，但在地政事務所僅辦妥「所有權移轉登記」，卻漏未辦理「信託登記（未載明為信託財產及信託專簿）」：\n> ① **內部關係**：未辦信託登記，不代表信託當然無效；委託人與受託人間的權利義務仍須依信託行為及一般法律關係判斷。\n> ② **外部關係**：依第 4 條，未辦理信託登記即不得以該信託對抗第三人；至於個案能否強制執行，仍應依第三人的權利、執行名義及其他相關法規判斷。\n> 📌 **解題口訣**：「內部有效成立，外部登記始生對抗；無登記如無盾牌，債權查封無法抵擋」\n\n> **🔥 考古題常見陷阱（第 41 期第 1 題直擊）**：\n> *   題目：「以股票為信託者，通知發行公司即可對抗第三人？」\n> *   👉 **錯！**「載明為信託財產」是對抗第三人的要件；股票或公司債券另須通知發行公司，才能對抗該公司。兩種對抗對象不要混為一談。\n\n---\n\n## ⚔️ 五、脫產防線：詐害信託與撤銷權（信託法第 6 條、第 7 條）\n\n【建商欠款脫產信託與除斥期間之防禦】\n包商黃董積欠下游材料商林老闆 3,000 萬元工程款，為免豪宅被查封，將名下價值 4,000 萬元的豪宅信託登記給不知情的胞弟作為子女教育基金：\n① **有害及債權**：黃董信託行為導致其剩餘資產不足清償債務，構成有害及債權；\n② **撤銷與受益人既得利益要分開判斷**：信託行為有害於債權人權利時，債權人得聲請法院撤銷；但受益人已取得的利益原則上不受撤銷影響，除非利益尚未屆清償期，或受益人取得利益時明知或可得而知有害及債權。\n③ **嚴格除斥期間**：林老闆必須在「自知有撤銷原因起 1 年內」，或「自信託行為成立日起 10 年內」，向民事法院提起撤銷訴訟；逾期則撤銷權消滅！\n\n![⚖️ 詐害信託撤銷權判定流程與除斥期間](images/chart_01_05.svg)\n\n### 1. 撤銷的法定條件\n1.  **有害於債權人**：信託行為發生時，委託人之資產已經不足以清償所有既有債務（害及資力）。\n2.  **撤銷要件著重信託行為是否有害債權**：第 6 條並未把受託人惡意列為撤銷要件；但受益人已取得利益能否保有，仍須依第 6 條第 2 項判斷。\n3.  **法定推定有害（第 6 條第 3 項）**：信託成立後 **6 個月內**，委託人被宣告破產者，**法律直接推定該信託行為有害於債權**！\n\n### 2. 撤銷權的除斥期間（時效必背數字！）\n*   **短期間**：自債權人**知有撤銷原因起，1 年間**不行使而消滅。\n*   **長期間**：自信託行為**成立日起，逾 10 年**不行使而消滅。\n\n---\n\n## 🧑‍💼 六、受託人的權利、義務與利益衝突迴避\n\n受託人掌管他人龐大身家，法規對其設定了極高的誠信標準：\n\n### 1. 受託人的三項核心義務\n1.  **善良管理人之注意義務（信託法第 22 條）**：\n    受託人應依信託本旨，以善良管理人之注意，處理信託事務。即使是**無償受託人**（沒收任何手續費或報酬），一樣要負**善良管理人**的高規格注意標準！（民法無償委任通常僅負與處理自己事務為同一之注意，但信託法標準更高！）。\n2.  **親自處理義務（第 25 條）**：\n    受託人原則上**應親自處理信託事務**。\n    *   **得使第三人代為處理的法定例外只有兩類**：\n        1. 信託行為另有訂定。\n        2. 有不得已之事由。\n    *   單純取得委託人及受益人同意，並不是第 25 條明文列出的第三種例外。\n3.  **分別管理義務（第 24 條）**：\n    受託人必須將信託財產與其**自有財產**，以及**不同信託之信託財產**，分別獨立管理。\n\n---\n\n### 2. 利益衝突迴避（信託法第 34、35 條）\n\n![🛡️ 受託人防弊規範：享有利益與轉為自有之限制](images/chart_01_06.svg)\n\n> **🔥 歷屆經典試題核心破解**：\n> *   問：受託人可否同時為該信託之唯一受益人？\n>     *   👉 **不可以。**第 34 條規定受託人不得享有信託利益，但與他人為共同受益人者例外，因此受託人不能成為唯一受益人。\n> *   問：受託人看中信託財產中的不動產或名車，想將信託財產轉為自有財產（自易交易），法律如何規範？\n>     *   👉 **原則禁止，但有法定例外。**第 35 條第 1 項列出三種例外：① 經受益人書面同意並依市價取得；② 由集中市場競價取得；③ 有不得已事由經法院許可。另依第 2 項，受託人因繼承、合併或其他事由概括承受信託財產上權利時，也不適用第 1 項限制。\n\n---\n\n## 🔚 七、信託之消滅與賸餘財產歸屬（信託法第 62~65 條）\n\n信託關係因為信託目的已完成、不能完成、期限屆滿、或終止而消滅時，剩下的財產該給誰？\n\n![🏛️ 信託關係消滅時之信託財產終局歸屬法定三順位](images/chart_01_07.svg)\n\n> **🎯 歸屬先後順序口訣**：\n> **「一約定、二全部受益、三委託」**：信託行為有約定歸屬權利人時依約定；未約定時，先歸屬於**享有全部信託利益之受益人**，其次才是委託人或其繼承人。\n\n\n---\n\n## 📜 法規原文對照庫\n<details class=\"law-card\">\n  <summary>📜 查閱中華民國《信託法》關鍵法定條文原文</summary>\n  <div class=\"law-card-content\">\n    <p><strong>第 1 條（信託定義）</strong>：稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。</p>\n    <p><strong>第 4 條（公示與對抗要件）</strong>：應登記或註冊之財產權，非經信託登記不得對抗第三人；有價證券未依法載明為信託財產，不得對抗第三人；股票或公司債券另須通知發行公司，否則不得對抗該公司。</p>\n    <p><strong>第 6 條（詐害信託撤銷權）</strong>：信託行為有害於委託人之債權人權利者，債權人得聲請法院撤銷；受益人已取得利益的保護另依第 2 項判斷。信託成立後 6 個月內，委託人或其遺產受破產宣告者，推定其行為有害及債權。</p>\n    <p><strong>第 7 條（撤銷權除斥期間）</strong>：前條撤銷權，自債權人知有撤銷原因時起，1 年間不行使而消滅。自信託行為成立時起，逾 10 年者，亦同。</p>\n    <p><strong>第 12 條（強制執行禁止與例外）</strong>：對信託財產不得強制執行。但基於信託前已存在於該財產之權利、因處理信託事務所生之權利或其他法律有特別規定者，不在此限。</p>\n    <p><strong>第 34 條（受託人利益限制）</strong>：受託人不得以任何名義，享有信託利益。但與他人為共同受益人時，不在此限。</p>\n    <p><strong>第 35 條（轉為自有之限制）</strong>：受託人原則上不得將信託財產轉為自有財產或於其上設定、取得權利；第 1 項列有受益人書面同意並依市價取得、集中市場競價取得、不得已事由經法院許可三種例外，第 2 項另定繼承、合併或其他概括承受的例外。</p>\n  </div>\n</details>\n"},{"id":"c02","filename":"02_信託業法與監理架構_圖解篇.md","title":"信託業法與監理架構","icon":"🏢","badge":"必考 38%","weight":"信託業法核心","markdown":"# 第 02 章：信託業法與金融監理架構（圖解篇）\n\n---\n\n## 🎯 本章學習導航與核心地圖\n\n依本站歷屆題庫整理，《信託業法》的監理架構、利益衝突、賠償準備金與信託財產評審制度都是高頻考點。\n本章核心在於金管會如何透過「資金門檻」、「防火牆制度」與「內部控制」來監管這群管錢的金融機構。\n\n![🏛️ 信託業法金融監理金字塔與四大防線](images/chart_02_01.svg)\n\n---\n\n## 🏢 一、信託業的誕生：設立門檻與兩道資金防線\n\n要開辦信託業務，法律採「特許營業許可制與業務分別核定原則」：\n① **業務核定原則**：信託業得經營的業務種類，應依第 18 條報請主管機關核定；涉及外匯業務者，應經中央銀行同意。\n② **不得承諾保本或最低收益率（第 31 條）**：信託業不得承諾擔保本金或最低收益率。底層商品本身如另有發行條件，仍應區分商品發行人的義務與受託人的責任，不可把商品條件解讀成信託業對客戶的保證。\n\n![💰 信託業兩大法定資金防線與營業保證金陷阱](images/chart_02_02.svg)\n\n### 1. 兩大資金門檻精準比對表（考題必出數字！）\n\n| 項目 | 法定金額 / 比率 | 繳存地點 / 形式 | 主要功能與受償權利 |\n| :--- | :--- | :--- | :--- |\n| **最低實收資本額** | **新臺幣 20 億元**<br/>（發起人一次認足發行股份總額，並至少繳足 20% 股款） | 信託公司自有資本 | 確保公司資本充足度與營運穩定性 |\n| **賠償準備金**<br/>（信託業法第 34 條） | **最低 5,000 萬元**，並依主管機關公告按受託財產計提 | 取得執照後 **1 個月內**<br/>以**現金或政府債券**繳存**中央銀行** | 擔保信託業因違反受託人義務所負的**損害賠償、利益返還或其他責任**；委託人或受益人對賠償準備金有**優先受償權** |\n\n> **🔥 考古題必考陷阱（何者錯誤）**：\n> *   **陷阱 1**：信託業法要求信託業另提「營業保證金」，例如實收資本額 5%、最低 5,000 萬元並繳存國庫？ ❌ **錯誤！信託業法本身沒有這項營業保證金要求；正確制度是第 34 條的「賠償準備金」，繳存中央銀行。**\n> *   **陷阱 2**：賠償準備金繳存於財政部？ ❌ **錯誤！是繳存「中央銀行」！**\n> *   **陷阱 3**：賠償準備金得以股票或不動產繳存？ ❌ **錯誤！限以「現金」或「政府債券」繳存！**\n> *   **陷阱 4**：賠償準備金只是一般營運資金？ ❌ **錯誤。**第 34 條明定其用於擔保違反受託人義務所生責任，且委託人或受益人有優先受償權。\n\n---\n\n## 🚧 二、利益衝突防護網：信託業法第 25 條與第 27 條\n\n信託業是管錢的人，最怕經理人「內線交易」或把親戚快倒閉公司的爛股票賣給客戶的信託帳戶！\n\n![🚧 信託業利益衝突防火牆：第 25 條與第 27 條](images/chart_02_03.svg)\n\n### 1. 信託業的「利害關係人」是誰？（信託業法第 7 條）\n記憶關鍵數字：**「持股 5%」與「持股 10%」**！\n*   持有信託公司股份總額 **5% 以上**之股東。\n*   信託業負責人（董、監、總經理）。\n*   信託業負責人獨資、合夥，或持股超過 **10%** 之企業。\n*   信託公司持股超過 **5%** 之轉投資企業。\n*   對信託財產具有**運用決定權之人**。\n\n### 2. 第 25 條與第 27 條的限制及例外\n\n| 比較維度 | 第 25 條 | 第 27 條 |\n| :--- | :--- | :--- |\n| **基本規則** | 原則禁止以信託財產與本身或利害關係人從事第 25 條列舉交易 | 原則禁止第 27 條列舉交易，但信託契約有約定，或事先告知受益人並取得書面同意時，得依規定辦理 |\n| **規範範圍** | 1. 購買本身或利害關係人發行或承銷之有價證券或票券。<br/>2. 購買本身或利害關係人之財產。<br/>3. 讓售予本身或利害關係人。<br/>4. 其他主管機關規定之利害關係交易。 | 1. 購買其銀行業務部門經紀之有價證券或票券。<br/>2. 存放於其銀行業務部門或利害關係人處，或與銀行業務部門從事外匯相關交易。<br/>3. 與本身或利害關係人為第 25 條第 1 項以外之其他交易。 |\n| **重要例外** | 信託契約約定信託業對信託財產**不具運用決定權**者，不受第 1 項限制，但須充分告知交易情形；**政府發行之債券**亦不受第 1 項限制。 | 信託契約約定信託業對信託財產**不具運用決定權**者，不受第 1 項限制，但仍須充分告知交易情形；外匯交易並須遵守外匯法令及揭露風險。 |\n\n---\n\n## 🏛️ 三、公司治理：信託財產評審委員會\n\n信託業管理這麼多龐大資產，資產到底值多少錢？有沒有跌價風險？需要專門委員會審核：\n\n![🏢 信託財產評審委員會開會週期與職權規範](images/chart_02_04.svg)\n\n*   **評審頻率**：第 21 條規定信託財產**每 3 個月評審一次**，並報告董事會。\n*   **職責**：審查受託財產之評審原則、公允價格認定及後續風險控管，並將結果提報董事會。\n\n### 2. 信託業的法定定期報告\n*   **信託財產評審**：第 21 條明定每 **3 個月評審一次**，並報告董事會；條文本身沒有「季後 1 個月內」的額外期限。\n*   **營業報告與財務報告**：第 39 條規定信託業應於**每半營業年度**編製營業報告書及財務報告，向主管機關申報，並公告資產負債表；具體期限見《信託業法施行細則》第 17 條：**半年度終了後 2 個月內**、**年度終了後 4 個月內**辦理。\n\n---\n\n## ⚖️ 四、監理處分與罰則體系\n\n當信託業違反法令或章程、有損害受益人權益之虞時，主管機關（金融監督管理委員會）有哪些大招？\n\n![⚖️ 金管會對違法信託業之行政處分階梯](images/chart_02_05.svg)\n\n> **🔥 歷屆經典試題（解任董監職務）**：\n> *   題目：信託業董事或監察人違反法令時，信託業商業同業公會得否直接解除其職務？\n> *   👉 **錯！** 同業公會無此行政權力，**只有主管機關（金管會）**有權命令解除其董監職務！\n\n\n---\n\n## 📜 法規原文對照庫\n<details class=\"law-card\">\n  <summary>📜 查閱中華民國《信託業法》關鍵法定條文原文</summary>\n  <div class=\"law-card-content\">\n    <p><strong>設立資本額</strong>：信託業法第 10 條授權主管機關訂定最低實收資本額；依《信託業設立標準》第 3、4 條，一般信託公司最低實收資本額為新臺幣 20 億元，發起人應一次認足發行股份總額，並至少繳足 20% 股款。</p>\n    <p><strong>第 25 條（利害關係交易限制）</strong>：原則禁止以信託財產從事條文列舉的本身或利害關係人交易；但信託契約約定信託業不具運用決定權者不受第 1 項限制，政府發行之債券亦屬法定例外。</p>\n    <p><strong>第 27 條（其他利害關係交易限制）</strong>：除依信託契約約定，或事先告知受益人並取得書面同意外，不得從事條文列舉的交易；信託業不具運用決定權者不受第 1 項限制，但須充分告知交易情形。</p>\n    <p><strong>第 34 條（賠償準備金）</strong>：信託業為擔保因違反受託人義務所負的損害賠償、利益返還或其他責任，應提存賠償準備金；取得營業執照後 1 個月內，以現金或政府債券繳存中央銀行。委託人或受益人有優先受償之權。</p>\n    <p><strong>第 39 條＋施行細則第 17 條（定期報告）</strong>：信託業應於每半營業年度編製營業報告書及財務報告並向主管機關申報；半年度終了後 2 個月內、年度終了後 4 個月內辦理。</p>\n    <p><strong>第 44 條（主管機關處分權限）</strong>：信託業違反法令或章程時，主管機關得依法律規定採取糾正、限期改善、停止部分業務或其他監理處分。</p>\n  </div>\n</details>\n"},{"id":"c03","filename":"03_信託稅制全攻略_穿透圖解篇.md","title":"信託稅制全攻略穿透篇","icon":"💧","badge":"常考 7%","weight":"稅務實質課稅","markdown":"# 第 03 章：信託相關稅制全攻略（導管課稅圖解篇）\n\n---\n\n## 🎯 本章學習導航與核心地圖\n\n信託稅制的核心，是先判斷「所得或財產利益實際歸屬誰」，再依各稅法的信託專章處理。本章以現行所得稅法、遺產及贈與稅法及地方稅規定整理；「導管課稅」是重要原則，但不是所有信託、所有所得都完全採同一處理。\n\n![💧 信託所得稅：透明水管「管道穿透理論」](images/chart_03_01.svg)\n\n---\n\n## 💧 一、所得稅：以受益歸屬為核心的導管課稅\n\n### 1. 什麼是「管道穿透理論」？\n*   **白話生活比喻**：\n    一般信託可把信託專戶想成「導管」：受託人依所得類別計算信託財產收入，再依受益權歸屬分配給受益人課稅。但所得稅法第 3 條之 4 對受益人不特定、尚未存在，以及符合要件的公益信託等另有規定，因此不能把「全部信託一律穿透」當成絕對規則。\n*   **課稅時點：所得發生年度即時穿透課稅（導管原則）**\n    對受益人已特定且存在的一般信託，受託人原則上按所得發生年度計算所得，並依受益比例歸屬受益人；實際何時把現金撥付出去，不是唯一判斷標準。\n    *   **黃金案例**：老張將大樓信託出租，約定租金孳息全贈與兒子小張（他益信託）。113 年度產生租賃所得 240 萬元，雖然合約約定「累積至 115 年小張出國時整筆撥付」，在小張已特定且存在、且無其他特別規定的前提下，這 240 萬元原則上應歸屬 113 年度所得；受託人並依所得稅法第 92 條之 1 辦理次年度信託所得資料申報。\n\n![📅 信託所得稅報稅申報與憑單填發關鍵時程](images/chart_03_02.svg)\n\n### 2. 所得稅納稅義務人判斷三部曲\n\n| 信託形態 | 誰來繳納所得稅？ | 計算與申報方式 |\n| :--- | :--- | :--- |\n| **自益信託**<br/>（委託人 = 受益人） | **委託人** | 併入委託人當年度個人綜合所得總額申報 |\n| **他益信託**<br/>（特定且確定之受益人） | **受益人** | 併入受益人當年度個人綜合所得總額申報 |\n| **受益人不特定**<br/>或**尚未存在**者 | **受託人** | 由受託人就信託所得依所得稅法第 3 條之 4 規定申報納稅；適用稅率與計算方式依所得種類及相關扣繳規定辦理，不宜概括寫成「一律按最高級距」 |\n\n> **🔥 考古題必考報稅日程（必背數字）**：\n> *   受託人應於每年 **1 月底前**，依所得稅法第 92 條之 1 申報上一年度信託所得相關資料；原則上於 **2 月 10 日前**填發相關憑單。\n> *   但符合所得稅法第 94 條之 1 等規定的免填發條件時，得免主動填發；納稅義務人要求時仍應提供。\n> *   每年 1 月遇連續三日以上國定假日，申報期間依法延長至 **2 月 5 日**，相關憑單填發期間延長至 **2 月 15 日**。\n\n---\n\n## 🎁 二、贈與稅與遺產稅：視同贈與與折現計算\n\n他益信託中，若信託契約約定全部或部分信託利益由委託人以外之人享有，原則上屬遺產及贈與稅法第 5 條之 1 所稱視同贈與；仍須注意公益信託等法定例外。\n\n![🎁 他益信託視同贈與與 30 日申報期限](images/chart_03_03.svg)\n\n### 1. 贈與時點與申報期限\n*   **贈與時點**：以**信託契約成立日**、或**變更他益受益人日**、或**追加信託財產日**為贈與行為發生日。\n*   **申報期限**：依第 24 條及第 24 條之 1，若當年度贈與總額已達依法應申報的程度，應以訂定或變更信託契約日為贈與行為發生日，於法定 **30 日**期限內申報。並非每一筆他益信託都可脫離免稅額與其他法定條件，單獨用「成立後一律 30 日申報」概括。\n\n### 2. 信託利益權利的價值計算\n\n《遺產及贈與稅法》第 10 條之 2 會依受益人享有的是「全部信託利益」、「孳息以外的信託利益」或「孳息部分信託利益」採不同估價方式。以下用 1,000 萬元、10 年期、假設贈與時郵政儲金一年期定期儲金固定利率 2.0% 示意：\n\n![🧮 信託財產本金折現與孳息拆解估價模型](images/chart_03_04.svg)\n\n> **🧮 情況 A：本金他益、孳息自益**\n> * 兒子 10 年後取得 1,000 萬元本金，屬「孳息以外信託利益」。\n> * 權利價值按贈與時起至受益時止的期間複利折現：`10,000,000 ÷ (1 + 0.02)¹⁰ ≈ 8,203,483 元`。\n>\n> **🧮 情況 B：本金自益、孳息他益**\n> * 委託人 10 年後取回本金，兒子享有期間孳息，屬「孳息部分信託利益」。\n> * 若非固定利息型態，孳息部分權利價值原則上以信託金額減除前述本金現值：`10,000,000 − 8,203,483 ≈ 1,796,517 元`。\n>\n> 上述數字只是估價示意；實際贈與稅仍須再依贈與日、當時法定利率、受益內容、免稅額及其他適用規定計算。\n\n> **🔥 記憶重點**：\n> *   折現利率採用什麼利率？\n>     *   👉 **「中華郵政股份有限公司一年期定期儲金固定利率」**；實際計算要使用贈與時的適用利率。\n\n---\n\n## 🏞️ 三、土地稅：地價稅與土地增值稅\n\n土地信託是信託業務最大宗之一，土增稅動輒上百萬，課不課稅是最大關鍵！\n\n### 1. 土地增值稅之「四大不課徵」與「兩大課徵」\n\n![🌲 土地信託【不課徵】vs【應課徵】土地增值稅法定界線](images/chart_03_05.svg)\n\n### 2. 受託人賣土地時，誰繳稅？原地價怎麼算？（考超多次！）\n*   **納稅義務人**：以**受託人**為納稅義務人。\n*   **原地價起算點**：不是以「信託過戶當日」的地價算，而是以**委託人當初取得該土地時之原地價**作為基期計算漲價總數額！防止有人想用信託洗地價規避土增稅！\n\n### 3. 地價稅之課徵主體與歸戶方式\n*   **納稅義務人**：信託關係存續中，原則以**受託人**為地價稅納稅義務人。\n*   **歸戶計算不是一律按每一信託各自獨立**：土地稅法第 3 條之 1 對信託土地另定歸戶規則。一般情形會與**委託人在同一直轄市或縣（市）的土地合併計算地價總額**；如受益人已確定、享有全部信託利益，且委託人未保留變更受益人權利等法定條件成立，則依規定與受益人土地合併。\n\n---\n\n## 📜 四、契稅、營業稅與印花稅速記\n\n| 稅目 | 委託人交付信託給受託人時 | 受託人返還委託人（自益信託）時 |\n| :--- | :--- | :--- |\n| **契稅** | 信託成立時，委託人與受託人間移轉信託房屋，**不課徵契稅** | 遺囑信託及契約明定受益人為委託人的自益信託，於信託消滅時返還，**不課徵契稅**；若依信託本旨移轉給委託人以外的歸屬權利人，則依規定課徵 |\n| **營業稅** | 單純信託移轉本身不宜直接等同銷售；應看是否發生營業稅法上的「銷售貨物或勞務」 | 受託人管理或處分信託財產如實際發生銷售，除免稅項目外，應由受託人辦理稅籍、開立發票並報繳營業稅；將管理或處分收益交付受益人，則非受益人銷售貨物或勞務之代價 |\n| **印花稅** | **自益信託**成立時據以辦理不動產權利變更登記，屬形式移轉，非典賣、讓受契據，**不課印花稅** | 自益信託消滅返還委託人，同樣屬形式移轉而不課；若**他益信託**依約移轉不動產給委託人以外之歸屬權利人，且契據持憑辦理登記，按規定以契約金額 **1‰** 課印花稅 |\n\n> **💡 印花稅記憶點**：\n> 不要用「只要辦登記就一定 1‰」判斷。自益信託成立、消滅的形式移轉，不屬印花稅法的典賣、讓受不動產契據；他益信託實質移轉給第三人歸屬權利人時，才要再判斷 1‰ 印花稅。\n\n\n---\n\n## 📜 法規原文對照庫\n<details class=\"law-card\">\n  <summary>📜 查閱信託相關稅法關鍵條文原文（所得稅法、遺贈稅法、土地稅法）</summary>\n  <div class=\"law-card-content\">\n    <p><strong>所得稅法第 3 條之 4（導管穿透原則）</strong>：信託財產發生之收入，受託人應於所得發生年度，依所得稅法規定計算所得，並由受益人併入當年度所得額課徵所得稅。</p>\n    <p><strong>所得稅法第 92 條之 1（信託申報與憑單時程）</strong>：受託人應於每年 1 月底前，依規定向稽徵機關申報上一年度信託所得相關資料；憑單原則上於 2 月 10 日前填發，符合第 94 條之 1 等免填發條件者從其規定。</p>\n    <p><strong>遺產及贈與稅法第 5 條之 1、第 24 條之 1</strong>：他益信託原則上視為委託人將信託利益權利贈與受益人；其贈與行為發生日以訂定、變更信託契約日認定，申報期限再依第 24 條是否達應申報條件判斷。</p>\n    <p><strong>土地稅法第 28 條之 3（不課徵土地增值稅）</strong>：因信託行為成立、更換受託人、自益信託終止土地歸還委託人，或遺囑信託移轉予繼承人，不課徵土地增值稅。</p>\n  </div>\n</details>\n"},{"id":"c04","filename":"04_金錢信託與集合管理_實務篇.md","title":"金錢信託與集合管理","icon":"🌊","badge":"實務第一 36%","weight":"實務最大宗","markdown":"# 第 04 章：金錢信託與集合管理運用（實務篇）\n\n---\n\n## 🎯 本章學習導航與核心地圖\n\n依本站題庫整理，金錢信託、信託資金集合管理運用及運用決定權是實務科目的高頻主題。閱讀本章時，先分清楚「委託人是否保留運用決定權」，再看是否涉及集合管理及其投資限制。\n\n![🌊 金錢信託分類架構與投資決定權歸屬](images/chart_04_01.svg)\n\n---\n\n## 🧭 一、金錢信託分類架構與生活化比喻\n\n### 1. 先看「誰有運用決定權」，再看委託人指定到什麼程度\n*   **實務情境（銀行財富管理的運用決定權）**：\n    *   ① **特定金錢信託（信託業不具運用決定權）**：\n        張先生填單指定「以 100 萬元申購聯博全球高收益債券基金 A 股」。標的、金額、時點完全由客戶具體下達指示，銀行依委託人指示執行，不能把「受託」解讀成可自行更換投資標的。\n    *   ② **委託人指定營運範圍或方法、由信託業具運用決定權**：\n        李董將 2,000 萬元交付信託，指示「資金限於投資臺灣前 50 大市值權值股與 AA 級金融債券」。至於挑選哪一檔股票、何時進場，全由銀行投資團隊在約定範圍內專業裁量。\n    *   ③ **委託人不指定營運範圍或方法、由信託業具運用決定權**：\n        王奶奶交付 500 萬元安養，未作任何指示。此類金錢信託受信託業法第 32 條限制，營運範圍為：**現金及銀行存款、公債／公司債／金融債券、短期票券，以及其他經主管機關核准之業務**。\n\n| 信託類別 | 運用標的指明度 | 投資決定權歸屬 | 實務最典型應用 |\n| :--- | :--- | :--- | :--- |\n| **特定金錢信託** | 委託人就運用作具體指示 | **信託業不具運用決定權** | 依委託人指示申購特定基金、債券等 |\n| **指定營運範圍或方法之金錢信託** | 委託人先劃定範圍或方法 | **信託業在約定範圍內具運用決定權** | 依契約授權進行資產配置 |\n| **不指定營運範圍或方法之金錢信託** | 委託人未指定營運範圍或方法 | **信託業具運用決定權** | 受信託業法第 32 條法定營運範圍限制 |\n\n> **🔥 高頻考點（信託業法第 31 條）**：\n> 信託業**不得承諾擔保本金或最低收益率**。考題若把「信託」直接等同「銀行保本商品」，即與第 31 條不符。是否另有行政責任，應依信託業法罰則及具體違規情形判斷。\n\n---\n\n## 🌊 二、信託資金集合管理運用帳戶（CIT）制度\n\n「一個人拿 10 萬元買不起多檔優質標的，但一萬個人各拿 10 萬元就有 10 億元，能做分散風險的完美資產配置！」這就是**集合管理運用帳戶（簡稱集管帳戶）**的精髓。\n\n![🌊 集合管理運用帳戶 (CIT) 資金大水庫運作流程與受益權單位](images/chart_04_02.svg)\n\n### 1. 集管帳戶的設立與終止程序\n*   **設置程序要分投資人類型**：非專業投資人得參與的集合管理運用帳戶，設置前應先送同業公會審查，再轉報金管會核准；**限專業投資人**的帳戶，則應於確認第一筆信託資金加入後 **5 個營業日內**向主管機關申報備查。外幣計價帳戶另須經中央銀行同意。\n*   **帳戶獨立性**：集管帳戶與信託業之自有財產或其他信託帳戶必須**嚴格獨立設帳、分別管理**。\n*   **受益人會議不是所有變更的單一程序**：管理及運用計畫、約定條款的變更，依管理辦法辦理核准或備查及通知；帳戶終止等事項則依約定條款與法規判斷是否須經受益人會議決議。\n\n---\n\n## 📊 三、集管帳戶投資限制與流動性比率\n\n對非專業投資人得參與的集合管理運用帳戶，法規設有投資集中度、同一金融機構曝險與流動性資產等限制：\n\n![⚖️ 集合管理運用帳戶【雙十投資比率】與防弊風險限制](images/chart_04_03.svg)\n\n### 1. 核心投資比率速記對照表\n\n| 限制項目 | 法定比率上限 / 規定 | 制定目的（為什麼這樣規定？） |\n| :--- | :--- | :--- |\n| **單一公司／標的集中度** | 投資於任一上市、上櫃公司發行的股票、存託憑證、公司債、金融債券及短期票券，分別不得超過個別帳戶**投資當日淨資產價值 10%** | 控制單一發行人曝險 |\n| **全體帳戶投資單一公司上限** | 該公司**實收資本額的 10%** | 防止集合管理資金過度集中於單一公司 |\n| **同一金融機構曝險** | 存款＋該機構發行金融債券＋其保證公司債及短期票券，合計不得超過**全體集合管理運用帳戶淨資產總值 30%**，且不得超過**該金融機構淨值 10%** | 控制對單一金融機構的集中風險 |\n| **流動性資產最低比率** | 個別集合管理運用帳戶流動性資產至少為**淨資產價值 5%** | 保留現金、銀行存款、公債、短期票券等流動性部位 |\n\n> **🔥 考古題常見陷阱（何者錯誤）**：\n> *   題目：集管帳戶得投資於單一公司股票達該集管帳戶淨資產價值 20%？\n>     *   👉 **錯！** 法定上限為 **10%**！\n> *   題目：集管帳戶流動性資產可以由各信託業自行決定、完全沒有法定下限？\n>     *   👉 **錯！** 現行《集合管理運用金錢信託流動性資產範圍及比率準則》規定，個別帳戶流動性資產最低比率為**淨資產價值 5%**。\n\n---\n\n## 💱 四、外幣金錢信託實務規範\n\n外幣信託與外幣計價集合管理運用帳戶，除金融監理規定外，還要遵守中央銀行的外匯規範：\n\n1.  **外幣計價集合管理運用帳戶**：設置時應經中央銀行同意。\n2.  **收付幣別**：加入、退出及相關費用原則上以信託業選定之外幣收付，選定後不得任意變更。\n3.  **匯出、匯入**：涉及資金匯出、匯入時，依中央銀行相關規定辦理。\n4.  **投資標的限制**：外幣計價集合管理運用帳戶應運用於外幣計價標的，且不得涉及或連結新臺幣利率及匯率指標商品。\n"},{"id":"c05","filename":"05_有價證券信託與員工持股_實務篇.md","title":"有價證券與員工福利信託","icon":"📈","badge":"實務 39%","weight":"股票與借券","markdown":"# 第 05 章：有價證券信託與企業員工福利信託（實務篇）\n\n---\n\n## 🎯 本章學習導航\n\n依本站題庫整理，有價證券信託、借券、員工福利信託及股票表決權都是實務高頻考點。本章特別區分《信託法》的一般公示規則與《信託業法》對信託業的特別規定，避免把不同法律層次混在一起。\n\n![📊 有價證券信託與企業員工福利信託雙核心全景架構](images/chart_05_01.svg)\n\n---\n\n## 📈 一、有價證券信託：公示與對抗要件\n\n### 1. 一般信託與信託業要分開看\n\n依《信託法》第 4 條：\n1. 以有價證券為信託者，應依目的事業主管機關規定，在證券或其他表彰權利文件上**載明為信託財產**；否則不得對抗第三人。\n2. 股票或公司債券另須**通知發行公司**，否則不得對抗該公司。\n\n但信託業另有《信託業法》第 20 條的特別規定：\n* 信託業將自有財產與信託財產分別管理，並以信託財產名義表彰者，其以信託財產為交易時，得對抗第三人，不適用《信託法》第 4 條第 2 項的一般規定。\n* 信託財產為股票或公司債券，信託業以信託財產名義表彰並辦妥**信託過戶登記**者，視為已通知發行公司。\n\n因此，不能把「實體股票背書＋通知公司」說成所有有價證券信託都必須完成的固定兩步驟。\n\n![📝 有價證券信託公示與信託業特別規則](images/chart_05_02.svg)\n\n---\n\n## 🔄 二、有價證券借貸（借券）\n\n金管會函釋允許信託業就員工持股信託及客戶交付的有價證券，在符合條件時參與證券交易所的有價證券出借業務。\n\n### 1. 核心法規條件\n* 信託契約屬於**委託人未保留運用決定權**。\n* 信託契約應明定「**委託人同意受託人得出借有價證券**」。\n* 實際出借、擔保品、追繳與權益補償等作業，依證券交易所、櫃買中心及相關借券制度規則辦理。\n\n![🔄 有價證券借貸交易與風險控管架構](images/chart_05_03.svg)\n\n> **考點提醒**：市場上的某些借券制度會設定特定擔保比率或追繳門檻，但不能把「140%／120%」寫成所有有價證券信託借券一律適用的法定比例。題目仍要先看它問的是哪一種借券制度及當時適用規則。\n\n---\n\n## 👥 三、員工持股信託與員工福利儲蓄信託\n\n依金管會「信託 2.0」相關政策與實務分類，常見的員工福利信託可分為：\n\n* **員工持股信託（ESOT）**：員工薪資提存及企業獎勵金交付信託，由受託人依信託契約與持股會等指示，主要投資於**員工任職公司的股票**。\n* **員工福利儲蓄信託（EFST）**：同樣可由員工提存與企業獎勵形成信託資金，但投資範圍可依契約擴及國內外基金及其他有價證券，用來分散單一公司股票風險。\n\n![⚖️ 員工持股信託與員工福利儲蓄信託比較](images/chart_05_04.svg)\n\n| 比較維度 | 員工持股信託（ESOT） | 員工福利儲蓄信託（EFST） |\n| :--- | :--- | :--- |\n| **主要投資方向** | 員工任職公司的股票 | 依契約可配置基金、其他國內外有價證券等 |\n| **主要目的** | 員工參與企業持股、長期資產累積 | 員工福利儲蓄與較多元的資產配置 |\n| **權利義務來源** | 信託契約、持股會規範及相關法令 | 信託契約、福利儲蓄制度及相關法令 |\n\n> **稅務與離職處理**：企業獎勵金何時構成員工所得、離職時公司提撥部分如何歸屬，不宜用單一固定答案概括；應依具體信託契約、獎勵辦法及所得稅規定判斷。\n\n---\n\n## 🗳️ 四、股票表決權由誰行使？\n\n《信託業法》第 20 條之 1 規定，信託業的信託財產為股票時：\n1. 表決權可與其他信託財產及信託業自有財產**分別計算**。\n2. **信託業行使表決權時，應依信託契約約定辦理。**\n\n因此，受託銀行不是「完全不能行使表決權」，也不能一律說「一定由員工持股會代表親自行使」。真正的判斷順序是先看信託契約如何約定，再依相關公司法、證券法規及信託業規範辦理。\n\n![🗳️ 員工持股信託股票表決權行使原則](images/chart_05_05.svg)\n\n---\n\n## 🚪 五、離職、退休與信託財產返還\n\n員工離職、退休、死亡或退出制度時，信託財產如何返還，主要依**信託契約、員工持股會／福利儲蓄制度規章及企業獎勵條件**辦理。\n\n常見安排可能包含現物股票撥轉、出售後交付現金，或對企業獎勵部分設計服務年資歸屬條件；這些屬契約設計，不能直接寫成所有員工福利信託都適用的法定比例或一律沒收規則。\n"},{"id":"c06","filename":"06_不動產信託與資產證券化_實務篇.md","title":"不動產信託與資產證券化","icon":"🏗️","badge":"實務 18%","weight":"REITs/SPT","markdown":"# 第 06 章：不動產信託與資產證券化（實務篇）\n\n---\n\n## 🎯 本章學習導航\n\n本章分成三個層次：一般不動產信託、不動產證券化（REITs／REATs），以及金融資產證券化的特殊目的信託（SPT）。學習時要特別區分「市場常見做法」與「法律明文要求」。\n\n![🏢 不動產開發信託與買賣價金信託安全架構](images/chart_06_01.svg)\n\n---\n\n## 🏗️ 一、不動產開發信託與買賣價金信託\n\n不動產信託可藉由受託人管理土地、建築資金或買賣價金，降低資金遭挪用或產權處分失控的風險；但信託本身**不等於政府保證完工，也不等於銀行保證建商履約**。\n\n![🧱 不動產開發信託與價金信託風險隔離架構](images/chart_06_02.svg)\n\n| 項目 | 不動產開發信託 | 買賣價金信託 |\n| :--- | :--- | :--- |\n| **常見信託財產** | 土地、開發資金及與開發有關的權利，依契約設計 | 購屋人繳交的價金或預收款 |\n| **主要功能** | 依信託契約控管土地與開發資金 | 將買方價金與建商自有資金分離管理 |\n| **續建／完工** | 是否有續建安排，要看契約、履約保證機制及參與機構 | 價金信託本身不當然提供續建或完工保證 |\n\n> **實務提醒**：建經公司續建、完工承諾、價金返還等，可能是個別建案契約或其他履約保證制度的一部分，不宜寫成《信託法》一律強制的效果。\n\n---\n\n## 🏢 二、不動產證券化：REITs 與 REATs\n\n![🏢 REITs 與 REATs 法規重點比較](images/chart_06_03.svg)\n\n### 1. 法律架構比較\n\n| 比較項目 | 不動產投資信託（REITs） | 不動產資產信託（REATs） |\n| :--- | :--- | :--- |\n| **基本架構** | 受託機構募集或私募資金，依不動產投資信託計畫投資不動產或相關權利 | 委託人將既有不動產或相關權利信託，由受託機構依計畫發行受益證券 |\n| **存續期間** | 不動產投資信託契約依法應記載**基金存續期間** | 不動產資產信託計畫與契約亦應記載**存續期間** |\n| **追加募集** | 法規設有追加募集／追加私募程序，原則上須依規定取得受益人會議決議並辦理申請或申報 | 是否及如何變更發行內容，應依不動產資產信託計畫、契約及主管機關規定辦理，不宜用「一律不得追加發行」概括 |\n| **收益分配** | 信託契約每年配息比率應為**可分配收益 90% 以上**；依《不動產證券化條例》第 28 條，契約約定應分配的收益應於**會計年度結束後 6 個月內**分配 | 依不動產資產信託契約約定本金、利益、孳息及其他收益的分配方式 |\n| **借款** | 可在法令與契約允許範圍內借款；現行處理辦法依信用評等等級設定 **50%／35%／25%／15%** 的借款總額上限 | 依不動產資產信託契約所載借款事項與相關法規辦理 |\n\n> **考點**：REITs 的「90%」與「6 個月」是兩個不同層次的規定：前者是契約每年配息比率，後者是已約定應分配收益的法定分配期限。\n\n---\n\n## 💳 三、金融資產證券化：特殊目的信託（SPT）\n\n金融機構可以依《金融資產證券化條例》將特定金融資產移轉或信託予受託機構，依資產信託證券化計畫發行受益證券。核心目的之一，是讓證券化資產依信託架構獨立管理，並依計畫把現金流分配給受益證券持有人。\n\n![🏛️ 金融資產證券化特殊目的信託與資產隔離架構](images/chart_06_04.svg)\n\n### 1. 不要把「破產隔離」講成絕對保證\n\n* 資產是否有效移轉、債務人通知／公告、信託財產的範圍及權利負擔，應依《金融資產證券化條例》與證券化計畫判斷。\n* 「完成證券化就一定從創始機構資產負債表除列」、「一定完全無追索權」屬會計與契約層次問題，不能僅靠「SPT」三個字直接推定。\n* 受託機構原則上不得以信託財產借款；若資產信託證券化計畫另有規定，借款目的依第 14 條限於**配發利益、孳息或其他收益**。\n\n---\n\n### 2. 優先／次順位與信用增強\n\n![📊 資產證券化優先與次順位分券架構](images/chart_06_05.svg)\n\n證券化計畫可設計不同種類或順位的受益證券：\n* **優先順位**：依計畫約定享有較優先的本金或收益分配順位。\n* **次順位／劣後順位**：通常先承擔資產池損失，因此可作為信用增強的一種設計。\n* **超額擔保**：資產池價值高於發行證券金額時，可形成額外緩衝，但實際效果仍依資產品質、契約及證券化計畫而定。\n\n不要把「優先順位一定 AAA」或「次順位一定先賠到歸零」視為法律固定結果；實際順位與信用評等仍依發行條件及評等結果判斷。\n"},{"id":"c07","filename":"07_公益信託與特殊形態信託_實務篇.md","title":"公益信託與基金安養照護","icon":"🏛️","badge":"法規 12%","weight":"公益與信託2.0","markdown":"# 第 07 章：公益信託、基金保管與安養照護信託（實務篇）\n\n---\n\n## 🎯 本章學習導航與核心地圖\n\n本章整理三個常見實務模組：公益信託、基金保管機構，以及高齡安養與身心障礙者照護信託。涉及法規的部分，以《信託法》及金管會現行投信投顧規範為準；高齡照護信託則多屬契約設計與實務安排，不宜把契約條款誤寫成法律一律強制。\n\n![🌟 特殊形態信託三大核心支柱全景架構](images/chart_07_01.svg)\n\n---\n\n## 🏛️ 一、公益信託：回饋社會的法定架構（信託法第 69~85 條）\n\n公益信託可用於獎助學、醫療救助、文化、環境保育等公共利益目的。依《信託法》第 70 條，公益信託的設立及其受託人均須經目的事業主管機關許可，並受該主管機關持續監督。\n\n![🏛️ 公益信託設立許可、信託監察人必設與年度申報法定體系](images/chart_07_02.svg)\n\n### 1. 公益信託 vs 私益信託 必考差異表\n\n| 比較項目 | 私益信託（一般民事/商業信託） | 公益信託（信託法第 8 章） |\n| :--- | :--- | :--- |\n| **設立方式** | 原則上以契約或遺囑為之 | 契約、遺囑；另依第 71 條，**法人**為增進公共利益，經決議及主管機關許可後，得以宣言方式成立公益信託 |\n| **主管機關許可** | 一般私益信託無公益信託的許可程序 | 公益信託之設立及受託人，**均應經目的事業主管機關許可** |\n| **信託監察人設置** | 依信託行為或法律規定選任 | 第 75 條明定公益信託**應置信託監察人** |\n| **受託人辭任規定** | 經委託人及受益人同意得辭任 | **非有正當理由，並經主管機關許可，不得辭任** |\n| **信託消滅財產歸屬** | 依第 65 條及信託行為約定處理 | **先看信託行為有無約定歸屬權利人**；若沒有，第 79 條規定主管機關得為類似目的使信託關係存續，或移轉予有類似目的之公益法人或公益信託 |\n\n> **🔥 考古題必考三大陷阱（何者錯誤）**：\n> *   **陷阱 1**：公益信託之主管機關一律為金融監督管理委員會？\n>     *   👉 **錯！** 是依其業務性質由各「**目的事業主管機關**」管轄（例：助學金歸教育部、醫療救助歸衛福部、環境保育歸環境部）。\n> *   **陷阱 2**：公益信託得由委託人自由決定是否設置信託監察人？\n>     *   👉 **錯！** 法律明定**「應」**設置信託監察人，一人或數人均可。\n> *   **陷阱 3**：公益信託消滅時，一律由法律直接把剩餘財產移給類似公益法人？\n>     *   👉 **錯。** 第 79 條的前提是「**沒有信託行為所定的歸屬權利人**」。在此前提下，主管機關才得為類似目的使信託關係存續，或將財產移轉予有類似目的之公益法人或公益信託。\n\n### 2. 年度監督與申報\n依《信託法》第 72 條，受託人應**每年至少一次**，將信託事務處理情形及財務狀況送公益信託監察人審核後，報請主管機關核備並公告。法律本文並沒有一律規定「會計年度終了後 3 個月內」；若各目的事業主管機關另有許可監督規定，則另依該規定辦理。\n\n---\n\n## 🏦 二、保管機構業務：基金投資人的守門員\n\n證券投資信託基金的資產應與投信事業及基金保管機構的自有財產分別獨立；基金保管機構並依法律、命令及證券投資信託契約，按基金帳戶別獨立設帳保管基金資產。\n\n![🤝 共同基金運作機制：投信 (決策) 與保管機構 (保管) 雙權分立](images/chart_07_03.svg)\n\n### 1. 防弊防火牆：投信公司與保管機構持股限制\n*   依《證券投資信託基金管理辦法》第 59 條，信託公司或兼營信託業務之銀行，如投資於該投信事業已發行股份總數**達 10% 以上**，或該投信事業持有其已發行股份總數**達 10% 以上**，原則上不得擔任該投信事業之基金保管機構；但經金管會核准者例外。\n*   同條另列董事、監察人交叉任職、同一金融控股公司子公司或互為關係企業等限制，不能只用「10%」概括所有不適格情形。\n\n---\n\n### 2. 全權委託保管銀行業務與越權交易監督防線\n\n全權委託投資業務必須建立「越權交易之防範」控制作業，保管機構亦須依全權委託契約及相關法令辦理保管、收付與監督。若投資指示逾越契約或法令限制，應依適用法規、契約及內部控制程序處理；教材不再把特定業者作業流程（例如一律拒絕交割、固定副知特定機關、由投信自有資金承接）寫成所有案件都適用的法定程序。\n\n---\n\n## 👵 三、高齡安養與身心障礙者照護信託\n\n面對台灣超高齡社會與少子化，長輩最擔心的兩件事：\n1. 萬一失智或生重病，辛苦存的養老金被不孝子孫騙走提領一空。\n2. 留給身心障礙子女的照顧費用，在父母百年後被親戚霸佔挪用。\n\n![👵 高齡安養信託專款專用與信託監察人防護罩機制](images/chart_07_04.svg)\n\n*   **專款專用機制**：長輩的生活費、護理院月費、醫療開銷直接由銀行受託帳戶撥付給安養院或醫院，不經由旁人之手，防止遭到金融剝削。\n*   **可透過契約增加監督機制**：一般私益安養信託並非法律一律強制設置信託監察人；實務上可依需求在契約中設計信託監察人、共同簽核、定期報告或特定支出條件。監察人的權限以信託行為及法律規定為準，也不能宣稱能「絕對」排除所有詐騙或不當處分風險。\n"},{"id":"c08","filename":"08_歷屆考題高頻數字與易錯陷阱速查手冊.md","title":"高頻數字與陷阱速查手冊","icon":"⚡","badge":"考前衝刺","weight":"速記祕笈","markdown":"# 第 08 章：歷屆考題高頻數字與易錯陷阱速查手冊（衝刺篇）\n\n---\n\n## 🎯 本章使用說明\n\n信託業務人員測驗中，**「數字記憶」**與**「何者錯誤」逆向題型**（在 2,860 題中佔了 666 題，比例高達 **23.3%**）往往是能否順利通關的分水嶺。\n本手冊整理本站歷屆題庫常見的數字、期間、比率與法規名詞，並以法務部、財政部及金管會現行法規資料為校對基準。若題庫舊題與現行法規不一致，以現行法規為準。\n\n---\n\n## ⏱️ 一、必考「時間與期間」速查金榜\n\n![⏱️ 信託法規關鍵法定期間總彙整](images/chart_08_01.svg)\n\n| 法定期間 | 法規依據 | 核心事件與考點情境 | 陷阱防範提醒 |\n| :--- | :--- | :--- | :--- |\n| **20 日前** | 金融資產證券化條例第 24 條 | 受託機構或信託監察人召集受益人會議，應於開會 **20 日前**書面通知各受益人。 | 常被改成「10 日前」或「30 日前」 |\n| **30 日** | 遺產及贈與稅法第 24 條、第 24 條之 1 | 委託人有第 5 條之 1 的應課徵贈與稅情形時，以訂定或變更信託契約日為贈與行為發生日；**達第 24 條應申報條件者**，於 30 日內申報。 | 先判斷是否達年度贈與應申報條件，不要把所有他益信託一律寫成「成立後 30 日必報」。 |\n| **1 個月** | 信託業法第 34 條 | 信託業取得營業執照後，應於 **1 個月內**以現金或政府債券繳存賠償準備金於中央銀行。 | 常被改成「3 個月」或「營業前」 |\n| **2 個月 / 4 個月** | 信託業法第 39 條、施行細則第 17 條 | 半年度營業報告書及財務報告：**半年度終了後 2 個月內**；年度資料：**年度終了後 4 個月內**辦理申報／公告。 | 不要和信託財產「每 3 個月評審一次」混淆。 |\n| **3 個月** | 信託業法第 21 條 | 信託業的**信託財產評審委員會每 3 個月至少評審一次**，並報告董事會。 | 不要與公益信託年度報告混淆 |\n| **6 個月** | 信託法第 6 條第 3 項<br/>不動產證券化條例第 28 條 | 1. 信託行為成立後 **6 個月內**委託人受破產宣告者，推定該信託行為有害及債權。<br/>2. REIT 依契約約定應分配之收益，應於會計年度結束後 **6 個月內**分配。 | 「90% 配息比率」與「6 個月分配期限」法源不同 |\n| **1 年 / 10 年** | 信託法第 7 條 | 詐害信託撤銷權：<br/>• 自債權人**知有撤銷原因起 1 年**不行使而消滅。<br/>• 自信託行為**成立時起逾 10 年**者亦同。 | 可用「知一成十」記憶，但仍以條文要件為準 |\n| **1 月底前** | 所得稅法第 92 條之 1 | 受託人應填具上一年度各信託的財產目錄、收支計算表、所得額與扣繳稅額等相關文件，向稽徵機關列單申報。 | 每年 1 月遇連續 3 日以上國定假日，申報期間延長至 2 月 5 日 |\n| **2 月 10 日前** | 所得稅法第 92 條之 1、第 94 條之 1 | 原則上於每年 **2 月 10 日前**填發相關憑單；符合免填發條件者得免主動填發，納稅義務人要求時仍應提供。 | 遇法定連續假期時，填發期間延長至 2 月 15 日 |\n\n---\n\n## 💰 二、必考「金額、比率與避坑防線」速查金榜\n\n![💰 信託法規金額門檻與關鍵投資比率全景速查對照表](images/chart_08_02.svg)\n\n| 項目門檻 | 正確法定數字 | 法規依據 | 記憶口訣與高頻避坑陷阱 |\n| :--- | :--- | :--- | :--- |\n| **信託公司最低實收資本額** | **新臺幣 20 億元**<br/>• 僅辦理 REIT：10 億元<br/>• 僅辦理 REAT：3 億元 | 信託業設立標準第 3、4 條 | 發起人及股東出資以現金為限；發起人應於發起時**一次認足發行股份總額，並至少繳足 20% 股款** |\n| **賠償準備金最低門檻** | **新臺幣 5,000 萬元** | 信託業法第 34 條<br/>主管機關公告標準 | 取得執照後 1 個月內以現金或政府債券繳存中央銀行；委託人或受益人有**優先受償權**。每年並依主管機關公告按受託財產計提。 |\n| **營業保證金辨識** | 《信託業法》第 34 條規範的是**賠償準備金** | 信託業法第 34 條 | 若選項把一般信託業的第 34 條寫成「向國庫提存資本額 5% 的營業保證金」，即與現行條文不符。 |\n| **信託業利害關係人持股標準** | **5%**（主要股東）<br/>**10%**（負責人持股企業） | 信託業法第 7 條 | 掌握「**5%**（持有信託業股份）」與「**10%**（負責人等持有企業股份）」兩大關鍵數字！ |\n| **集管帳戶投資單一標的上限** | **10%**（雙十原則） | 信託資金集合管理運用管理辦法第 9 條 | • 個別帳戶投資任一公司總額不得超過該帳戶淨資產 **10%**<br/>• 全體帳戶投資任一公司總額不得超過該公司實收資本額 **10%** |\n| **同一金融機構曝險** | **全體集管帳戶 NAV 30%** 且 **該金融機構淨值 10%** | 同辦法第 9 條第 7 款 | 存款＋該金融機構發行之金融債券＋其保證之公司債及短期票券合併計算 |\n| **集管帳戶流動性資產** | 個別帳戶至少 **NAV 5%** | 集合管理運用金錢信託流動性資產範圍及比率準則第 3 條 | 未達最低比率時應即調整 |\n| **REIT 收益分配** | 契約每年配息比率 **90% 以上**；契約約定應分配之收益於年度終了後 **6 個月內**分配 | 《受託機構募集或私募不動產投資信託或資產信託受益證券處理辦法》契約應記載事項；《不動產證券化條例》第 28 條 | **90% 是契約配息比率要求；6 個月是已約定應分配收益的分配期限，兩者不要混成同一條規定** |\n| **全權委託投資業務資本額辨析** | 投信：**3 億元**<br/>投顧：**3 億元**（免受 20 倍限制） | 投信事業設置標準第 7 條<br/>全權委託投資業務管理辦法第 13 條 | 投信公司門檻為 3 億元；投顧代操若達 3 億元則接受委託金額不受淨值 20 倍限制。 |\n\n---\n\n## 🗳️ 三、必考「會議與表決權門檻」\n\n| 會議與主體 | 事項與法規依據 | 法定出席門檻 | 法定決議同意門檻 |\n| :--- | :--- | :--- | :--- |\n| **銀行董事會** | 銀行法第 33 條：對利害關係人擔保授信達主管機關規定金額 | **董事三分之二以上出席**（2/3） | **出席董事四分之三以上同意**（3/4） |\n| **土地信託受益人會議** | 信託業法第 26 條：以開發為目的之土地信託借入款項 | **受益權總數三分之二以上出席**（2/3） | **出席表決權數過半數同意**（二分之一以上） |\n| **證券化受益人會議** | 金融資產證券化條例第 25 條：普通決議事項 | **表決權總數二分之一以上出席**（過半數） | **出席受益人表決權過半數同意** |\n| **證券化受益人會議** | 金融資產證券化條例第 26 條：決議有損害特定種類受益人之權利 | **該特定種類表決權總數二分之一以上出席** | **出席受益人表決權三分之二以上同意** |\n| **受益人請求召集門檻** | 金融資產證券化條例第 24 條：受益人請求召集會議 | **持有本金持分總數 3% 以上**<br/>（請求後 15 日不召集得報主管機關許可自行召集） | 開會 **20 日前**書面通知；重大事項（解任、變更契約）**不得以臨時動議提出**！ |\n\n---\n\n## 🚨 四、「何者錯誤」三大逆向陷阱破題直覺法則\n\n歷屆題目常以「極端字眼」或「張冠李戴」設計干擾選項；判斷時仍應回到法條的原則、例外與適用前提：\n\n![⚠️ 歷屆信託考題三大高頻文字陷阱辨識指南](images/chart_08_03.svg)\n\n1.  **先看「原則」再看「法定例外」**：\n    信託業法第 25 條原則上禁止以信託財產從事本身或利害關係人交易，但第 2 項明定：信託契約約定信託業**不具運用決定權**者，不受第 1 項限制；政府發行之債券亦屬例外。看到「絕對禁止、任何情況都不能」時，要先檢查題目是否忽略法定例外。\n2.  **「應」vs「得」文字遊戲**：\n    *   公益信託依第 75 條**應置信託監察人**；這是明文義務。\n    *   受託人**原則上應親自處理**信託事務（寫「得隨意委託他人」者錯誤）。\n3.  **「信託財產獨立性」要把法定例外背完整**：\n    信託法第 12 條原則上禁止對信託財產強制執行，但例外包括：**信託前已存在於該財產之權利、因處理信託事務所生之權利，以及其他法律有特別規定者**。\n"}],"quizzes":{"c01":[{"id":"c01_q01","source_id":"past-52-law-2","source_chapter":"c01","term":52,"period":52,"subject":"信託法規","number":2,"stem":"某甲將公司債交付信託，已依規定辦理信託公示，但未通知該公司債發行公司，則該信託行為之效力為何？","options":["(1) 無效","(2) 有效，但不能對抗第三人","(3) 無效，但能對抗第三人","(4) 有效，但不能對抗該發行公司"],"answer":3,"topic":"成立方式與信託分類","conceptId":"concept-2","frequency":154,"topicRank":1,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「成立方式與信託分類」共出現 154 題，章內出題頻率第 1 名。\n💡 本題選自第 52 期，官方公布正確答案為第 (3) 個選項。"},{"id":"c01_q02","source_id":"past-56-law-26","source_chapter":"c01","term":56,"period":56,"subject":"信託法規","number":26,"stem":"信託業收受以公司債為信託財產之信託，經償還後轉化為金錢，併為信託財產運用，係屬於下列何種信託？","options":["(1) 金錢之信託","(2) 金錢債權之信託","(3) 有價證券之信託","(4) 動產之信託"],"answer":2,"topic":"成立方式與信託分類","conceptId":"concept-2","frequency":154,"topicRank":1,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「成立方式與信託分類」共出現 154 題，章內出題頻率第 1 名。\n💡 本題選自第 56 期，官方公布正確答案為第 (2) 個選項。"},{"id":"c01_q03","source_id":"past-60-law-19","source_chapter":"c01","term":60,"period":60,"subject":"信託法規","number":19,"stem":"下列     function highlightLegalText(html) {
      if (!html) return '';
      // 透過正則匹配所有 HTML 標籤 (<[^>]+>)，只對標籤之外的純文字節點做關鍵詞高亮，絕不破壞標籤與屬性！
      return html.replace(/(<[^>]+>)|([^<]+)/g, (match, tag, text) => {

        res = res.replace(/(應於|應經|應向|應由|必須|應提列|強制)/g, '<span class="legal-word legal-duty">$1</span>');
        res = res.replace(/(得由|得向|得經|可行|任選)/g, '<span class="legal-word legal-allow">$1</span>');
        res = res.replace(/(但書|但|若|如遇)/g, '<span class="legal-word legal-condition">$1</span>');
        res = res.replace(/(\d+個月|\d+年|\d+日內|即日起|屆滿)/g, '<span class="legal-word legal-time">$1</span>');
        return res;
      });
    }

    // 表格包裹器：桌機表格、平板自適應、手機自動轉卡片。
    renderer.table = function(header, body) {

    function enhanceResponsiveTables(root) {
      if (!root || typeof root.querySelectorAll !== 'function') return;

      root.querySelectorAll('.table-scroll-wrapper').forEach(wrapper => {
        const table = wrapper.querySelector('table');
        if (!table) return;

        const headers = Array.from(table.querySelectorAll('thead th')).map((th, index) => {
          const label = (th.textContent || '').trim();
          return label || `欄位 ${index + 1}`;
        });

        table.querySelectorAll('tbody tr').forEach(row => {
          Array.from(row.children).forEach((cell, index) => {
            if (!cell || String(cell.tagName || '').toLowerCase() !== 'td') return;
            cell.setAttribute('data-label', headers[index] || `欄位 ${index + 1}`);
          });
        });
      });
    }

    marked.setOptions({
      renderer: renderer,
      breaks: true,
      gfm: true
    });

      const img = document.getElementById('lightboxImg');
      if (!img) return;
      currentScale = Math.max(0.4, Math.min(4.0, currentScale * factor));
      img.style.transform = `scale(${currentScale})`;

    // ==================== 2. 全真歷屆題庫系統 (極速按需切片與快取) ====================
    function filterBankQuestions() {
      const chapter = courseData.chapters[currentChapterIndex];
      const bankData = window.EXAM_BANK_DATA || courseData.full_bank || {};
      const allItems = bankData[chapter.id] || [];

      const statusEl = document.getElementById('bankStatusText');
      if (allItems.length === 0) {
        if (!window.EXAM_BANK_DATA) {
          if (statusEl) statusEl.innerHTML = '⚡ 歷屆題庫資料載入中，請稍候...';
          setTimeout(filterBankQuestions, 300);
          return;
        }
        if (statusEl) statusEl.textContent = '此單元無單獨歷屆真題。';
        filteredBankQuestions = [];
        renderBankQuestions();
        return;
      }

      const periodVal = document.getElementById('bankPeriodSelect') ? document.getElementById('bankPeriodSelect').value : 'all';
      const onlyWrong = document.getElementById('bankOnlyWrongCheckbox') ? document.getElementById('bankOnlyWrongCheckbox').checked : false;
      const conceptVal = document.getElementById('bankConceptSelect') ? document.getElementById('bankConceptSelect').value : 'ALL';

      filteredBankQuestions = allItems.filter(q => {
        // 期數過濾
        if (periodVal === 'latest') {
          if (q.term < 60) return false;
        } else if (periodVal !== 'all') {
          if (String(q.term) !== periodVal) return false;
        }

        // 73 觀念主題過濾
        if (conceptVal && conceptVal !== 'ALL') {
          if (q.topic !== conceptVal) return false;
        }

        // 僅看錯題
        if (onlyWrong) {
          const qid = `bank_${q.id || (q.term + '_' + q.number)}`;
          const ans = userAnswers[qid];
          if (ans === undefined || ans === q.answer) return false;
        }

        return true;
      });

      if (statusEl) {
        statusEl.textContent = `共符合 ${filteredBankQuestions.length} / ${allItems.length} 題`;
      }

      currentBankPage = 0;
      renderBankQuestions();
    };

    function changeBankPage(delta) {
      const totalPages = Math.ceil(filteredBankQuestions.length / BANK_PAGE_SIZE) || 1;
      const newPage = currentBankPage + delta;
      if (newPage >= 0 && newPage < totalPages) {
        currentBankPage = newPage;
        renderBankQuestions();
        const fullBankArea = document.getElementById('fullBankArea');
        if (fullBankArea) fullBankArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    function renderBankQuestions() {

        if (pageIndicator) pageIndicator.textContent = '第 1 / 1 頁';
        if (prevBtn) prevBtn.disabled = true;
        if (nextBtn) nextBtn.disabled = true;
        return;
      }

      const start = currentBankPage * BANK_PAGE_SIZE;
      const end = Math.min(start + BANK_PAGE_SIZE, totalItems);
      const pageQuestions = filteredBankQuestions.slice(start, end);

      container.innerHTML = '';
      const fragment = document.createDocumentFragment();

      pageQuestions.forEach((q, idx) => {

          optionsHtml += `

        card.innerHTML = `
          <div style="display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:8px;">

            ${isAnswered ? (isCorrect ? '<span style="color:var(--primary); font-size:0.8rem; font-weight:700;">✅ 已答對</span>' : '<span style="color:var(--danger); font-size:0.8rem; font-weight:700;">❌ 曾答錯</span>') : ''}
          </div>
          <div class="quiz-question" style="font-size:1.02rem; line-height:1.65; margin-bottom:12px; font-weight:600; color:var(--text-main);">

              ${isCorrect ? '🎉 答對了！掌握高頻核心' : `💡 官方公布正確答案：選項 (${correctAns})`}
            </div>

          </div>
        `;
        fragment.appendChild(card);
      });

      container.appendChild(fragment);

      if (pageIndicator) pageIndicator.textContent = `第 ${currentBankPage + 1} / ${totalPages} 頁`;
      if (prevBtn) prevBtn.disabled = currentBankPage === 0;
      if (nextBtn) nextBtn.disabled = currentBankPage >= totalPages - 1;
    }
