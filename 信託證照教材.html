<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%230369a1%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2245%22%20text-anchor%3D%22middle%22%20font-size%3D%2242%22%20fill%3D%22white%22%3E%E4%BF%A1%3C%2Ftext%3E%3C%2Fsvg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>臺灣信託業務人員專業測驗：生活圖解重點教材</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.1/marked.min.js"></script>

  <style>
    :root {
      --font-main: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* 深色模式：夜藍底、天藍主色、琥珀重點 */
      --bg-primary: #111827;
      --bg-secondary: #172033;
      --bg-tertiary: #222d42;
      --bg-card: rgba(30, 41, 59, 0.88);
      --bg-card-hover: #2c3a52;
      --border-color: rgba(148, 163, 184, 0.18);
      --border-highlight: rgba(56, 189, 248, 0.42);

      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-subtle: #94a3b8;

      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-light: rgba(56, 189, 248, 0.14);
      --accent: #fbbf24;
      --accent-light: rgba(251, 191, 36, 0.14);
      --accent-contrast: #172033;
      --warning: #f59e0b;
      --danger: #fb7185;

      --shadow-sm: 0 2px 8px rgba(2, 6, 23, 0.28);
      --shadow-md: 0 8px 24px rgba(2, 6, 23, 0.34);
      --shadow-lg: 0 16px 40px rgba(2, 6, 23, 0.46);

      --sidebar-width: 320px;
      --topbar-height: 64px;
    }

    [data-theme="light"] {
      --bg-primary: #f5f7fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #eef2f7;
      --bg-card: #ffffff;
      --bg-card-hover: #f1f5f9;
      --border-color: #d9e2ec;
      --border-highlight: rgba(2, 132, 199, 0.38);

      --text-main: #172033;
      --text-muted: #526174;
      --text-subtle: #8291a7;

      --primary: #0369a1;
      --primary-hover: #075985;
      --primary-light: #e0f2fe;
      --accent: #b45309;
      --accent-light: #fff7ed;
      --accent-contrast: #ffffff;
      --warning: #d97706;
      --danger: #dc2626;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-subtle);
    }

    /* ==================== 法規語意色彩引擎 (Legal Syntax Highlighting) ==================== */
    .legal-word {
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 3px;
      display: inline-block;
      line-height: 1.25;
    }

    /* 禁止詞 (Red) */
    .legal-ban {
      color: #f87171;
      background: rgba(239, 68, 68, 0.14);
      border-bottom: 2px solid #ef4444;
    }
    [data-theme="light"] .legal-ban {
      color: #dc2626;
      background: rgba(239, 68, 68, 0.12);
      border-bottom: 2px solid #dc2626;
    }

    /* 義務詞 (Blue) */
    .legal-duty {
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.14);
      border-bottom: 2px solid #3b82f6;
    }
    [data-theme="light"] .legal-duty {
      color: #2563eb;
      background: rgba(59, 130, 246, 0.12);
      border-bottom: 2px solid #2563eb;
    }

    /* 裁量詞 (Purple) */
    .legal-allow {
      color: #c084fc;
      background: rgba(168, 85, 247, 0.14);
      border-bottom: 1.5px dashed #a855f7;
    }
    [data-theme="light"] .legal-allow {
      color: #9333ea;
      background: rgba(168, 85, 247, 0.12);
      border-bottom: 1.5px dashed #9333ea;
    }

    /* 條件但書 (Amber) */
    .legal-condition {
      color: #fbbf24;
      background: rgba(245, 158, 11, 0.14);
      border-bottom: 1.5px solid #f59e0b;
    }
    [data-theme="light"] .legal-condition {
      color: #d97706;
      background: rgba(245, 158, 11, 0.12);
      border-bottom: 1.5px solid #d97706;
    }

    /* 時間期限 (Cyan) */
    .legal-time {
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.16);
      border-bottom: 2px double #06b6d4;
      text-shadow: 0 0 6px rgba(34, 211, 238, 0.3);
    }
    [data-theme="light"] .legal-time {
      color: #0891b2;
      background: rgba(6, 182, 212, 0.12);
      border-bottom: 2px double #0891b2;
      text-shadow: none;
    }

    /* ==================== 官方條文卡片 (Law Card Details) ==================== */
    .law-card {
      margin: 24px 0;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .law-card summary {
      padding: 14px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-tertiary);
      transition: background 0.2s;
    }
    .law-card summary:hover {
      background: var(--bg-card-hover);
    }
    .law-card-content {
      padding: 16px 20px;
      font-size: 0.92rem;
      line-height: 1.8;
      border-top: 1px solid var(--border-color);
    }
    .law-card-content p {
      margin-bottom: 12px;
    }
    .law-card-content p:last-child {
      margin-bottom: 0;
    }

    /* Layout Containers */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 30;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Top Bar */
    .topbar {
      height: var(--topbar-height);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      font-size: 1.25rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .topbar-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 本機進度狀態 Badge */
    .progress-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .btn-action {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-action.highlight {
      background: linear-gradient(135deg, var(--accent), var(--warning));
      color: var(--accent-contrast);
      border: none;
    }

    .btn-icon {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Sidebar Content */
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .brand-text p {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .search-box {
      position: relative;
    }
    .search-box input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px 10px 34px;
      min-height: 44px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus {
      border-color: var(--primary);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-size: 0.9rem;
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      min-height: 48px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      margin-bottom: 4px;
      position: relative;
    }
    .menu-item:hover {
      background: var(--bg-tertiary);
      color: var(--text-main);
    }
    .menu-item.active {
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
    }
    .menu-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 4px;
      background: var(--primary);
      border-radius: 0 4px 4px 0;
    }

    .menu-item-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .menu-item-info {
      flex: 1;
      min-width: 0;
    }

    .menu-item-title {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .menu-item-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .badge-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-subtle);
    }

    /* Content Area */
    .content-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px 36px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .article-wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    /* Markdown Styling */
    .markdown-body {
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .markdown-body h1 {
      font-size: 2.1rem;
      font-weight: 800;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .markdown-body h2 {
      font-size: 1.55rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 18px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .markdown-body h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 1.2em;
      background: var(--primary);
      border-radius: 2px;
    }

    .markdown-body h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 14px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 18px;
    }

    .markdown-body a {
      color: var(--primary);
      font-weight: 600;
      text-decoration-color: color-mix(in srgb, var(--primary) 45%, transparent);
      text-underline-offset: 3px;
    }
    .markdown-body a:hover {
      color: var(--primary-hover);
      text-decoration-thickness: 2px;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 14px 18px;
      background: var(--bg-tertiary);
      border-radius: 0 8px 8px 0;
      margin: 24px 0;
      color: var(--text-muted);
    }
    .markdown-body blockquote strong {
      color: var(--text-main);
    }

    /* ==================== 響應式表格：桌機表格 / 平板換行 / 手機卡片 ==================== */
    .table-scroll-wrapper {
      position: relative;
      width: 100%;
      margin: 1.5rem 0;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--bg-card);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-scroll-hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 14px;
      font-size: 0.78rem;
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
      user-select: none;
    }

    .table-mode-note {
      color: var(--text-muted);
      font-weight: 500;
      text-align: right;
    }

    .table-scroll-inner {
      width: 100%;
      overflow: visible;
      display: block;
    }

    .markdown-body table,
    .table-scroll-inner table {
      width: 100% !important;
      min-width: 0 !important;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.9rem;
      table-layout: auto;
    }

    .markdown-body th,
    .table-scroll-inner th {
      background: var(--bg-tertiary);
      color: var(--text-main);
      font-weight: 700;
      text-align: left;
      padding: 11px 14px;
      border-bottom: 2px solid var(--border-highlight);
      border-right: 1px solid var(--border-color);
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .markdown-body td,
    .table-scroll-inner td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      color: var(--text-muted);
      vertical-align: top;
      line-height: 1.6;
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: anywhere !important;
    }

    .markdown-body th:last-child,
    .table-scroll-inner th:last-child,
    .markdown-body td:last-child,
    .table-scroll-inner td:last-child {
      border-right: none;
    }

    .markdown-body tr:last-child td,
    .table-scroll-inner tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:hover td,
    .table-scroll-inner tr:hover td {
      background: var(--primary-light);
    }

    /* 平板：保留表格，但固定欄寬並允許標題、內容自然換行。 */
    @media (max-width: 900px) and (min-width: 641px) {
      .table-scroll-inner {
        overflow: visible !important;
      }

      .markdown-body table,
      .table-scroll-inner table {
        table-layout: fixed !important;
        width: 100% !important;
      }

      .markdown-body th,
      .table-scroll-inner th,
      .markdown-body td,
      .table-scroll-inner td {
        padding: 9px 10px;
        font-size: 0.84rem;
        white-space: normal !important;
        overflow-wrap: anywhere !important;
      }

      .table-mode-note {
        max-width: 52%;
      }
    }

    /* 手機：每一列自動轉成卡片，完全不需要左右滑動。 */
    @media (max-width: 640px) {
      .table-scroll-wrapper {
        border: none;
        background: transparent;
        box-shadow: none;
        overflow: visible;
      }

      .table-scroll-hint {
        border: 1px solid var(--border-color);
        border-radius: 9px;
        margin-bottom: 10px;
        padding: 8px 10px;
      }

      .table-mode-note {
        display: none;
      }

      .table-scroll-inner {
        overflow: visible !important;
        width: 100%;
      }

      .table-scroll-inner table,
      .markdown-body .table-scroll-inner table {
        display: block;
        width: 100% !important;
        min-width: 0 !important;
        table-layout: auto !important;
        background: transparent;
      }

      .table-scroll-inner thead {
        display: none;
      }

      .table-scroll-inner tbody {
        display: block;
        width: 100%;
      }

      .table-scroll-inner tbody tr {
        display: block;
        width: 100%;
        margin: 0 0 12px;
        border: 1px solid var(--border-color);
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        overflow: hidden;
        background: var(--bg-card);
        box-shadow: var(--shadow-sm);
      }

      .table-scroll-inner tbody td {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border-right: none !important;
        border-bottom: 1px solid var(--border-color);
        padding: 10px 12px;
        font-size: 0.92rem;
        line-height: 1.55;
        color: var(--text-main);
        background: transparent;
      }

      .table-scroll-inner tbody td::before {
        content: attr(data-label);
        display: block;
        margin-bottom: 4px;
        color: var(--text-subtle);
        font-size: 0.72rem;
        font-weight: 700;
        line-height: 1.35;
      }

      .table-scroll-inner tbody td:first-child {
        color: var(--primary);
        font-size: 1.02rem;
        font-weight: 800;
        background: var(--bg-tertiary);
        border-bottom: 1px solid var(--border-highlight);
      }

      .table-scroll-inner tbody td:first-child::before {
        display: none;
      }

      .table-scroll-inner tbody td:last-child {
        border-bottom: none;
      }

      .table-scroll-inner tbody tr:hover td {
        background: transparent;
      }

      .table-scroll-inner tbody tr:hover td:first-child {
        background: var(--bg-tertiary);
      }
    }

    .markdown-body strong {
      color: var(--primary);
      font-weight: 600;
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background: var(--border-color);
      margin: 36px 0;
    }

    /* 內頁導覽卡片連結 */
    .chapter-card-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      margin: 6px;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .chapter-card-link:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    /* ==================== 向量圖檔容器 (SVG Figure) ==================== */
    .diagram-figure {
      margin: 32px 0;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .diagram-figure:hover {
      border-color: var(--primary);
      box-shadow: 0 12px 36px rgba(16, 185, 129, 0.15);
    }

    .diagram-figure-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      gap: 12px;
    }

    .diagram-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: #10b981;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .diagram-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #f1f5f9;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-lightbox-trigger {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 12px;
      min-height: 38px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-lightbox-trigger:hover {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .diagram-img-container {
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1120;
      cursor: zoom-in;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .zoomable-svg {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      transition: transform 0.2s ease;
    }

    .diagram-caption {
      text-align: center;
      padding: 8px 16px;
      font-size: 0.82rem;
      color: var(--text-subtle);
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ==================== 題庫系統雙軌切換架構 ==================== */
    .quiz-section {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 2px dashed var(--border-color);
    }

    .quiz-tabs {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .quiz-tab-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .quiz-tab-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* 全真題庫工具列 */
    .bank-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .bank-filters {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .bank-select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      min-height: 40px;
      border-radius: 6px;
      font-size: 0.88rem;
      outline: none;
    }

    .bank-checkbox-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--warning);
      cursor: pointer;
      user-select: none;
    }
    .bank-checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .bank-status-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .chapter-high-frequency { margin-top: 28px; padding-top: 20px; border-top: 2px solid var(--border-color); }
    .chapter-high-frequency > p { color: var(--text-muted); }
    .chapter-high-frequency-list { margin-top: 16px; }

    /* 題目卡片 */
    .quiz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    .quiz-meta {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .quiz-question {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .quiz-option {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 16px;
      min-height: 48px;
      font-size: 0.95rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s ease;
      line-height: 1.5;
    }
    .quiz-option:hover {
      background: var(--bg-card-hover);
      color: var(--text-main);
      border-color: var(--primary);
    }

    .quiz-option.selected-correct {
      background: rgba(16, 185, 129, 0.2);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 700;
    }
    .quiz-option.selected-wrong {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    .quiz-explain {
      margin-top: 14px;
      padding: 14px 18px;
      background: rgba(59, 130, 246, 0.1);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text-main);
      display: none;
    }
    .quiz-explain.show {
      display: block;
    }

    /* 分頁按鈕列 */
    .bank-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-page {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 18px;
      min-height: 44px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-page:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Bottom Navigation */
    .bottom-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      min-height: 44px;
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-nav:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ==================== 圖片燈箱 (Lightbox Modal) ==================== */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 16, 0.94);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox-modal.active,
    .lightbox-modal.open {
      display: flex;
    }

    .lightbox-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px 12px 0 0;
      color: #fff;
    }

    .lightbox-title {
      font-size: 1rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lightbox-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .lb-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      min-height: 40px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .lb-btn.close {
      background: #ef4444;
      border-color: #dc2626;
    }

    .lightbox-body {
      width: 100%;
      max-width: 1200px;
      height: 80vh;
      background: #0b1120;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: none;
      border-radius: 0 0 12px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 20px;
      position: relative;
      -webkit-overflow-scrolling: touch;
    }

    .lightbox-body img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 8px;
      transition: transform 0.2s ease-out;
      user-select: none;
      shape-rendering: geometricPrecision !important;
      text-rendering: geometricPrecision !important;
      image-rendering: -webkit-optimize-contrast;
      transform-origin: center center;
    }
    @media (max-width: 768px) {
      .lightbox-body {
        padding: 10px !important;
        align-items: flex-start !important;
        justify-content: flex-start !important;
      }
      .lightbox-body img {
        min-width: 800px !important; /* 手機燈箱預設展開為 800px 高清原尺寸，任意拖曳漫遊查看！ */
        max-width: none !important;
        max-height: none !important;
      }
    }

    /* 側邊欄抽屜遮罩 (手機/平板) */
    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 25;
    }
    .sidebar-overlay.active,
    .sidebar-overlay.open {
      display: block;
    }

    /* ==================== 響應式優化 (Mobile & Tablet) ==================== */
    @media (max-width: 960px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .mobile-menu-btn {
        display: flex;
      }
      .content-container {
        padding: 20px 16px;
      }
      .markdown-body h1 {
        font-size: 1.7rem;
      }
      .markdown-body h2 {
        font-size: 1.35rem;
      }
      .progress-pill {
        display: none;
      }
    }

    /* ==================== 手機與平板極致好讀專用響應式樣式 ==================== */

    /* 表格滑動樣式已整合至全域區塊 */

    /* 觀念標籤與題目標記 */
    .topic-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--accent-light);
      color: var(--accent);
      margin-bottom: 8px;
      border: 1px solid rgba(59, 130, 246, 0.25);
    }

    /* 行動端底部浮動捷徑列 (Mobile Action Bar) */
    .mobile-bottom-bar {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 1000;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.25);
      padding: 0 8px;
      justify-content: space-around;
      align-items: center;
    }
    .mobile-bar-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 500;
      min-width: 52px;
      min-height: 48px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .mobile-bar-btn:active {
      transform: scale(0.92);
      color: var(--primary);
    }
    .mobile-bar-btn.active {
      color: var(--primary);
      font-weight: 700;
    }
    .mobile-bar-btn span.icon {
      font-size: 1.15rem;
      line-height: 1.1;
      margin-bottom: 2px;
    }

    /* 官方條文 Modal 樣式 */
    .laws-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .laws-modal-overlay.open {
      display: flex;
    }
    .laws-modal-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }
    .laws-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-card);
    }
    .laws-modal-header h3 {
      font-size: 1.1rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .laws-modal-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .law-select-box {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--bg-tertiary);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
    }
    .law-article-card {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .law-article-card h5 {
      color: var(--primary);
      margin-bottom: 6px;
      font-size: 0.95rem;
    }
    .law-article-card p {
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    /* 平板適配 (<= 1024px) */
    @media (max-width: 1024px) {
      :root {
        --sidebar-width: 280px;
      }
      #main-content {
        padding: 0 16px;
      }
      #contentContainer {
        max-width: 100%;
      }
      .table-scroll-hint {
        display: flex;
      }
    }

    /* 手機直向與小螢幕 (<= 768px) */
    @media (max-width: 768px) {
      body {
        padding-bottom: 64px; /* 留給底部快捷工具列空間 */
      }
      .mobile-bottom-bar {
        display: flex;
      }
      #topbar {
        height: 52px;
        padding: 0 12px;
      }
      #breadcrumbTitle {
        font-size: 0.88rem;
        max-width: 180px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #globalStatsPill {
        display: none;
      }
      #quickCrunchBtn {
        padding: 4px 8px;
        font-size: 0.75rem;
      }
      #themeToggleBtn {
        width: 38px;
        height: 38px;
      }

      #contentContainer {
        padding: 16px 8px;
      }
      #markdownOutput {
        font-size: 0.98rem;
        line-height: 1.75;
      }
      #markdownOutput h1 {
        font-size: 1.4rem;
        margin: 1.2rem 0 0.8rem 0;
      }
      #markdownOutput h2 {
        font-size: 1.2rem;
        margin: 1.1rem 0 0.6rem 0;
      }
      #markdownOutput h3 {
        font-size: 1.05rem;
        margin: 0.9rem 0 0.5rem 0;
      }
      #markdownOutput img {
        max-width: 100%;
        border-radius: 6px;
      }

      /* 刷題區塊手機適配 */
      #quizSection {
        padding: 16px 8px;
      }
      .bank-toolbar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      .bank-toolbar select {
        width: 100%;
      }
      .bank-card {
        padding: 14px 12px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      .bank-opt-btn {
        min-height: 48px;
        padding: 12px 14px;
        font-size: 0.92rem;
        line-height: 1.45;
        border-radius: 8px;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }
      #bankPagination {
        flex-wrap: wrap;
        gap: 8px;
      }
      #bankPrevBtn, #bankNextBtn {
        min-height: 44px;
        padding: 8px 16px;
        font-size: 0.9rem;
      }

      /* 側欄滿版抽屜 */
      #sidebar {
        width: 82%;
        max-width: 310px;
      }
    }

    /* 超窄機身 (<= 380px) */
    @media (max-width: 380px) {
      #breadcrumbTitle {
        max-width: 130px;
      }
      .bank-opt-btn {
        font-size: 0.85rem;
        padding: 10px 10px;
      }
    }



    /* topic-statistics:styles:start */
    .markdown-body .topic-stat-chart {
      min-width: 0;
      margin: 20px 0;
      padding: 24px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--bg-secondary);
      color: var(--text-main);
    }
    .markdown-body .topic-stat-heading {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 700;
    }
    .markdown-body .topic-stat-subtitle,
    .markdown-body .topic-stat-note {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .markdown-body .topic-stat-list {
      list-style: none;
      margin: 20px 0;
      padding: 0;
    }
    .markdown-body .topic-stat-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 108px;
      align-items: center;
      gap: 14px;
      margin: 0;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 16px;
      line-height: 1.5;
    }
    .topic-stat-label {
      display: flex;
      gap: 10px;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .topic-stat-rank {
      flex: 0 0 24px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .topic-stat-track {
      display: block;
      height: 14px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--bg-tertiary);
    }
    .topic-stat-fill {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }
    .topic-stat-leading { background: var(--primary); }
    .topic-stat-value {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .topic-stat-percent {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
    }
    @media (max-width: 640px) {
      .markdown-body .topic-stat-chart { padding: 16px; }
      .markdown-body .topic-stat-heading { font-size: 18px; }
      .markdown-body .topic-stat-row {
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 14px 0;
      }
      .topic-stat-label { grid-column: 1 / -1; }
      .topic-stat-value { font-size: 14px; }
      .topic-stat-percent { display: inline; margin-left: 8px; }
    }
    /* topic-statistics:styles:end */
    /* mobile-diagrams:styles:start */
    .markdown-body .study-diagram {
      min-width: 0;
      margin: 24px 0;
      padding: 20px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      background: var(--bg-secondary);
      color: var(--text-main);
      overflow-wrap: anywhere;
    }
    .markdown-body .study-diagram figcaption {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 0 0 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
      font-size: 1.08rem;
      font-weight: 700;
      line-height: 1.45;
    }

},{"text":"• 到期依契約返還有價證券","emphasis":false}]}]},"05-04_員工持股信託ESOTvs員工福利儲蓄信託EFST核心比較.svg":{"kind":"compare","blocks":[{"title":"🏢 員工持股信託 (ESOT)","lines":[{"text":"投資標的：依員工持股方案約定配置公司股票","emphasis":true},{"text":"• 資金來源：員工自提金 ＋ 公司獎助金 (如 1:1)","emphasis":false},{"text":"• 主要目的：讓員工參與公司持股並累積資產","emphasis":false},{"text":"• 退休或離職時：領取實體股票或折算現金返還","emphasis":false},{"text":"⭐ 稅務：企業獎勵提撥依具體制度與所得稅規定判斷","emphasis":false}]},{"title":"🌱 員工福利儲蓄信託 (EFST)","lines":[{"text":"投資標的：依契約約定之多元資產","emphasis":true},{"text":"• 投資範圍：國內外基金、公債、存款等","emphasis":false},{"text":"• 核心目的：為員工長期儲蓄退休金、分散股市單一風險","emphasis":false},{"text":"• 標的與配置：依信託契約／福利方案辦理","emphasis":false},{"text":"⭐ 實際權利義務以契約及適用法規為準","emphasis":false}]}]},"05-05_信託股票表決權行使原則信託業法第201條.svg":{"kind":"flow","blocks":[{"title":"信託契約","lines":[{"text":"• 約定表決權行使方式","emphasis":false},{"text":"• 可設計指示或決策機制","emphasis":false},{"text":"👉 先看契約約定","emphasis":false}]},{"title":"受託人／信託業","lines":[{"text":"• 依信託契約約定行使","emphasis":false},{"text":"• 可與其他信託／自有財產","emphasis":false},{"text":"分別計算表決權","emphasis":true}]},{"title":"表決權判斷","lines":[{"text":"• 不是一律由銀行自由決定","emphasis":false},{"text":"• 也不是一律由持股會代表親投","emphasis":true},{"text":"⭐ 核心：依信託契約與相關法規辦理","emphasis":false}]}]},"06-01_不動產開發信託與買賣價金信託的功能界線.svg":{"kind":"compare","blocks":[{"title":"🏗️ 不動產開發信託","lines":[{"text":"土地、開發資金與相關權利依契約信託管理","emphasis":true},{"text":"• 信託財產範圍依個案契約約定","emphasis":false},{"text":"• 工程查核／撥款條件依契約及參與機構安排","emphasis":false},{"text":"• 信託本身不等於【續建或完工保證】","emphasis":false},{"text":"👉 主要功能是依信託目的控管財產與降低挪用風險","emphasis":false}]},{"title":"🏡 不動產買賣價金信託","lines":[{"text":"買賣價金依契約交付信託並按條件撥付","emphasis":true},{"text":"• 信託範圍、撥款條件依買賣與信託契約","emphasis":false},{"text":"• 可將價金與交易相對人自有資金分離管理","emphasis":false},{"text":"• 是否提供履約保證須看另行約定或制度","emphasis":false},{"text":"👉 信託可降低風險，但不能宣稱排除所有交易風險","emphasis":false}]}]},"06-02_不動產開發信託資金控管與風險隔離.svg":{"kind":"flow","blocks":[{"title":"1. 三方資金入庫","lines":[{"text":"• 地主土地產權信託","emphasis":false},{"text":"• 建商自備工程資金","emphasis":false},{"text":"• 預售屋承購戶自備款","emphasis":false},{"text":"👉 匯入受託銀行專戶","emphasis":false}]},{"title":"2. 工程／資金控管","lines":[{"text":"• 是否由建經公司查核","emphasis":false},{"text":"依個案契約安排","emphasis":false},{"text":"• 撥款條件依信託契約","emphasis":false},{"text":"⭐ 信託可降低挪用風險","emphasis":false}]},{"title":"3. 續建／完工不是信託當然效果","lines":[{"text":"• 是否有續建或完工承諾","emphasis":false},{"text":"要看契約與其他履約保證","emphasis":false},{"text":"• 信託本身不等於銀行保證","emphasis":false},{"text":"⭐ 應逐案確認保障內容","emphasis":false}]}]},"06-03_REITs與REATs法規重點比較.svg":{"kind":"compare","blocks":[{"title":"🏢 REITs 不動產投資信託","lines":[{"text":"1. 發起思維：","emphasis":true},{"text":"募集資金後依計畫投資不動產等標的","emphasis":false},{"text":"2. 證券本質：","emphasis":true},{"text":"經濟性質可類比收益型投資，仍以契約為準","emphasis":false},{"text":"3. 存續期間：","emphasis":true},{"text":"信託契約依法應記載【基金存續期間】","emphasis":false},{"text":"4. 追加發行：","emphasis":true},{"text":"⭐ 追加募集／私募須依規定程序辦理","emphasis":true},{"text":"5. 收益分配：","emphasis":true},{"text":"⭐ 契約配息比率≥90%；應分配收益 6 個月內分配","emphasis":true},{"text":"6. 借款限制：","emphasis":true},{"text":"借款依證券化條例第 19 條等規定辦理","emphasis":false}]},{"title":"🏦 REATs 不動產資產信託","lines":[{"text":"1. 發起思維：","emphasis":true},{"text":"委託人移轉既有不動產／權利辦理證券化","emphasis":false},{"text":"2. 證券本質：","emphasis":true},{"text":"收益與本金分配依資產信託計畫及契約","emphasis":false},{"text":"3. 存續期間：","emphasis":true},{"text":"資產信託計畫／契約應記載【存續期間】","emphasis":false},{"text":"4. 追加發行：","emphasis":true},{"text":"變更或發行安排依計畫、契約與主管機關規定","emphasis":true},{"text":"5. 收益分配：","emphasis":true},{"text":"本金、利益、孳息等依契約約定分配","emphasis":false},{"text":"6. 借款限制：","emphasis":true},{"text":"相關融資限制依不動產證券化法規判斷","emphasis":false}]}]},"06-04_金融資產證券化特殊目的信託SPT與破產隔離架構.svg":{"kind":"flow","blocks":[{"title":"1. 創始機構 (Originator)","lines":[{"text":"• 金融機構 / 商業銀行","emphasis":false},{"text":"• 擁有大量長期房貸/車貸","emphasis":false},{"text":"⭐ 資產移轉須符合證券化法定要件","emphasis":false},{"text":"會計除列與法律效果應分開判斷，","emphasis":false},{"text":"不得用「絕對無風險」概括","emphasis":false}]},{"title":"2. 特殊目的信託 (SPT)","lines":[{"text":"受託機構發行受益證券","emphasis":false},{"text":"• 信託財產具法定獨立性","emphasis":false},{"text":"• 將債權包裝為可分割證券","emphasis":false},{"text":"• 進行信用增強與評等","emphasis":false},{"text":"⭐ 發行方式依證券化計畫及法規","emphasis":false}]},{"title":"3. 資本市場投資人","lines":[{"text":"• 壽險公司、退休基金","emphasis":false},{"text":"• 投入現金認購受益證券","emphasis":false},{"text":"• 按期收取固定利息本金","emphasis":false},{"text":"👉 現金流依證券化計畫分配","emphasis":false}]}]},"06-05_資產證券化不同順位與信用增強的契約設計.svg":{"kind":"flow","blocks":[{"title":"優先順位 Senior","lines":[{"text":"依證券化計畫約定較優先的本金／收益分配順位","emphasis":true},{"text":"信用評等與發行比例並非法律固定，依資產品質、發行條件與評等結果而定","emphasis":false}]},{"title":"中順位 Mezzanine","lines":[{"text":"可依證券化計畫設計介於優先與次順位之間的順位","emphasis":true},{"text":"報酬、風險、分配順位均以發行條件及契約為準","emphasis":false}]},{"title":"次順位 Subordinated","lines":[{"text":"通常設計為較後順位承擔損失，但比例不是法定固定值","emphasis":true},{"text":"⭐ 是否由創始機構持有次順位，須看證券化計畫與發行條件，並非一律法定","emphasis":false}]}]},"07-01_公益信託、基金保管與安養信託重點架構.svg":{"kind":"compare","blocks":[{"title":"🏛️ 公益信託專章","lines":[{"text":"不特定公眾利益","emphasis":true},{"text":"• 各目的事業主管機關許可","emphasis":false},{"text":"• ⭐ 強制設置信託監察人","emphasis":false},{"text":"• 每年至少一次報主管機關核備並公告","emphasis":false},{"text":"• 無約定歸屬權利人時，依第 79 條處理","emphasis":false}]},{"title":"🏦 基金保管機構業務","lines":[{"text":"款券資產獨立保管","emphasis":true},{"text":"• 投信做決策、保管行管錢","emphasis":false},{"text":"• 相互持股達 10% 原則不得擔任，核准例外","emphasis":false},{"text":"• 按基金帳戶別獨立設帳保管","emphasis":false},{"text":"⭐ 依法律、契約與投信運用指示辦理保管收付","emphasis":false}]},{"title":"👵 高齡安養與照護","lines":[{"text":"依契約安排照護費用","emphasis":true},{"text":"• 醫療/養護費用直付專用","emphasis":false},{"text":"• 可依契約設計監察人／共同簽核等機制","emphasis":false},{"text":"• 結合安養機構與跨業結盟","emphasis":false},{"text":"⭐ 一般私益安養信託非法律一律強制設監察人","emphasis":false}]}]},"07-02_公益信託設立許可、信託監察人與年度監督.svg":{"kind":"flow","blocks":[{"title":"1. 主管機關審查許可","lines":[{"text":"• 各目的事業主管機關","emphasis":false},{"text":"(教育部/文化部/衛福部)","emphasis":false},{"text":"• 審查公益實質目標","emphasis":false},{"text":"👉 核發設立許可文件","emphasis":false}]},{"title":"2. 強制設信託監察人","lines":[{"text":"⭐ 信託法第 75 條：","emphasis":false},{"text":"• 公益信託【應置】信託監察人","emphasis":false},{"text":"• 代表不特定公眾利益","emphasis":false},{"text":"依法監督受託人處理信託事務","emphasis":false}]},{"title":"3. 每年至少一次申報與公告","lines":[{"text":"• 信託法第 72 條：每年至少一次","emphasis":false},{"text":"• 信託事務處理情形及財務狀況","emphasis":false},{"text":"• 經監察人審核後報主管機關核備並公告","emphasis":false},{"text":"⭐ 個別主管機關另有規定者從其規定","emphasis":false}]}]},"07-03_共同基金運作機制投信決策與保管機構保管雙權分立.svg":{"kind":"compare","blocks":[{"title":"證券投資信託事業（投信）","lines":[{"text":"負責基金募集、投資研究與運用決策","emphasis":true},{"text":"• 負責基金募集、投資研究與資產配置","emphasis":false},{"text":"• 下達買進賣出投資指示","emphasis":false},{"text":"基金資產與投信、保管機構自有財產分離","emphasis":false}]},{"title":"基金保管機構（信託公司／兼營信託銀行）","lines":[{"text":"依法律、命令與信託契約獨立保管基金資產","emphasis":true},{"text":"• 按基金帳戶別獨立設帳保管","emphasis":false},{"text":"• 依投信運用指示辦理保管、處分、收付","emphasis":false},{"text":"⭐ 不要把投信與保管機構職責混為一談","emphasis":false}]}]},"07-04_高齡安養信託的付款安排與監督機制.svg":{"kind":"flow","blocks":[{"title":"👵 高齡委託人兼受益人","lines":[{"text":"• 將畢生積蓄交付信託","emphasis":false},{"text":"• 自益安排原則不構成他益信託贈與","emphasis":false},{"text":"• 約定日常每月生活金","emphasis":false},{"text":"👉 依約定支付生活與照護費用","emphasis":false}]},{"title":"🏥 專款專用直接支付","lines":[{"text":"• 醫療院所：看護費用","emphasis":false},{"text":"• 安養長照機構：月費直撥","emphasis":false},{"text":"• 輔具採購：檢據實報實銷","emphasis":false},{"text":"⭐ 直接付款可降低款項被挪用的風險","emphasis":false}]},{"title":"🛡️ 可依契約設計監督機制","lines":[{"text":"• 一般私益安養信託非一律強制設監察人","emphasis":false},{"text":"• 可約定監察人、共同簽核或支出條件","emphasis":false},{"text":"⭐ 權限以信託契約及法律規定為準","emphasis":false},{"text":"降低不當提領與詐騙風險","emphasis":false}]}]},"08-01_信託法規常考期間重點整理.svg":{"kind":"timeline","blocks":[{"title":"📅 贈與稅 30 日申報期限","lines":[{"text":"先判斷是否達年度贈與應申報條件","emphasis":true},{"text":"達應申報條件時，以訂定／變更信託契約日為贈與日，依法於 30 日內申報","emphasis":false}]},{"title":"📅 1 個月內","lines":[{"text":"信託業賠償準備金提存至中央銀行","emphasis":true},{"text":"取得營業執照後 1 個月內，以現金或政府債券繳存中央銀行（至少 5,000 萬元）！","emphasis":false}]},{"title":"📅 每 3 個月","lines":[{"text":"信託財產評審","emphasis":true},{"text":"信託業應將信託財產每 3 個月評審一次，並報告董事會","emphasis":false}]},{"title":"📅 6 個月內","lines":[{"text":"破產推定＋REIT 應分配收益期限","emphasis":true},{"text":"信託成立後 6 個月內委託人或其遺產受破產宣告，推定害及債權；REIT 契約應分配收益亦有 6 個月期限","emphasis":false}]},{"title":"📅 1年 / 10年","lines":[{"text":"詐害信託撤銷權之除斥期間 (記憶方式：知一成十)","emphasis":true},{"text":"自知有撤銷原因時起 1 年間；自行為時起逾 10 年者亦同","emphasis":false}]}]},"08-02_信託法規金額門檻與投資比率對照表.svg":{"kind":"compare","blocks":[{"title":"🏢 金額防線與資本門檻","lines":[{"text":"• 信託公司資本額：20 億元（一次認足發行股份，至少繳足 20%）","emphasis":true},{"text":"• 業務別門檻：REIT 10 億元 / REAT 3 億元","emphasis":true},{"text":"• 賠償準備金：最低 5,000 萬元 (存中央銀行)","emphasis":true},{"text":"容易混淆：信託法規無提存國庫之營業保證金！","emphasis":false}]},{"title":"📊 關鍵投資與持股比率限制","lines":[{"text":"• 集管帳戶投資單一公司：不得超帳戶淨資產 10%","emphasis":true},{"text":"• 全體集管帳戶投資單一公司：不得超該公司實收資本額 10%","emphasis":true},{"text":"• 投信與基金保管機構相互持股達 10%：原則不得擔任，金管會核准者例外","emphasis":true},{"text":"• REIT 契約每年配息比率：可分配收益 90% 以上","emphasis":true}]}]},"08-03_歷屆信託考題常見錯誤文字先看法條原則與例外.svg":{"kind":"flow","blocks":[{"title":"錯誤一： 機構張冠李戴","lines":[{"text":"❌ 賠償準備金存於財政部？","emphasis":true},{"text":"正確規定：繳存【中央銀行】，限現金或政府債券；委託人或受益人有優先受償權","emphasis":false}]},{"title":"錯誤二： 投票權主體混淆","lines":[{"text":"❌ 信託股票表決權一律由持股會代表行使？","emphasis":true},{"text":"正確規定：信託業行使股票表決權應依【信託契約約定】；不能一律指定單一行使主體","emphasis":false}]},{"title":"錯誤三： 任意擴大例外","lines":[{"text":"❌ 信託業法第 25 條在任何情況都沒有例外？","emphasis":true},{"text":"正確規定：原則禁止，但【不具運用決定權】及【政府發行債券】等有法定例外","emphasis":false}]}]}};
const courseData = {"chapters":[{"id":"c00","filename":"00_信託證照攻略與全景導讀.md","title":"教材導讀與內容地圖","icon":"🧭","badge":"導讀","weight":"教材使用方式","markdown":"# 臺灣信託業務人員專業測驗：生活圖解重點教材\n\n> **怎麼讀這份教材**：先用生活例子理解情境，再對照《信託法》、《信託業法》、證券化與稅法的法律用語、要件和例外。教材參考第 41 至 62 期歷屆題目。\n> **審題方法**：遇到「何者錯誤」，先找原則，再看例外和適用對象。\n\n### 政府法規來源\n\n| 主題 | 官方來源 |\n| :--- | :--- |\n| 信託基本法律關係 | [信託法｜全國法規資料庫](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024) |\n| 信託業監理 | [信託業法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027)・[施行細則](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310028)・[設立標準](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310029) |\n| 信託稅制 | [所得稅法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003)・[遺產及贈與稅法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072)・[土地稅法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096) |\n| 集合管理運用 | [信託資金集合管理運用管理辦法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310034)・[流動性資產範圍及比率準則](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310040) |\n| 不動產證券化 | [不動產證券化條例](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380169)・[受益證券處理辦法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380172) |\n| 金融資產證券化 | [金融資產證券化條例](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380122) |\n| 基金保管 | [證券投資信託基金管理辦法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400082) |\n| 其他速查數字 | [銀行法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380001)・[證券投資信託事業設置標準](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400095)・[全權委託投資業務管理辦法](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400084) |\n\n---\n\n## 📚 教材模組目錄地圖\n\n![🏛️ 臺灣信託業務人員教材內容地圖](教材圖解/00-01_臺灣信託業務人員教材內容地圖.svg)\n\n<!-- topic-statistics:start -->\n\n---\n\n## 📊 歷屆出題知識點統計\n\n統計範圍：**第 41–62 期｜2,722 題、73 個知識點**。每筆來源題計一次；不同期別的相同題目仍各計一次。第 08 章為跨章複習，不重複計算。\n\n> 出題次數僅反映本站收錄題目，不代表未來配分。\n\n### 全題庫高頻知識點 TOP 15\n\n<section class=\"topic-stat-chart\" aria-label=\"全題庫高頻知識點 TOP 15\"><p class=\"topic-stat-heading\">全題庫高頻知識點 TOP 15</p><p class=\"topic-stat
