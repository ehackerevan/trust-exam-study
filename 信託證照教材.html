數為比較基準；占比以 473 題為分母。</p></section>\n\n</details>\n\n<!-- topic-statistics:end -->\n"},{"id":"c01","filename":"01_信託法規精粹_生活圖解篇.md","title":"信託法基礎與財產獨立性","icon":"🛡️","badge":"核心","weight":"45% 信託法規","markdown":"# 第 01 章：信託法基礎與信託財產獨立性（生活圖解篇）\n\n---\n\n## 🎯 本章重點\n\n依本站歷屆題庫整理，信託財產獨立性（第 12 條）、公示與對抗要件（第 4 條）、詐害信託撤銷權（第 6、7 條）及受託人義務（第 22～35 條）都是高頻考點。本章以下內容以現行《信託法》條文為準。\n\n![🏛️ 信託基本三面關係與法定架構](教材圖解/01-01_信託基本三面關係與法定架構.svg)\n\n---\n\n## 💡 一、信託的本質與生活化白話比喻\n\n### 1. 什麼是信託？（信託法第 1 條）\n> **法條原意**：稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。\n\n*   **實務情境（高齡安養與二代教育金傳承信託）**：\n    王老先生（**委託人**）把 1,000 萬元交給臺灣銀行信託部（**受託人**），並在契約中寫明兩筆用途：銀行每月從信託財產支付 3 萬元給王老先生作生活費（**自益部分**）；孫子小明上大學後，每學期支付 10 萬元作學雜費（**他益部分**）。\n    *   ① **財產權移轉**：這筆錢已交付信託。王老先生日後欠下一般債務，債權人原則上不能直接對信託財產強制執行；仍要檢查《信託法》第 12 條的例外。\n    *   ② **分別管理義務**：銀行須把這筆信託資金與自己的資產分開記帳、管理。\n    *   ③ **稅務效果**：小明取得他益信託利益時，須再判斷是否構成《遺產及贈與稅法》的視同贈與，以及如何申報、估價。\n*   **四大核心構成要件**：\n    1.  **委託人須移轉財產權或為其他處分**：例如把資金交付信託。若只是請人代辦事情，沒有把財產權移轉或處分，就不能僅憑「請你幫我管」四個字認定信託成立；仍須依實際法律關係判斷。\n    2.  **必須有「信託目的」**：目的必須合法、可能、確定，且不能違反公共秩序與善良風俗。\n    3.  **受託人是「為受益人利益」或「特定目的」而管理**：不是為受託人自己賺錢。\n    4.  **信託財產必須具體確定**：不能是抽象概念（例如不能以「未來可能發生的好運」為信託財產）。\n\n---\n\n## 🛡️ 二、信託怎麼分類？先看受益人、成立方式與目的\n\n![📚 信託三大核心法定分類架構](教材圖解/01-02_信託三種常見信託分類方式.svg)\n\n> **常見的錯誤說法**：\n> *   **說法 1**：自然人可以用「宣言信託」設立信託？\n>     *   👉 **錯誤。**《信託法》第 71 條的宣言信託，是法人為增進公共利益，經決議並取得目的事業主管機關許可後，對外宣言自為委託人及受託人。自然人不適用此一宣言信託制度。\n> *   **說法 2**：「法定信託」是《信託法》列出的設立方式嗎？\n>     *   👉 **不是。**我國《信託法》列的是契約、遺囑，以及符合法定條件的宣言信託；不要把其他法系所稱的「法定信託」當成這裡的第四種設立方式。\n\n---\n\n## 🔰 三、信託財產的獨立性\n\n信託財產移轉或處分予受託人後，法律賦予其獨立性；它不因受託人死亡或破產而成為受託人的遺產或破產財團，且原則上不得任意強制執行。\n\n![🛡️ 信託財產獨立性與強制執行界線](教材圖解/01-03_信託財產獨立性與強制執行界線.svg)\n\n### 1. 信託財產獨立性的五項核心規則（信託法第 9～14 條）\n1.  **物上代位性（第 9 條，換形不換質）**：信託財產因管理、處分、滅失、毀損取得之賠償金、保險給付或變賣價金，仍屬信託財產。即使型態由房屋轉為現金，也不因此成為受託人自有財產；是否得強制執行仍依第 12 條及其他法律判斷。\n2.  **不屬於受託人之遺產（第 10 條）**：受託人死亡時，信託財產由新受託人接手，**不列入受託人的遺產**！\n3.  **不屬於受託人之破產財團（第 11 條）**：受託人個人經商失敗宣布破產，信託財產**不屬於受託人的破產財團**。\n4.  **禁止強制執行之原則（第 12 條第 1 項）**：任何人不得隨意對信託財產聲請法院查封拍賣。\n5.  **禁止抵銷（第 13 條）**：老王欠受託人個人 100 萬，但老王對信託財產有 100 萬債權，**兩者不得主張抵銷**！\n\n---\n\n### 🚨 2. 原則不得強制執行，但有三類例外\n\n讀到「債權人要查封信託財產」，先用《信託法》第 12 條第 1 項判斷：原則上不得強制執行，再看但書的三類例外。本站題庫曾多次考這個原則與例外的分界。\n\n![⚖️ 信託財產強制執行的判斷流程與三類例外](教材圖解/01-04_信託財產強制執行原則與三類法定例外信託法第12條.svg)\n\n> **🔥 審題重點**：\n> *   委託人的普通債權人拿本票裁定，要去查封信託財產？ ❌ **不可以！違反第 12 條！**\n> *   銀行在房子信託前，就已經設定了第一順位最高限額抵押權，委託人違約不繳房貸，銀行可否拍賣信託房屋？ ⭕ **可以！此為「信託前已存在之權利」！**\n> *   受託人請水電師傅修繕信託的公寓水管，修繕完畢積欠工程款 10 萬元，水電師傅可否向法院聲請對信託公寓強制執行？ ⭕ **可以！此為「因處理信託事務所生之權利」！**\n\n---\n\n## 🪪 四、信託公示制度：對抗要件（信託法第 4 條）\n\n雙方簽好信託契約，還不代表能用這份契約對抗所有第三人。例如房屋已交付信託，對外仍須依《信託法》第 4 條辦理信託登記；這就是**公示**，目的是讓第三人能辨認財產的信託性質。\n\n| 財產類型 | 公示與生效規定 | 未登記之法律效果 |\n| :--- | :--- | :--- |\n| **應登記之財產權**<br/>（如：土地、房屋、船舶、航空器、商標權、專利權） | 要對抗第三人，須向地政機關或主管機關辦妥**信託登記** | 信託登記是**對抗要件，不是成立要件**；未登記時不得以信託對抗第三人。個案能否強制執行，仍要看第三人的權利與執行名義。 |\n| **有價證券** | 依目的事業主管機關規定，在證券或其他表彰權利文件上**載明為信託財產**；股票或公司債券另須**通知發行公司** | 未依法載明為信託財產，**不得對抗第三人**；股票或公司債券未通知發行公司，**不得對抗發行公司** |\n\n> **例子：土地漏辦信託登記**\n> 陳先生將一筆市價 5,000 萬元的土地信託移轉給張先生管理。雙方已簽訂信託契約，也辦了所有權移轉登記，卻漏辦「信託登記（未載明為信託財產及信託專簿）」：\n> ① **內部關係**：未辦信託登記，不代表信託當然無效；委託人與受託人間的權利義務仍須依信託行為及一般法律關係判斷。\n> ② **外部關係**：依第 4 條，未辦理信託登記即不得以該信託對抗第三人；至於個案能否強制執行，仍應依第三人的權利、執行名義及其他相關法規判斷。\n> 📌 **判斷順序**：先看信託在當事人間是否成立，再看有沒有完成登記，能否對抗第三人。\n\n> **常見錯誤（第 41 期第 1 題）**：\n> *   題目：「以股票為信託者，通知發行公司即可對抗第三人？」\n> *   👉 **錯！**「載明為信託財產」是對抗第三人的要件；股票或公司債券另須通知發行公司，才能對抗該公司。兩種對抗對象不要混為一談。\n\n---\n\n## ⚔️ 五、債務人用信託減少財產時：詐害信託與撤銷權（信託法第 6、7 條）\n\n【建商欠款脫產信託與除斥期間之防禦】\n包商黃董積欠下游材料商林老闆 3,000 萬元工程款，為免豪宅被查封，將名下價值 4,000 萬元的豪宅信託登記給不知情的胞弟作為子女教育基金：\n① **有害及債權**：黃董信託行為導致其剩餘資產不足清償債務，構成有害及債權；\n② **撤銷與受益人既得利益要分開判斷**：信託行為有害於債權人權利時，債權人得聲請法院撤銷；但受益人已取得的利益原則上不受撤銷影響，除非利益尚未屆清償期，或受益人取得利益時明知或可得而知有害及債權。\n③ **嚴格除斥期間**：林老闆必須在「自知有撤銷原因起 1 年內」，或「自信託行為成立日起 10 年內」，向民事法院提起撤銷訴訟；逾期則撤銷權消滅！\n\n![⚖️ 詐害信託撤銷權判定流程與除斥期間](教材圖解/01-05_詐害信託撤銷權判定流程與除斥期間信託法第6、7條.svg)\n\n### 1. 撤銷的法定條件\n1.  **有害於債權人**：信託行為發生時，委託人之資產已經不足以清償所有既有債務（害及資力）。\n2.  **撤銷要件著重信託行為是否有害債權**：第 6 條並未把受託人惡意列為撤銷要件；但受益人已取得利益能否保有，仍須依第 6 條第 2 項判斷。\n3.  **法定推定有害（第 6 條第 3 項）**：信託成立後 **6 個月內**，委託人被宣告破產者，**法律直接推定該信託行為有害於債權**！\n\n### 2. 撤銷權的除斥期間\n*   **短期間**：自債權人**知有撤銷原因起，1 年間**不行使而消滅。\n*   **長期間**：自信託行為**成立日起，逾 10 年**不行使而消滅。\n\n---\n\n## 🧑‍💼 六、受託人的權利、義務與利益衝突迴避\n\n受託人是在管理別人的財產，所以不能只憑自己方便行事。《信託法》要求他依信託目的管理、原則上親自處理信託事務，並把不同財產分開管理。\n\n### 1. 受託人的三項核心義務\n1.  **善良管理人之注意義務（信託法第 22 條）**：\n    **善良管理人之注意義務**，就是處理信託事務時，要有法律要求的謹慎程度，不能因為「沒收報酬」就隨便做。依第 22 條，即使是**無償受託人**，仍應依信託本旨負此注意義務；不要直接套用民法無償委任的注意標準。\n2.  **親自處理義務（第 25 條）**：\n    受託人原則上**應親自處理信託事務**。\n    *   **得使第三人代為處理的法定例外只有兩類**：\n        1. 信託行為另有訂定。\n        2. 有不得已之事由。\n    *   單純取得委託人及受益人同意，並不是第 25 條明文列出的第三種例外。\n3.  **分別管理義務（第 24 條）**：\n    受託人必須將信託財產與其**自有財產**，以及**不同信託之信託財產**分別管理。信託財產是金錢時，可以用分別記帳處理；不同信託間若信託行為明定不必分別管理，則依該約定辦理。\n\n---\n\n### 2. 利益衝突迴避（信託法第 34、35 條）\n\n![🛡️ 受託人防弊規範：享有利益與轉為自有之限制](教材圖解/01-06_受託人的利益衝突限制享有利益與轉為自有之限制信託法第34、35條.svg)\n\n> **常見考法**：\n> *   問：受託人可否同時為該信託之唯一受益人？\n>     *   👉 **不可以。**第 34 條規定受託人不得享有信託利益，但與他人為共同受益人者例外，因此受託人不能成為唯一受益人。\n> *   問：受託人看中信託財產中的不動產或名車，想將信託財產轉為自有財產（自易交易），法律如何規範？\n>     *   👉 **原則禁止，但有法定例外。**第 35 條第 1 項列出三種例外：① 經受益人書面同意並依市價取得；② 由集中市場競價取得；③ 有不得已事由經法院許可。另依第 2 項，受託人因繼承、合併或其他事由概括承受信託財產上權利時，也不適用第 1 項限制。\n\n---\n\n## 🔚 七、信託之消滅與賸餘財產歸屬（信託法第 62~65 條）\n\n信託關係因為信託目的已完成、不能完成、期限屆滿、或終止而消滅時，剩下的財產該給誰？\n\n![🏛️ 信託關係消滅時之信託財產終局歸屬法定三順位](教材圖解/01-07_信託關係消滅後之信託財產歸屬順序信託法第65條.svg)\n\n> **歸屬順序**：\n> **「一約定、二全部受益、三委託」**：信託行為有約定歸屬權利人時依約定；未約定時，先歸屬於**享有全部信託利益之受益人**，其次才是委託人或其繼承人。\n\n\n---\n\n## 📜 法規重點與官方來源\n<details class=\"law-card\">\n  <summary>📜 查閱《信託法》重點摘要</summary>\n  <div class=\"law-card-content\">\n    <p><strong>第 1 條（信託定義）</strong>：稱信託者，謂委託人將財產權移轉或為其他處分，使受託人依信託本旨，為受益人之利益或為特定之目的，管理或處分信託財產之關係。</p>\n    <p><strong>第 4 條（公示與對抗要件）</strong>：應登記或註冊之財產權，非經信託登記不得對抗第三人；有價證券未依法載明為信託財產，不得對抗第三人；股票或公司債券另須通知發行公司，否則不得對抗該公司。</p>\n    <p><strong>第 6 條（詐害信託撤銷權）</strong>：信託行為有害於委託人之債權人權利者，債權人得聲請法院撤銷；受益人已取得利益的保護另依第 2 項判斷。信託成立後 6 個月內，委託人或其遺產受破產宣告者，推定其行為有害及債權。</p>\n    <p><strong>第 7 條（撤銷權除斥期間）</strong>：前條撤銷權，自債權人知有撤銷原因時起，1 年間不行使而消滅；自行為時起逾 10 年者，亦同。</p>\n    <p><strong>第 12 條（強制執行禁止與例外）</strong>：對信託財產不得強制執行。但基於信託前存在於該財產之權利、因處理信託事務所生之權利或其他法律另有規定者，不在此限。</p>\n    <p><strong>第 34 條（受託人利益限制）</strong>：受託人不得以任何名義，享有信託利益。但與他人為共同受益人時，不在此限。</p>\n    <p><strong>第 35 條（轉為自有之限制）</strong>：受託人原則上不得將信託財產轉為自有財產或於其上設定、取得權利；第 1 項列有受益人書面同意並依市價取得、集中市場競價取得、不得已事由經法院許可三種例外，第 2 項另定繼承、合併或其他概括承受的例外。</p>\n  </div>\n</details>\n\n官方全文：[《信託法》｜全國法規資料庫](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024)（本章對照第 1、4、6、7、9～13、22、24、25、34、35、62～65 條）\n"},{"id":"c02","filename":"02_信託業法與監理架構_圖解篇.md","title":"信託業法與監理架構","icon":"🏢","badge":"核心","weight":"38% 信託業法","markdown":"# 第 02 章：信託業法與金融監理架構（圖解篇）\n\n---\n\n## 🎯 本章重點\n\n依本站歷屆題庫整理，《信託業法》的監理架構、利益衝突、賠償準備金與信託財產評審制度都是高頻考點。\n可以把本章想成三個問題：信託業開業前要準備什麼資金？管理客戶財產時哪些交易要避開？營運後又要如何接受評審與監督？\n\n![🏛️ 信託業法金融監理金字塔與四大防線](教材圖解/02-01_信託業法監理架構與高頻法規重點.svg)\n\n---\n\n## 🏢 一、信託業的誕生：設立門檻與兩道資金防線\n\n要辦理信託業務，不能只登記公司名稱就開始收受財產；業務種類須依《信託業法》報請核定，這是「特許營業許可制」及「業務分別核定」的意思：\n① **業務核定原則**：信託業得經營的業務種類，應依第 18 條報請主管機關核定；涉及外匯業務者，應經中央銀行同意。\n② **不得承諾保本或最低收益率（第 31 條）**：信託業不得承諾擔保本金或最低收益率。底層商品本身如另有發行條件，仍應區分商品發行人的義務與受託人的責任，不可把商品條件解讀成信託業對客戶的保證。\n\n![💰 信託業的兩項法定資金門檻與營業保證金辨識](教材圖解/02-02_信託業的兩項法定資金門檻與營業保證金辨識.svg)\n\n### 1. 兩項資金門檻比較\n\n| 項目 | 法定金額 / 比率 | 繳存地點 / 形式 | 主要功能與受償權利 |\n| :--- | :--- | :--- | :--- |\n| **最低實收資本額** | **新臺幣 20 億元**<br/>（發起人一次認足發行股份總額，並至少繳足 20% 股款） | 信託公司自有資本 | 確保公司資本充足度與營運穩定性 |\n| **賠償準備金**<br/>（信託業法第 34 條） | **最低 5,000 萬元**，並依主管機關公告按受託財產計提 | 取得執照後 **1 個月內**<br/>以**現金或政府債券**繳存**中央銀行** | 擔保信託業因違反受託人義務所負的**損害賠償、利益返還或其他責任**；委託人或受益人對賠償準備金有**優先受償權** |\n\n> **常見的四個錯誤說法**：\n> *   信託業還要提存實收資本額 5%、最低 5,000 萬元的「營業保證金」到國庫。這不符合現行《信託業法》；第 34 條規定的是繳存中央銀行的「賠償準備金」。\n> *   賠償準備金繳存於財政部。正確地點是**中央銀行**。\n> *   賠償準備金可以用股票或不動產繳存。法定形式限於**現金或政府債券**。\n> *   賠償準備金只是一般營運資金。第 34 條明定，它用來擔保信託業違反受託人義務所生責任，委託人或受益人並有優先受償權。\n\n---\n\n## 🚧 二、利益衝突防護網：信託業法第 25 條與第 27 條\n\n想像銀行用客戶的信託資金，去買銀行關係企業發行的證券。交易可能讓銀行或關係企業受益，卻未必符合受益人利益；《信託業法》第 25、27 條因此限制特定利害關係交易，適用時仍須檢查各條的範圍與例外。\n\n![🚧 信託業利益衝突限制：第 25 條與第 27 條](教材圖解/02-03_信託業利益衝突規範第25條與第27條.svg)\n\n### 1. 信託業的「利害關係人」是誰？（信託業法第 7 條）\n第 7 條列出七類利害關係人，不能只記兩個持股數字：\n*   持有信託業股份總數或資本總額 **5% 以上**之人。\n*   信託業負責人，以及對信託財產具有**運用決定權之人**。\n*   前述 5% 持股者或信託業負責人獨資、合夥經營的事業，或由其擔任負責人的企業、擔任代表人的團體。\n*   前述 5% 持股者或信託業負責人，單獨或合計持股超過 **10%** 的企業。\n*   半數以上董事與信託業相同的公司，以及信託業持股超過 **5%** 的企業。\n\n### 2. 第 25 條與第 27 條的限制及例外\n\n| 比較維度 | 第 25 條 | 第 27 條 |\n| :--- | :--- | :--- |\n| **基本規則** | 原則禁止以信託財產與本身或利害關係人從事第 25 條列舉交易 | 原則禁止第 27 條列舉交易，但信託契約有約定，或事先告知受益人並取得書面同意時，得依規定辦理 |\n| **規範範圍** | 1. 購買本身或利害關係人發行或承銷之有價證券或票券。<br/>2. 購買本身或利害關係人之財產。<br/>3. 讓售予本身或利害關係人。<br/>4. 其他主管機關規定之利害關係交易。 | 1. 購買其銀行業務部門經紀之有價證券或票券。<br/>2. 存放於其銀行業務部門或利害關係人處，或與銀行業務部門從事外匯相關交易。<br/>3. 與本身或利害關係人為第 25 條第 1 項以外之其他交易。 |\n| **重要例外** | 信託契約約定信託業對信託財產**不具運用決定權**者，不受第 1 項限制，但須充分告知交易情形；**政府發行之債券**亦不受第 1 項限制。 | 信託契約約定信託業對信託財產**不具運用決定權**者，不受第 1 項限制，但仍須充分告知交易情形；外匯交易並須遵守外匯法令及揭露風險。 |\n\n---\n\n## 🏛️ 三、公司治理：信託財產評審委員會\n\n信託業不能只在收受財產時估一次價，之後就不再檢查。信託財產評審委員會須定期評審財產，並把結果報告董事會：\n\n![🏢 信託財產評審委員會開會週期與職權規範](教材圖解/02-04_信託財產評審委員會開會週期與職權規範信託業法第21條.svg)\n\n*   **評審頻率**：第 21 條規定信託財產**每 3 個月評審一次**，並報告董事會。\n*   **職責**：審查受託財產之評審原則、公允價格認定及後續風險控管，並將結果提報董事會。\n\n### 2. 信託業的法定定期報告\n*   **信託財產評審**：第 21 條明定每 **3 個月評審一次**，並報告董事會；條文本身沒有「季後 1 個月內」的額外期限。\n*   **營業報告與財務報告**：第 39 條規定信託業應於**每半營業年度**編製營業報告書及財務報告，向主管機關申報，並公告資產負債表；具體期限見《信託業法施行細則》第 17 條：**半年度終了後 2 個月內**、**年度終了後 4 個月內**辦理。\n\n---\n\n## ⚖️ 四、監理處分與罰則體系\n\n信託業違反《信託業法》或依該法發布的命令時，主管機關可依第 44 條及違規情節採取哪些處分？\n\n![⚖️ 金管會對違法信託業之行政處分階梯](教材圖解/02-05_金管會對違法信託業之處分信託業法第44條.svg)\n\n> **常見考法（解任董事、監察人）**：\n> *   題目：信託業董事或監察人違反法令時，信託業商業同業公會得否直接解除其職務？\n> *   👉 **錯！** 同業公會無此行政權力，**只有主管機關（金管會）**有權命令解除其董監職務！\n\n\n---\n\n## 📜 法規重點與官方來源\n<details class=\"law-card\">\n  <summary>📜 查閱《信託業法》重點摘要</summary>\n  <div class=\"law-card-content\">\n    <p><strong>設立資本額</strong>：信託業法第 10 條授權主管機關訂定最低實收資本額；依《信託業設立標準》第 3、4 條，一般信託公司最低實收資本額為新臺幣 20 億元，發起人應一次認足發行股份總額，並至少繳足 20% 股款。</p>\n    <p><strong>第 25 條（利害關係交易限制）</strong>：原則禁止以信託財產從事條文列舉的本身或利害關係人交易；但信託契約約定信託業不具運用決定權者不受第 1 項限制，政府發行之債券亦屬法定例外。</p>\n    <p><strong>第 27 條（其他利害關係交易限制）</strong>：除依信託契約約定，或事先告知受益人並取得書面同意外，不得從事條文列舉的交易；信託業不具運用決定權者不受第 1 項限制，但須充分告知交易情形。</p>\n    <p><strong>第 34 條（賠償準備金）</strong>：信託業為擔保因違反受託人義務所負的損害賠償、利益返還或其他責任，應提存賠償準備金；取得營業執照後 1 個月內，以現金或政府債券繳存中央銀行。委託人或受益人有優先受償之權。</p>\n    <p><strong>第 39 條＋施行細則第 17 條（定期報告）</strong>：信託業應於每半營業年度編製營業報告書及財務報告並向主管機關申報；半年度終了後 2 個月內、年度終了後 4 個月內辦理。</p>\n    <p><strong>第 44 條（主管機關處分權限）</strong>：信託業違反法令或章程時，主管機關得依法律規定採取糾正、限期改善、停止部分業務或其他監理處分。</p>\n  </div>\n</details>\n\n官方全文：[《信託業法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027)・[《信託業法施行細則》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310028)・[《信託業設立標準》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310029)\n"},{"id":"c03","filename":"03_信託稅制全攻略_穿透圖解篇.md","title":"信託相關稅制","icon":"💧","badge":"稅務","weight":"7% 稅務題型","markdown":"# 第 03 章：信託相關稅制（導管課稅圖解）\n\n---\n\n## 🎯 本章學習導航與核心地圖\n\n看信託稅制時，先問「誰取得所得或信託利益」，再問「何時取得、要不要申報」。所得稅、贈與稅與土地相關稅目各有規定；「導管課稅」是理解一般信託所得的起點，仍須檢查法律另定的情形。\n\n![💧 信託所得稅：透明水管「管道穿透理論」](教材圖解/03-01_信託所得課稅依受益權歸屬判斷.svg)\n\n---\n\n## 💧 一、所得稅：以受益歸屬為核心的導管課稅\n\n### 1. 什麼是「管道穿透理論」？\n*   **白話生活比喻**：\n    想像房租先進入信託專戶，再由契約指定的人享有。對受益人已特定且存在的一般信託，受託人先按所得類別計算，再依受益權歸屬處理課稅；專戶像傳遞所得的「導管」。若受益人不特定、尚未存在，或屬符合法定條件的公益信託，仍須依《所得稅法》第 3 條之 4 的特別規定辦理。\n*   **課稅時點：所得發生年度即時穿透課稅（導管原則）**\n    對受益人已特定且存在的一般信託，原則上看**所得發生的年度**，由受託人計算後按受益比例歸屬受益人。不能只看現金哪一天匯到受益人帳戶。\n    *   **黃金案例**：老張將大樓信託出租，約定租金孳息全贈與兒子小張（他益信託）。113 年度產生租賃所得 240 萬元，雖然合約約定「累積至 115 年小張出國時整筆撥付」，在小張已特定且存在、且無其他特別規定的前提下，這 240 萬元原則上應歸屬 113 年度所得；受託人並依所得稅法第 92 條之 1 辦理次年度信託所得資料申報。\n\n![📅 信託所得稅報稅申報與憑單填發關鍵時程](教材圖解/03-02_信託所得歸屬與申報時程所得稅法第3條之4、92條之1.svg)\n\n### 2. 所得稅納稅義務人判斷三部曲\n\n| 信託形態 | 誰來繳納所得稅？ | 計算與申報方式 |\n| :--- | :--- | :--- |\n| **自益信託**<br/>（委託人 = 受益人） | **委託人** | 併入委託人當年度個人綜合所得總額申報 |\n| **他益信託**<br/>（特定且確定之受益人） | **受益人** | 併入受益人當年度個人綜合所得總額申報 |\n| **受益人不特定**<br/>或**尚未存在**者 | **受託人** | 由受託人就信託所得依所得稅法第 3 條之 4 規定申報納稅；適用稅率與計算方式依所得種類及相關扣繳規定辦理，不宜概括寫成「一律按最高級距」 |\n\n> **報稅日期整理**：\n> *   受託人應於每年 **1 月底前**，依所得稅法第 92 條之 1 申報上一年度信託所得相關資料；原則上於 **2 月 10 日前**填發相關憑單。\n> *   但符合所得稅法第 94 條之 1 等規定的免填發條件時，得免主動填發；納稅義務人要求時仍應提供。\n> *   每年 1 月遇連續三日以上國定假日，申報期間依法延長至 **2 月 5 日**，相關憑單填發期間延長至 **2 月 15 日**。\n\n---\n\n## 🎁 二、贈與稅與遺產稅：視同贈與與折現計算\n\n例如父親設信託，約定子女取得全部或部分信託利益，子女就是委託人以外的受益人。這類**他益信託**原則上屬《遺產及贈與稅法》第 5 條之 1 的**視同贈與**；是否適用公益信託等法定例外，仍要另外判斷。\n\n![🎁 他益信託視同贈與與 30 日申報期限](教材圖解/03-03_他益信託視同贈與與申報判斷.svg)\n\n### 1. 贈與時點與申報期限\n*   **贈與時點**：以**信託契約成立日**、或**變更他益受益人日**、或**追加信託財產日**為贈與行為發生日。\n*   **申報期限**：依第 24 條及第 24 條之 1，若當年度贈與總額已達依法應申報的程度，應以訂定或變更信託契約日為贈與行為發生日，於法定 **30 日**期限內申報。並非每一筆他益信託都可脫離免稅額與其他法定條件，單獨用「成立後一律 30 日申報」概括。\n\n### 2. 信託利益權利的價值計算\n\n《遺產及贈與稅法》第 10 條之 2 會依受益人享有的是「全部信託利益」、「孳息以外的信託利益」或「孳息部分信託利益」採不同估價方式。以下用 1,000 萬元、10 年期、假設贈與時郵政儲金一年期定期儲金固定利率 2.0% 示意：\n\n![🧮 信託財產本金折現與孳息拆解估價模型](教材圖解/03-04_信託利益權利價值計算遺產及贈與稅法第10條之2.svg)\n\n> **🧮 情況 A：本金他益、孳息自益**\n> * 兒子 10 年後取得 1,000 萬元本金，屬「孳息以外信託利益」。\n> * 權利價值按贈與時起至受益時止的期間複利折現：`10,000,000 ÷ (1 + 0.02)¹⁰ ≈ 8,203,483 元`。\n>\n> **🧮 情況 B：本金自益、孳息他益**\n> * 委託人 10 年後取回本金，兒子享有期間孳息，屬「孳息部分信託利益」。\n> * 若非固定利息型態，孳息部分權利價值原則上以信託金額減除前述本金現值：`10,000,000 − 8,203,483 ≈ 1,796,517 元`。\n>\n> 上述數字只是估價示意；實際贈與稅仍須再依贈與日、當時法定利率、受益內容、免稅額及其他適用規定計算。\n\n> **🔥 記憶重點**：\n> *   折現利率採用什麼利率？\n>     *   👉 **「中華郵政股份有限公司一年期定期儲金固定利率」**；實際計算要使用贈與時的適用利率。\n\n---\n\n## 🏞️ 三、土地稅：地價稅與土地增值稅\n\n土地移入信託、受託人出售土地，以及信託結束後返還土地，是不同事件。先弄清楚發生哪種移轉，再判斷土地增值稅是否課徵。\n\n### 1. 土地增值稅：五類不課徵移轉與其他應判斷情形\n\n《土地稅法》第 28 條之 3 列出五類不課徵土地增值稅的信託關係人間移轉：信託成立、變更受託人、自益信託關係消滅、遺囑信託關係消滅，以及信託行為不成立、無效、解除或撤銷。遺囑信託這一款規定的是受託人與**受益人**間移轉，不限於繼承人。\n\n![🌲 土地信託不課徵與應課徵土地增值稅的界線](教材圖解/03-05_信託土地移轉的土地增值稅判斷土地稅法第28條之3等.svg)\n\n### 2. 受託人賣土地時，誰繳稅？原地價怎麼算？（考超多次！）\n*   **納稅義務人**：以**受託人**為納稅義務人。\n*   **原地價起算點**：計算漲價總數額時，原則上仍以**委託人當初取得土地時的原地價**為基礎，不能因為辦了信託過戶，就直接改用過戶當日地價重新起算。\n\n### 3. 地價稅之課徵主體與歸戶方式\n*   **納稅義務人**：信託關係存續中，原則以**受託人**為地價稅納稅義務人。\n*   **歸戶計算不是一律按每一信託各自獨立**：土地稅法第 3 條之 1 對信託土地另定歸戶規則。一般情形會與**委託人在同一直轄市或縣（市）的土地合併計算地價總額**；如受益人已確定、享有全部信託利益，且委託人未保留變更受益人權利等法定條件成立，則依規定與受益人土地合併。\n\n---\n\n## 📜 四、契稅、營業稅與印花稅速記\n\n| 稅目 | 委託人交付信託給受託人時 | 受託人返還委託人（自益信託）時 |\n| :--- | :--- | :--- |\n| **契稅** | 信託成立時，委託人與受託人間移轉信託房屋，**不課徵契稅** | 遺囑信託及契約明定受益人為委託人的自益信託，於信託消滅時返還，**不課徵契稅**；若依信託本旨移轉給委託人以外的歸屬權利人，則依規定課徵 |\n| **營業稅** | 單純信託移轉本身不宜直接等同銷售；應看是否發生營業稅法上的「銷售貨物或勞務」 | 受託人管理或處分信託財產如實際發生銷售，除免稅項目外，應由受託人辦理稅籍、開立發票並報繳營業稅；將管理或處分收益交付受益人，則非受益人銷售貨物或勞務之代價 |\n| **印花稅** | **自益信託**成立時據以辦理不動產權利變更登記，屬形式移轉，非典賣、讓受契據，**不課印花稅** | 自益信託消滅返還委託人，同樣屬形式移轉而不課；若**他益信託**依約移轉不動產給委託人以外之歸屬權利人，且契據持憑辦理登記，按規定以契約金額 **1‰** 課印花稅 |\n\n> **💡 印花稅記憶點**：\n> 不要用「只要辦登記就一定 1‰」判斷。自益信託成立、消滅的形式移轉，不屬印花稅法的典賣、讓受不動產契據；他益信託實質移轉給第三人歸屬權利人時，才要再判斷 1‰ 印花稅。\n\n\n---\n\n## 📜 法規重點與官方來源\n<details class=\"law-card\">\n  <summary>📜 查閱信託相關稅法重點摘要</summary>\n  <div class=\"law-card-content\">\n    <p><strong>所得稅法第 3 條之 4（導管穿透原則）</strong>：信託財產發生之收入，受託人應於所得發生年度，依所得稅法規定計算所得，並由受益人併入當年度所得額課徵所得稅。</p>\n    <p><strong>所得稅法第 92 條之 1（信託申報與憑單時程）</strong>：受託人應於每年 1 月底前，依規定向稽徵機關申報上一年度信託所得相關資料；憑單原則上於 2 月 10 日前填發，符合第 94 條之 1 等免填發條件者從其規定。</p>\n    <p><strong>遺產及贈與稅法第 5 條之 1、第 24 條之 1</strong>：他益信託原則上視為委託人將信託利益權利贈與受益人；其贈與行為發生日以訂定、變更信託契約日認定，申報期限再依第 24 條是否達應申報條件判斷。</p>\n    <p><strong>土地稅法第 28 條之 3（不課徵土地增值稅）</strong>：五類情形為信託成立、變更受託人、自益信託關係消滅、遺囑信託關係消滅，以及信託行為不成立、無效、解除或撤銷時，在條文所定信託關係人間移轉土地。</p>\n  </div>\n</details>\n\n官方全文：[《所得稅法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003)・[《遺產及贈與稅法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072)・[《土地稅法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340096)\n"},{"id":"c04","filename":"04_金錢信託與集合管理_實務篇.md","title":"金錢信託與集合管理","icon":"🌊","badge":"常考","weight":"36% 實務題型","markdown":"# 第 04 章：金錢信託與集合管理運用（實務篇）\n\n---\n\n## 🎯 本章重點\n\n讀金錢信託題目，先問「誰決定錢要投到哪裡」：委託人自己具體指定，還是授權信託業決定？再問這筆錢是否與其他信託資金集合管理，才能找到適用的投資限制。\n\n![🌊 金錢信託分類架構與投資決定權歸屬](教材圖解/04-01_金錢信託分類架構與投資決定權歸屬.svg)\n\n---\n\n## 🧭 一、金錢信託分類架構與生活化比喻\n\n### 1. 先看「誰有運用決定權」，再看委託人指定到什麼程度\n*   **實務情境（銀行財富管理的運用決定權）**：\n    *   ① **特定金錢信託（信託業不具運用決定權）**：\n        張先生具體指定「用 100 萬元申購某檔基金」，並指定交易條件。銀行依其指示辦理，不能因為自己是受託人，就自行換成另一檔基金。\n    *   ② **委託人指定營運範圍或方法、由信託業具運用決定權**：\n        李先生將 2,000 萬元交付信託，契約約定只能投資特定範圍的股票與債券。銀行可在**約定範圍內**選擇標的和時點；這就是信託業在指定範圍內有運用決定權。\n    *   ③ **委託人不指定營運範圍或方法、由信託業具運用決定權**：\n        王奶奶交付 500 萬元安養，未作任何指示。此類金錢信託受信託業法第 32 條限制，營運範圍為：**現金及銀行存款、公債／公司債／金融債券、短期票券，以及其他經主管機關核准之業務**。\n\n| 信託類別 | 運用標的指明度 | 投資決定權歸屬 | 實務最典型應用 |\n| :--- | :--- | :--- | :--- |\n| **特定金錢信託** | 委託人就運用作具體指示 | **信託業不具運用決定權** | 依委託人指示申購特定基金、債券等 |\n| **指定營運範圍或方法之金錢信託** | 委託人先劃定範圍或方法 | **信託業在約定範圍內具運用決定權** | 依契約授權進行資產配置 |\n| **不指定營運範圍或方法之金錢信託** | 委託人未指定營運範圍或方法 | **信託業具運用決定權** | 受信託業法第 32 條法定營運範圍限制 |\n\n> **常見考法（信託業法第 31 條）**：\n> 信託業**不得承諾擔保本金或最低收益率**。考題若把「信託」直接等同「銀行保本商品」，即與第 31 條不符。是否另有行政責任，應依信託業法罰則及具體違規情形判斷。\n\n---\n\n## 🌊 二、信託資金集合管理運用帳戶（CIT）制度\n\n想像數位委託人各交一筆信託資金，受託人依帳戶約定將資金集合運用，並按各人的權益記帳。這就是**集合管理運用帳戶（集管帳戶）**；資金合在一起，仍須遵守分別管理、投資限制與流動性規定，不能保證不會虧損。\n\n![🌊 集合管理運用帳戶（CIT）的資金運作與受益權單位](教材圖解/04-02_信託資金集合管理運用帳戶CIT基本架構.svg)\n\n### 1. 集管帳戶的設立與終止程序\n*   **設置程序要分投資人類型**：非專業投資人得參與的集合管理運用帳戶，設置前應先送同業公會審查，再轉報金管會核准；**限專業投資人**的帳戶，則應於確認第一筆信託資金加入後 **5 個營業日內**向主管機關申報備查。外幣計價帳戶另須經中央銀行同意。\n*   **帳戶獨立性**：集管帳戶與信託業之自有財產或其他信託帳戶必須**嚴格獨立設帳、分別管理**。\n*   **受益人會議不是所有變更的單一程序**：管理及運用計畫、約定條款的變更，依管理辦法辦理核准或備查及通知；帳戶終止等事項則依約定條款與法規判斷是否須經受益人會議決議。\n\n---\n\n## 📊 三、集管帳戶投資限制與流動性比率\n\n對非專業投資人得參與的集管帳戶，可以連問三件事：錢是否集中在同一家公司？是否集中在同一家金融機構？帳戶是否留有足夠的流動性資產？法規分別設有限制：\n\n![⚖️ 集合管理運用帳戶的投資比率與風險限制](教材圖解/04-03_集合管理運用帳戶投資集中度與流動性限制.svg)\n\n### 1. 投資比率對照表\n\n| 限制項目 | 法定比率上限 / 規定 | 制定目的（為什麼這樣規定？） |\n| :--- | :--- | :--- |\n| **單一公司／標的集中度** | 投資於任一上市、上櫃公司發行的股票、存託憑證、公司債、金融債券及短期票券，分別不得超過個別帳戶**投資當日淨資產價值 10%** | 控制單一發行人曝險 |\n| **全體帳戶投資單一公司上限** | 該公司**實收資本額的 10%** | 防止集合管理資金過度集中於單一公司 |\n| **同一金融機構曝險** | 存款＋該機構發行金融債券＋其保證公司債及短期票券，合計不得超過**全體集合管理運用帳戶淨資產總值 30%**，且不得超過**該金融機構淨值 10%** | 控制對單一金融機構的集中風險 |\n| **流動性資產最低比率** | 個別集合管理運用帳戶流動性資產至少為**淨資產價值 5%** | 保留現金、銀行存款、公債、短期票券等流動性部位 |\n\n> **常見的錯誤說法**：\n> *   題目：集管帳戶得投資於單一公司股票達該集管帳戶淨資產價值 20%？\n>     *   👉 **錯！** 法定上限為 **10%**！\n> *   題目：集管帳戶流動性資產可以由各信託業自行決定、完全沒有法定下限？\n>     *   👉 **錯！** 現行《集合管理運用金錢信託流動性資產範圍及比率準則》規定，個別帳戶流動性資產最低比率為**淨資產價值 5%**。\n\n---\n\n## 💱 四、外幣金錢信託實務規範\n\n外幣信託與外幣計價集合管理運用帳戶，除金融監理規定外，還要遵守中央銀行的外匯規範：\n\n1.  **外幣計價集合管理運用帳戶**：設置時應經中央銀行同意。\n2.  **收付幣別**：加入、退出及相關費用原則上以信託業選定之外幣收付，選定後不得任意變更。\n3.  **匯出、匯入**：涉及資金匯出、匯入時，依中央銀行相關規定辦理。\n4.  **投資標的限制**：外幣計價集合管理運用帳戶應運用於外幣計價標的，且不得涉及或連結新臺幣利率及匯率指標商品。\n\n---\n\n## 📜 官方法規來源\n\n本章依據：[《信託業法》第 31、32 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027)・[《信託資金集合管理運用管理辦法》第 3、6、9、10、15 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310034)・[《集合管理運用金錢信託流動性資產範圍及比率準則》第 2、3 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310040)\n"},{"id":"c05","filename":"05_有價證券信託與員工持股_實務篇.md","title":"有價證券與員工福利信託","icon":"📈","badge":"實務","weight":"39% 股票與借券","markdown":"# 第 05 章：有價證券信託與企業員工福利信託（實務篇）\n\n---\n\n## 🎯 本章學習導航\n\n這章會碰到股票交付信託、借券、員工福利信託，以及股票表決權由誰行使。判斷公示要件時，先看《信託法》的一般規定，再看《信託業法》對信託業有沒有特別規定。\n\n![📊 有價證券信託與企業員工福利信託重點](教材圖解/05-01_有價證券信託與員工福利信託重點架構.svg)\n\n---\n\n## 📈 一、有價證券信託：公示與對抗要件\n\n### 1. 一般信託與信託業要分開看\n\n依《信託法》第 4 條：\n1. 以有價證券為信託者，應依目的事業主管機關規定，在證券或其他表彰權利文件上**載明為信託財產**；否則不得對抗第三人。\n2. 股票或公司債券另須**通知發行公司**，否則不得對抗該公司。\n\n但信託業另有《信託業法》第 20 條的特別規定：\n* 信託業將自有財產與信託財產分別管理，並以信託財產名義表彰者，其以信託財產為交易時，得對抗第三人，不適用《信託法》第 4 條第 2 項的一般規定。\n* 信託財產為股票或公司債券，信託業以信託財產名義表彰並辦妥**信託過戶登記**者，視為已通知發行公司。\n\n例如把股票交給信託業管理時，若已以信託財產名義表彰並辦妥信託過戶登記，就視為已通知發行公司。不能把「實體股票背書＋通知公司」當成每種信託的固定流程。\n\n![📝 有價證券信託公示與信託業特別規則](教材圖解/05-02_股票信託公示與對抗要件信託法第4條信託業法第20條.svg)\n\n---\n\n## 🔄 二、有價證券借貸（借券）\n\n信託中的股票不一定只能持有。符合金管會函釋及借券制度條件時，信託業可將員工持股信託或客戶交付的有價證券出借。\n\n### 1. 核心法規條件\n* 信託契約屬於**委託人未保留運用決定權**。\n* 信託契約應明定「**委託人同意受託人得出借有價證券**」。\n* 實際出借、擔保品、追繳與權益補償等作業，依證券交易所、櫃買中心及相關借券制度規則辦理。\n\n![🔄 有價證券借貸交易與風險控管架構](教材圖解/05-03_有價證券信託借貸授權與風險控管架構.svg)\n\n> **考點提醒**：市場上的某些借券制度會設定特定擔保比率或追繳門檻，但不能把「140%／120%」寫成所有有價證券信託借券一律適用的法定比例。題目仍要先看它問的是哪一種借券制度及當時適用規則。\n\n---\n\n## 👥 三、員工持股信託與員工福利儲蓄信託\n\n員工每月提一部分薪水、公司再依制度提供獎勵，都可以成為員工福利信託的資金。依「信託 2.0」政策與實務分類，常見兩種做法：\n\n* **員工持股信託（ESOT）**：員工薪資提存及企業獎勵金交付信託，由受託人依信託契約與持股會等指示，主要投資於**員工任職公司的股票**。\n* **員工福利儲蓄信託（EFST）**：同樣可由員工提存與企業獎勵形成信託資金，但投資範圍可依契約擴及國內外基金及其他有價證券，用來分散單一公司股票風險。\n\n![⚖️ 員工持股信託與員工福利儲蓄信託比較](教材圖解/05-04_員工持股信託ESOTvs員工福利儲蓄信託EFST核心比較.svg)\n\n| 比較維度 | 員工持股信託（ESOT） | 員工福利儲蓄信託（EFST） |\n| :--- | :--- | :--- |\n| **主要投資方向** | 員工任職公司的股票 | 依契約可配置基金、其他國內外有價證券等 |\n| **主要目的** | 員工參與企業持股、長期資產累積 | 員工福利儲蓄與較多元的資產配置 |\n| **權利義務來源** | 信託契約、持股會規範及相關法令 | 信託契約、福利儲蓄制度及相關法令 |\n\n> **稅務與離職處理**：企業獎勵金何時構成員工所得、離職時公司提撥部分如何歸屬，不宜用單一固定答案概括；應依具體信託契約、獎勵辦法及所得稅規定判斷。\n\n---\n\n## 🗳️ 四、股票表決權由誰行使？\n\n《信託業法》第 20 條之 1 規定，信託業的信託財產為股票時：\n1. 表決權可與其他信託財產及信託業自有財產**分別計算**。\n2. **信託業行使表決權時，應依信託契約約定辦理。**\n\n例如公司開股東會，要決定信託持有股票的票怎麼投，先看信託契約如何約定，再依公司法、證券法規及信託業規範辦理。不能直接說受託銀行「完全不能投票」，也不能一律說「一定由員工持股會親自投票」。\n\n![🗳️ 員工持股信託股票表決權行使原則](教材圖解/05-05_信託股票表決權行使原則信託業法第201條.svg)\n\n---\n\n## 🚪 五、離職、退休與信託財產返還\n\n員工離職、退休、死亡或退出制度時，信託財產如何返還，主要依**信託契約、員工持股會／福利儲蓄制度規章及企業獎勵條件**辦理。\n\n常見安排可能包含現物股票撥轉、出售後交付現金，或對企業獎勵部分設計服務年資歸屬條件；這些屬契約設計，不能直接寫成所有員工福利信託都適用的法定比例或一律沒收規則。\n\n---\n\n## 📜 官方法規來源\n\n本章法定公示與表決權規則依據：[《信託法》第 4 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024)・[《信託業法》第 20、20 條之 1](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027)。借券、員工獎勵與離職返還仍須依適用的市場規則、主管機關函令及個別契約判斷，不能只靠本章概括文字決定。\n"},{"id":"c06","filename":"06_不動產信託與資產證券化_實務篇.md","title":"不動產信託與資產證券化","icon":"🏗️","badge":"實務","weight":"18% REITs／SPT","markdown":"# 第 06 章：不動產信託與資產證券化（實務篇）\n\n---\n\n## 🎯 本章學習導航\n\n這章從買房和開發案的信託談起，再看不動產證券化（REITs／REATs）與金融資產證券化的特殊目的信託（SPT）。閱讀時留意：建案契約可能承諾的事，不一定是法律對每件信託都要求的事。\n\n![🏢 不動產開發信託與買賣價金信託安全架構](教材圖解/06-01_不動產開發信託與買賣價金信託的功能界線.svg)\n\n---\n\n## 🏗️ 一、不動產開發信託與買賣價金信託\n\n買預售屋時，買方繳的價金可以依契約交由受託人管理；開發案也可以把土地和建築資金交付信託，降低資金遭挪用或產權任意處分的風險。但有信託**不表示政府保證完工，也不表示銀行保證建商履約**。\n\n![🧱 不動產開發信託與價金信託風險隔離架構](教材圖解/06-02_不動產開發信託資金控管與風險隔離.svg)\n\n| 項目 | 不動產開發信託 | 買賣價金信託 |\n| :--- | :--- | :--- |\n| **常見信託財產** | 土地、開發資金及與開發有關的權利，依契約設計 | 購屋人繳交的價金或預收款 |\n| **主要功能** | 依信託契約控管土地與開發資金 | 將買方價金與建商自有資金分離管理 |\n| **續建／完工** | 是否有續建安排，要看契約、履約保證機制及參與機構 | 價金信託本身不當然提供續建或完工保證 |\n\n> **實務提醒**：建經公司續建、完工承諾、價金返還等，可能是個別建案契約或其他履約保證制度的一部分，不宜寫成《信託法》一律強制的效果。\n\n---\n\n## 🏢 二、不動產證券化：REITs 與 REATs\n\n![🏢 REITs 與 REATs 法規重點比較](教材圖解/06-03_REITs與REATs法規重點比較.svg)\n\n### 1. 法律架構比較\n\n| 比較項目 | 不動產投資信託（REITs） | 不動產資產信託（REATs） |\n| :--- | :--- | :--- |\n| **基本架構** | 受託機構募集或私募資金，依不動產投資信託計畫投資不動產或相關權利 | 委託人將既有不動產或相關權利信託，由受託機構依計畫發行受益證券 |\n| **存續期間** | 不動產投資信託契約依法應記載**基金存續期間** | 不動產資產信託計畫與契約亦應記載**存續期間** |\n| **追加募集** | 法規設有追加募集／追加私募程序，原則上須依規定取得受益人會議決議並辦理申請或申報 | 是否及如何變更發行內容，應依不動產資產信託計畫、契約及主管機關規定辦理，不宜用「一律不得追加發行」概括 |\n| **收益分配** | 信託契約每年配息比率應為**可分配收益 90% 以上**；依《不動產證券化條例》第 28 條，契約約定應分配的收益應於**會計年度結束後 6 個月內**分配 | 依不動產資產信託契約約定本金、利益、孳息及其他收益的分配方式 |\n| **借款** | 可在法令與契約允許範圍內借款；現行處理辦法依信用評等等級設定 **50%／35%／25%／15%** 的借款總額上限 | 依不動產資產信託契約所載借款事項與相關法規辦理 |\n\n> **考點**：REITs 的「90%」與「6 個月」是兩個不同層次的規定：前者是契約每年配息比率，後者是已約定應分配收益的法定分配期限。\n\n---\n\n## 💳 三、金融資產證券化：特殊目的信託（SPT）\n\n例如金融機構持有一批房貸債權，可依《金融資產證券化條例》將特定金融資產移轉或信託予受託機構，再依資產信託證券化計畫發行受益證券。受託機構按計畫管理資產，並把收到的款項依約定分配給受益證券持有人。\n\n![🏛️ 金融資產證券化特殊目的信託與資產隔離架構](教材圖解/06-04_金融資產證券化特殊目的信託SPT與破產隔離架構.svg)\n\n### 1. 「破產隔離」仍須看移轉與契約條件\n\n* 資產是否有效移轉、債務人通知／公告、信託財產的範圍及權利負擔，應依《金融資產證券化條例》與證券化計畫判斷。\n* 「完成證券化就一定從創始機構資產負債表除列」、「一定完全無追索權」屬會計與契約層次問題，不能僅靠「SPT」三個字直接推定。\n* 受託機構原則上不得以信託財產借款；若資產信託證券化計畫另有規定，借款目的依第 14 條限於**配發利益、孳息或其他收益**。\n\n---\n\n### 2. 優先／次順位與信用增強\n\n![📊 資產證券化優先與次順位分券架構](教材圖解/06-05_資產證券化不同順位與信用增強的契約設計.svg)\n\n證券化計畫可設計不同種類或順位的受益證券：\n* **優先順位**：依計畫約定享有較優先的本金或收益分配順位。\n* **次順位／劣後順位**：通常先承擔資產池損失，因此可作為信用增強的一種設計。\n* **超額擔保**：資產池價值高於發行證券金額時，可形成額外緩衝，但實際效果仍依資產品質、契約及證券化計畫而定。\n\n優先順位是「依約定先分」，不是保證信用評等一定為 AAA；次順位通常先承擔損失，也不代表一定賠到歸零。仍要看發行條件及評等結果。\n\n---\n\n## 📜 官方法規來源\n\n本章依據：[《不動產證券化條例》第 19、28 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380169)・[《受託機構募集或私募不動產投資信託或資產信託受益證券處理辦法》第 6、11、12 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380172)・[《金融資產證券化條例》第 5、6、14、24～26 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380122)\n"},{"id":"c07","filename":"07_公益信託與特殊形態信託_實務篇.md","title":"公益信託、基金保管與安養照護","icon":"🏛️","badge":"實務","weight":"12% 公益與照護","markdown":"# 第 07 章：公益信託、基金保管與安養照護信託（實務篇）\n\n---\n\n## 🎯 本章重點\n\n這章談三件事：公益信託怎麼設立和監督、基金保管機構做什麼，以及如何用信託安排長輩或身心障礙者的照顧費。法定義務要依《信託法》和金管會現行投信投顧規範判斷；安養照護信託的付款方式等細節，則要看契約怎麼約定。\n\n![🌟 公益信託、基金保管與安養照護信託重點](教材圖解/07-01_公益信託、基金保管與安養信託重點架構.svg)\n\n---\n\n## 🏛️ 一、公益信託：用信託做公益（信託法第 69~85 條）\n\n公益信託可用於獎助學、醫療救助、文化、環境保育等公共利益目的。依《信託法》第 70 條，公益信託的設立及其受託人均須經目的事業主管機關許可，並受該主管機關持續監督。\n\n![🏛️ 公益信託設立許可、信託監察人必設與年度申報法定體系](教材圖解/07-02_公益信託設立許可、信託監察人與年度監督.svg)\n\n### 1. 公益信託與私益信託怎麼分\n\n| 比較項目 | 私益信託（一般民事/商業信託） | 公益信託（信託法第 8 章） |\n| :--- | :--- | :--- |\n| **設立方式** | 原則上以契約或遺囑為之 | 契約、遺囑；另依第 71 條，**法人**為增進公共利益，經決議及主管機關許可後，得以宣言方式成立公益信託 |\n| **主管機關許可** | 一般私益信託無公益信託的許可程序 | 公益信託之設立及受託人，**均應經目的事業主管機關許可** |\n| **信託監察人設置** | 依信託行為或法律規定選任 | 第 75 條明定公益信託**應置信託監察人** |\n| **受託人辭任規定** | 除信託行為另有約定外，須經委託人及受益人同意；有不得已事由時，得聲請法院許可 | **非有正當理由，並經主管機關許可，不得辭任** |\n| **信託消滅財產歸屬** | 依第 65 條及信託行為約定處理 | **先看信託行為有無約定歸屬權利人**；若沒有，第 79 條規定主管機關得為類似目的使信託關係存續，或移轉予有類似目的之公益法人或公益信託 |\n\n> **常見的三個錯誤說法**：\n> *   **說法 1**：公益信託之主管機關一律為金融監督管理委員會？\n>     *   👉 **錯！** 是依其業務性質由各「**目的事業主管機關**」管轄（例：助學金歸教育部、醫療救助歸衛福部、環境保育歸環境部）。\n> *   **說法 2**：公益信託得由委託人自由決定是否設置信託監察人？\n>     *   👉 **錯！** 法律明定**「應」**設置信託監察人，一人或數人均可。\n> *   **說法 3**：公益信託消滅時，一律由法律直接把剩餘財產移給類似公益法人？\n>     *   👉 **錯。** 第 79 條的前提是「**沒有信託行為所定的歸屬權利人**」。在此前提下，主管機關才得為類似目的使信託關係存續，或將財產移轉予有類似目的之公益法人或公益信託。\n\n### 2. 年度監督與申報\n依《信託法》第 72 條，受託人應**每年至少一次**，將信託事務處理情形及財務狀況送公益信託監察人審核後，報請主管機關核備並公告。法律本文並沒有一律規定「會計年度終了後 3 個月內」；若各目的事業主管機關另有許可監督規定，則另依該規定辦理。\n\n---\n\n## 🏦 二、基金保管機構：分開保管基金資產\n\n證券投資信託基金的資產應與投信事業及基金保管機構的自有財產分別獨立；基金保管機構並依法律、命令及證券投資信託契約，按基金帳戶別獨立設帳保管基金資產。\n\n![🤝 共同基金運作機制：投信 (決策) 與保管機構 (保管) 雙權分立](教材圖解/07-03_共同基金運作機制投信決策與保管機構保管雙權分立.svg)\n\n### 1. 投信公司與保管機構的持股限制\n*   依《證券投資信託基金管理辦法》第 59 條，信託公司或兼營信託業務之銀行，如投資於該投信事業已發行股份總數**達 10% 以上**，或該投信事業持有其已發行股份總數**達 10% 以上**，原則上不得擔任該投信事業之基金保管機構；但經金管會核准者例外。\n*   同條另列董事、監察人交叉任職、同一金融控股公司子公司或互為關係企業等限制，不能只用「10%」概括所有不適格情形。\n\n---\n\n### 2. 投資指示超出契約範圍時怎麼辦\n\n全權委託投資業務必須建立「越權交易之防範」控制作業，保管機構亦須依全權委託契約及相關法令辦理保管、收付與監督。若投資指示逾越契約或法令限制，應依適用法規、契約及內部控制程序處理；不可將特定業者作業流程（例如一律拒絕交割、固定副知特定機關、由投信自有資金承接）寫成所有案件都適用的法定程序。\n\n---\n\n## 👵 三、高齡安養與身心障礙者照護信託\n\n家人可能想先安排兩件事：\n1. 長輩失智或生重病後，生活費和醫療費如何按需要支付，避免存款被人擅自提領。\n2. 父母過世後，留給身心障礙子女的照顧費如何持續用在子女身上。\n\n![👵 高齡安養信託的付款安排與監督機制](教材圖解/07-04_高齡安養信託的付款安排與監督機制.svg)\n\n*   **按約定用途付款**：契約可約定由受託人從信託財產支付長輩的生活費、護理院費或醫療費，也可約定直接付給安養院或醫院，降低款項被挪作他用的風險。\n*   **可透過契約增加監督機制**：一般私益安養信託並非法律一律強制設置信託監察人；實務上可依需求在契約中設計信託監察人、共同簽核、定期報告或特定支出條件。監察人的權限以信託行為及法律規定為準，也不能宣稱能「絕對」排除所有詐騙或不當處分風險。\n\n---\n\n## 📜 官方法規來源\n\n本章依據：[《信託法》第 36、69～85 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024)・[《證券投資信託基金管理辦法》第 59、60 條](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400082)。安養照護信託的付款與監督方式主要依個別信託契約安排。\n"},{"id":"c08","filename":"08_歷屆考題高頻數字與易錯陷阱速查手冊.md","title":"常見數字與易錯觀念速查","icon":"⚡","badge":"速查","weight":"期間、比率與例外","markdown":"# 第 08 章：歷屆考題常見數字與易錯觀念速查表\n\n---\n\n## 🎯 本章使用說明\n\n信託業務人員測驗常問期間、比率，也常要選出「何者錯誤」。本站 2,860 題中，有 666 題屬於後一類，約佔 **23.3%**。遇到這類題目，先確認題目問的是原則、例外，還是適用條件。\n本手冊整理本站歷屆題庫常見的數字、期間、比率與法規名詞。若題庫舊題與現行法規不一致，以現行法規為準。\n\n---\n\n## ⏱️ 一、時間與期間速查表\n\n![⏱️ 信託法規關鍵法定期間總彙整](教材圖解/08-01_信託法規常考期間重點整理.svg)\n\n| 法定期間 | 法規依據 | 適用情形 | 容易混淆之處 |\n| :--- | :--- | :--- | :--- |\n| **20 日前** | 金融資產證券化條例第 24 條 | 受託機構或信託監察人召集受益人會議，應於開會 **20 日前**通知各受益人。 | 條文寫「通知」，沒有另加「書面」二字。 |\n| **30 日** | 遺產及贈與稅法第 24 條、第 24 條之 1 | 委託人有第 5 條之 1 的應課徵贈與稅情形時，以訂定或變更信託契約日為贈與行為發生日；**達第 24 條應申報條件者**，於 30 日內申報。 | 先判斷是否達年度贈與應申報條件，不要把所有他益信託一律寫成「成立後 30 日必報」。 |\n| **1 個月** | 信託業法第 34 條 | 信託業取得營業執照後，應於 **1 個月內**以現金或政府債券繳存賠償準備金於中央銀行。 | 常被改成「3 個月」或「營業前」 |\n| **2 個月 / 4 個月** | 信託業法第 39 條、施行細則第 17 條 | 半年度營業報告書及財務報告：**半年度終了後 2 個月內**；年度資料：**年度終了後 4 個月內**辦理申報／公告。 | 不要和信託財產「每 3 個月評審一次」混淆。 |\n| **3 個月** | 信託業法第 21 條 | 信託業的**信託財產評審委員會每 3 個月評審一次**，並報告董事會。 | 條文不是「每季至少一次」。 |\n| **6 個月** | 信託法第 6 條第 3 項<br/>不動產證券化條例第 28 條 | 1. 信託成立後 **6 個月內**，委託人或其遺產受破產宣告者，推定該行為有害及債權。<br/>2. REIT 依契約約定應分配之收益，應於會計年度結束後 **6 個月內**分配。 | 「90% 配息比率」與「6 個月分配期限」法源不同。 |\n| **1 年 / 10 年** | 信託法第 7 條 | 詐害信託撤銷權：<br/>• 自債權人**知有撤銷原因起 1 年**不行使而消滅。<br/>• 自信託**行為時起逾 10 年**者亦同。 | 條文用語是「自行為時起」，不是另設一個登記日起算點。 |\n| **1 月底前** | 所得稅法第 92 條之 1 | 受託人應填具上一年度各信託的財產目錄、收支計算表、所得額與扣繳稅額等相關文件，向稽徵機關列單申報。 | 每年 1 月遇連續 3 日以上國定假日，申報期間延長至 2 月 5 日 |\n| **2 月 10 日前** | 所得稅法第 92 條之 1、第 94 條之 1 | 原則上於每年 **2 月 10 日前**填發相關憑單；符合免填發條件者得免主動填發，納稅義務人要求時仍應提供。 | 遇法定連續假期時，填發期間延長至 2 月 15 日 |\n\n---\n\n## 💰 二、金額與比率速查表\n\n![💰 信託法規金額門檻與投資比率對照表](教材圖解/08-02_信託法規金額門檻與投資比率對照表.svg)\n\n| 項目門檻 | 正確法定數字 | 法規依據 | 容易混淆之處 |\n| :--- | :--- | :--- | :--- |\n| **信託公司最低實收資本額** | **新臺幣 20 億元**<br/>• 僅辦理 REIT：10 億元<br/>• 僅辦理 REAT：3 億元 | 信託業設立標準第 3、4 條 | 發起人及股東出資以現金為限；發起人應於發起時**一次認足發行股份總額，並至少繳足 20% 股款** |\n| **賠償準備金最低門檻** | **新臺幣 5,000 萬元** | 信託業法第 34 條<br/>主管機關公告標準 | 取得執照後 1 個月內以現金或政府債券繳存中央銀行；委託人或受益人有**優先受償權**。每年並依主管機關公告按受託財產計提。 |\n| **營業保證金辨識** | 《信託業法》第 34 條規範的是**賠償準備金** | 信託業法第 34 條 | 若選項把一般信託業的第 34 條寫成「向國庫提存資本額 5% 的營業保證金」，即與現行條文不符。 |\n| **信託業利害關係人持股標準** | **5%**（主要股東）<br/>**10%**（負責人持股企業） | 信託業法第 7 條 | 掌握「**5%**（持有信託業股份）」與「**10%**（負責人等持有企業股份）」兩大關鍵數字！ |\n| **集管帳戶投資單一標的上限** | **10%**（雙十原則） | 信託資金集合管理運用管理辦法第 9 條 | • 個別帳戶投資任一公司總額不得超過該帳戶淨資產 **10%**<br/>• 全體帳戶投資任一公司總額不得超過該公司實收資本額 **10%** |\n| **同一金融機構曝險** | **全體集管帳戶 NAV 30%** 且 **該金融機構淨值 10%** | 同辦法第 9 條第 7 款 | 存款＋該金融機構發行之金融債券＋其保證之公司債及短期票券合併計算 |\n| **集管帳戶流動性資產** | 個別帳戶至少 **NAV 5%** | 集合管理運用金錢信託流動性資產範圍及比率準則第 3 條 | 未達最低比率時應即調整 |\n| **REIT 收益分配** | 契約每年配息比率 **90% 以上**；契約約定應分配之收益於年度終了後 **6 個月內**分配 | 《受託機構募集或私募不動產投資信託或資產信託受益證券處理辦法》契約應記載事項；《不動產證券化條例》第 28 條 | **90% 是契約配息比率要求；6 個月是已約定應分配收益的分配期限，兩者不要混成同一條規定** |\n| **全權委託投資業務資本額辨析** | 投信：**3 億元**<br/>投顧：**3 億元**（免受 20 倍限制） | 投信事業設置標準第 7 條<br/>全權委託投資業務管理辦法第 13 條 | 投信公司門檻為 3 億元；投顧代操若達 3 億元則接受委託金額不受淨值 20 倍限制。 |\n\n---\n\n## 🗳️ 三、會議與表決權門檻\n\n| 會議與主體 | 事項與法規依據 | 法定出席門檻 | 法定決議同意門檻 |\n| :--- | :--- | :--- | :--- |\n| **銀行董事會** | 銀行法第 33 條：對利害關係人擔保授信達主管機關規定金額 | **董事三分之二以上出席**（2/3） | **出席董事四分之三以上同意**（3/4） |\n| **土地信託受益人會議** | 信託業法第 26 條：以開發為目的之土地信託借入款項 | **受益權總數三分之二以上出席**（2/3） | **出席表決權數過半數同意**（二分之一以上） |\n| **證券化受益人會議** | 金融資產證券化條例第 25 條：普通決議事項 | **表決權總數二分之一以上出席**（過半數） | **出席受益人表決權過半數同意** |\n| **證券化受益人會議** | 金融資產證券化條例第 26 條：決議有損害特定種類受益人之權利 | **該特定種類表決權總數二分之一以上出席** | **出席受益人表決權三分之二以上同意** |\n| **受益人請求召集門檻** | 金融資產證券化條例第 24 條：受益人請求召集會議 | **持有本金持分總數 3% 以上**<br/>（請求後 15 日不召集得報主管機關許可自行召集） | 開會 **20 日前**書面通知；重大事項（解任、變更契約）**不得以臨時動議提出**！ |\n\n---\n\n## 🚨 四、選「何者錯誤」時先檢查這三件事\n\n選項若寫「一律」「絕對」或把不同法條的數字放在一起，先回到法條檢查原則、例外與適用前提：\n\n![⚠️ 歷屆信託考題常見錯誤文字辨識](教材圖解/08-03_歷屆信託考題常見錯誤文字先看法條原則與例外.svg)\n\n1.  **先看「原則」再看「法定例外」**：\n    信託業法第 25 條原則上禁止以信託財產從事本身或利害關係人交易，但第 2 項明定：信託契約約定信託業**不具運用決定權**者，不受第 1 項限制；政府發行之債券亦屬例外。看到「絕對禁止、任何情況都不能」時，要先檢查題目是否忽略法定例外。\n2.  **「應」vs「得」文字遊戲**：\n    *   公益信託依第 75 條**應置信託監察人**；這是明文義務。\n    *   受託人**原則上應親自處理**信託事務（寫「得隨意委託他人」者錯誤）。\n3.  **「信託財產獨立性」要把法定例外背完整**：\n    信託法第 12 條原則上禁止對信託財產強制執行，但例外包括：**信託前存在於該財產之權利、因處理信託事務所生之權利，以及其他法律另有規定者**。\n\n---\n\n## 📜 官方法規來源\n\n官方來源：[《信託法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024)・[《信託業法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027)・[《信託業法施行細則》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310028)・[《信託業設立標準》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310029)・[《所得稅法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340003)・[《遺產及贈與稅法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0340072)・[《銀行法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380001)・[《金融資產證券化條例》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380122)・[《不動產證券化條例》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380169)・[《證券投資信託事業設置標準》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400095)・[《全權委託投資業務管理辦法》](https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400084)\n"}],"quizzes":{"c01":[{"id":"c01_q01","source_id":"past-52-law-2","source_chapter":"c01","term":52,"period":52,"subject":"信託法規","number":2,"stem":"某甲將公司債交付信託，已依規定辦理信託公示，但未通知該公司債發行公司，則該信託行為之效力為何？","options":["(1) 無效","(2) 有效，但不能對抗第三人","(3) 無效，但能對抗第三人","(4) 有效，但不能對抗該發行公司"],"answer":3,"topic":"成立方式與信託分類","conceptId":"concept-2","frequency":154,"topicRank":1,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「成立方式與信託分類」共出現 154 題，章內出題頻率第 1 名。\n💡 本題選自第 52 期，官方公布正確答案為第 (4) 個選項。"},{"id":"c01_q02","source_id":"past-54-law-11","source_chapter":"c01","term":54,"period":54,"subject":"信託法規","number":11,"stem":"他益信託之受託人辭任或被解任時，除信託行為另有訂定外，下列何者得指定新受託人？","options":["(1) 委託人","(2) 原受託人","(3) 受益人","(4) 信託監察人"],"answer":0,"topic":"成立方式與信託分類","conceptId":"concept-2","frequency":154,"topicRank":1,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「成立方式與信託分類」共出現 154 題，章內出題頻率第 1 名。\n💡 本題選自第 54 期，官方公布正確答案為第 (1) 個選項。"},{"id":"c01_q03","source_id":"past-56-law-26","source_chapter":"c01","term":56,"period":56,"subject":"信託法規","number":26,"stem":"信託業收受以公司債為信託財產之信託，經償還後轉化為金錢，併為信託財產運用，係屬於下列何種信託？","options":["(1) 金錢之信託","(2) 金錢債權之信託","(3) 有價證券之信託","(4) 動產之信託"],"answer":2,"topic":"成立方式與信託分類","conceptId":"concept-2","frequency":154,"topicRank":1,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「成立方式與信託分類」共出現 154 題，章內出題頻率第 1 名。\n💡 本題選自第 56 期，官方公布正確答案為第 (3) 個選項。"},{"id":"c01_q04","source_id":"past-55-law-9","source_chapter":"c01","term":55,"period":55,"subject":"信託法規","number":9,"stem":"有關受託人之直接管理義務，下列敘述何者錯誤？","options":["(1) 信託行為得另訂第三人代為處理信託事務","(2) 信託行為有不得已之事由者，得使第三人代為處理信託事務","(3) 受託人違反信託直接管理義務時，應就第三人之行為負完全責任","(4) 受託人違反信託直接管理義務，使第三人代為處理信託事務時，該第三人所為法律行為效力可及於信託財產"],"answer":3,"topic":"受託人義務報酬與責任","conceptId":"concept-10","frequency":61,"topicRank":2,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「受託人義務報酬與責任」共出現 61 題，章內出題頻率第 2 名。\n💡 本題選自第 55 期，官方公布正確答案為第 (4) 個選項。"},{"id":"c01_q05","source_id":"past-52-law-13","source_chapter":"c01","term":52,"period":52,"subject":"信託法規","number":13,"stem":"公益信託之受託人有為違背其職務之行為時，委託人得向下列何機關申請將其解任？","options":["(1) 法院","(2) 檢察機關","(3) 警察機關","(4) 目的事業主管機關"],"answer":3,"topic":"公益信託與監督機關","conceptId":"concept-20","frequency":46,"topicRank":3,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「公益信託與監督機關」共出現 46 題，章內出題頻率第 3 名。\n💡 本題選自第 52 期，官方公布正確答案為第 (4) 個選項。"},{"id":"c01_q06","source_id":"past-51-law-6","source_chapter":"c01","term":51,"period":51,"subject":"信託法規","number":6,"stem":"以應登記或註冊之財產權為信託者，有關信託財產登記之規定，下列敘述何者錯誤？","options":["(1) 非經信託登記，不得對抗第三人","(2) 土地權利登記得以遺囑為之","(3) 以股票為信託者，應向臺灣證券交易所辦理登記","(4) 以有價證券為信託者，應於證券上或其他表彰權利之文件上載明為信託財產"],"answer":2,"topic":"登記公示與對抗效力","conceptId":"concept-27","frequency":33,"topicRank":4,"frequencyScope":"本章","annotation":"","note":"📊 第 41–62 期本章「登記公示與對抗效力」共出現 33 題，章內出題頻率第 4 名。\n💡 本題選自第 51 期，官方公布正確答案為第 (3) 個選項。"},{"id":"c01_q07","source_id":"past-52-law-32","source_chapter":"c01","term":52,"period":52,"subject":"信託法規","number":32,"stem":"信託財產運用所生之收益及損失應由下列何者享受與承擔？",     // ==================== 法規語意高亮引擎 ====================
    function highlightLegalText(html) {
      if (!html) return '';
      // 透過正則匹配所有 HTML 標籤 (<[^>]+>)，只對標籤之外的純文字節點做關鍵詞高亮，絕不破壞標籤與屬性！
      return html.replace(/(<[^>]+>)|([^<]+)/g, (match, tag, text) => {
        if (tag) return tag;
        let res = text;
        res = res.replace(/(不得|嚴禁|禁止|罰鍰|沒入|撤銷|無效|除外|未經許可)/g, '<span class="legal-word legal-ban">$1</span>');
        res = res.replace(/(應於|應經|應向|應由|必須|應提列|強制)/g, '<span class="legal-word legal-duty">$1</span>');
        res = res.replace(/(得由|得向|得經|可行|任選)/g, '<span class="legal-word legal-allow">$1</span>');
        res = res.replace(/(但書|但|若|如遇)/g, '<span class="legal-word legal-condition">$1</span>');
        res = res.replace(/(\d+個月|\d+年|\d+日內|即日起|屆滿)/g, '<span class="legal-word legal-time">$1</span>');
        return res;
      });
    }

    // ==================== Marked.js 設定與表格渲染 ====================
    // mobile-diagrams:renderer:start
    // 教材圖解的文字取自校訂後的 SVG，頁面以 HTML/CSS 呈現，不依賴圖檔縮放。
    const escapeDiagramText = value => String(value).replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);

    function diagramLines(lines) {
      if (!lines.length) return '';
      return `<ul class="study-diagram-lines">${lines.map(line => {
        const value = line.text.replace(/^\s*•\s*/, '').trim();
        return `<li${line.emphasis ? ' class="study-diagram-emphasis"' : ''}>${escapeDiagramText(value)}</li>`;
      }).join('')}</ul>`;
    }

    function diagramNode(block) {
      return `<section class="study-diagram-node">
        <h4>${escapeDiagramText(block.title)}</h4>
        ${diagramLines(block.lines)}
        ${block.relation ? `<p class="study-diagram-relation">${escapeDiagramText(block.relation)}</p>` : ''}
      </section>`;
    }

    function classificationDiagram(blocks) {
      const items = [...blocks];
      const root = items[0] && !items[0].lines.length ? items.shift() : null;
      const groups = [];
      let current;
      for (const block of items) {
        if (!block.lines.length) {
          current = { title: block.title, children: [] };
          groups.push(current);
        } else {
          if (!current) {
            current = { title: '', children: [] };
            groups.push(current);
          }
          current.children.push(block);
        }
      }
      return `${root ? `<p class="study-diagram-root">${escapeDiagramText(root.title)}</p>` : ''}
        <div class="study-diagram-groups">${groups.map(group => `<section class="study-diagram-group">
          ${group.title ? `<h3>${escapeDiagramText(group.title)}</h3>` : ''}
          <div class="study-diagram-children">${group.children.map(diagramNode).join('')}</div>
        </section>`).join('')}</div>`;
    }

    function comparisonDiagram(blocks) {
      const items = [...blocks];
      const root = items[0] && !items[0].lines.length ? items.shift() : null;
      return `${root ? `<p class="study-diagram-root">${escapeDiagramText(root.title)}</p>` : ''}
        <div class="study-diagram-panels">${items.map(diagramNode).join('')}</div>`;
    }

    function numberedComparison(blocks) {
      // REITs / REATs 原圖逐項對照，手機依比較項目排列，避免來回找兩欄。
      const sides = blocks.map(block => {
        const entries = [];
        for (let i = 0; i < block.lines.length; i += 2) {
          entries.push({ label: block.lines[i]?.text || '', value: block.lines[i + 1]?.text || '' });
        }
        return entries;
      });
      return `<div class="study-diagram-criteria">${sides[0].map((entry, index) => `<section class="study-diagram-criterion">
        <h4>${escapeDiagramText(entry.label)}</h4>
        <dl>
          <div><dt>${escapeDiagramText(blocks[0].title)}</dt><dd>${escapeDiagramText(entry.value)}</dd></div>
          <div><dt>${escapeDiagramText(blocks[1].title)}</dt><dd>${escapeDiagramText(sides[1][index]?.value || '')}</dd></div>
        </dl>
      </section>`).join('')}</div>`;
    }

    function renderStudyDiagram(href, caption) {
      const filename = decodeURI(href).split('/').pop();
      const diagram = mobileDiagramData[filename];
      if (!diagram) return '';
      const { blocks, kind } = diagram;
      let content;
      if (kind === 'classification') content = classificationDiagram(blocks);
      else if (filename === 'chart_06_03.svg') content = numberedComparison(blocks);
      else if (kind === 'compare') content = comparisonDiagram(blocks);
      else if (kind === 'decision') {
        content = `<div class="study-diagram-question">${diagramNode(blocks[0])}</div>
          <div class="study-diagram-branches">${blocks.slice(1).map(diagramNode).join('')}</div>`;
      } else {
        const items = [...blocks];
        const root = items[0] && !items[0].lines.length ? items.shift() : null;
        content = `${root ? `<p class="study-diagram-root">${escapeDiagramText(root.title)}</p>` : ''}
          <ol class="study-diagram-sequence">${items.map(block => `<li>${diagramNode(block)}</li>`).join('')}</ol>`;
      }
      return `<figure class="study-diagram study-diagram--${kind}" aria-label="${escapeDiagramText(caption)}">
        <figcaption><span class="study-diagram-icon">◆</span>${escapeDiagramText(caption)}</figcaption>
        ${content}
      </figure>`;
    }
    // mobile-diagrams:renderer:end
    const renderer = new marked.Renderer();
    const originalImageRenderer = renderer.image.bind(renderer);

    renderer.image = function(href, title, text) {
      return renderStudyDiagram(href, title || text || '圖解') || originalImageRenderer(href, title, text);
    };

    // 表格包裹器：桌機表格、平板自適應、手機自動轉卡片。
    renderer.table = function(header, body) {
      return `
        <div class="table-scroll-wrapper">
          <div class="table-scroll-hint">
            <span>📊 重點對照表</span>
          </div>
          <div class="table-scroll-inner">
            <table>
              <thead>${header}</thead>
              <tbody>${body}</tbody>
            </table>
          </div>
        </div>
      `;
    };

    function enhanceResponsiveTables(root) {
      if (!root || typeof root.querySelectorAll !== 'function') return;

      root.querySelectorAll('.table-scroll-wrapper').forEach(wrapper => {
        const table = wrapper.querySelector('table');
        if (!table) return;

        const headers = Array.from(table.querySelectorAll('thead th')).map((th, index) => {
          const label = (th.textContent || '').trim();
          return label || `欄位 ${index + 1}`;
        });

        table.querySelectorAll('tbody tr').forEach(row => {
          Array.from(row.children).forEach((cell, index) => {
            if (!cell || String(cell.tagName || '').toLowerCase() !== 'td') return;
            cell.setAttribute('data-label', headers[index] || `欄位 ${index + 1}`);
          });
        });
      });
    }

    marked.setOptions({
      renderer: renderer,
      breaks: true,
      gfm: true
    });

      const allOptions = parent.querySelectorAll('.quiz-option');

      const statusEl = document.getElementById('bankStatusText');

        if (statusEl) statusEl.textContent = '此單元無單獨歷屆真題。';
        filteredBankQuestions = [];
        renderBankQuestions();

      }

      const periodVal = document.getElementById('bankPeriodSelect') ? document.getElementById('bankPeriodSelect').value : 'all';

        // 73 觀念主題過濾

          const qid = `bank_${q.id || (q.term + '_' + q.number)}`;

              ${isCorrect ? '🎉 答對了！掌握高頻核心' : `💡 官方公布正確答案：選項 (${correctAns})`}
            </div>
            ${q.note ? `<div style="margin-top:8px; padding:10px 14px; background:var(--bg-tertiary); border-left:3px solid var(--primary); border-radius:4px; font-size:0.88rem; line-height:1.6; color:var(--text-main); white-space:pre-line;">${highlightLegalText(q.note)}</div>` : ''}
          </div>
        `;
        fragment.appendChild(card);
      });

      container.appendChild(fragment);

      if (pageIndicator) pageIndicator.textContent = `第 ${currentBankPage + 1} / ${totalPages} 頁`;
      if (prevBtn) prevBtn.disabled = currentBankPage === 0;
      if (nextBtn) nextBtn.disabled = currentBankPage >= totalPages - 1;
    }

    function checkBankAnswer(elem, qid, selected, correct) {
      saveUserAnswer(qid, selected);
      const parent = elem.parentElement;
      const allOptions = parent.querySelectorAll('.quiz-option');
      allOptions.forEach(opt => opt.classList.remove('selected-correct', 'selected-wrong'));

      if (selected === correct) {
        elem.classList.add('selected-correct');
      } else {
        elem.classList.add('selected-wrong');
        if (allOptions[correct - 1]) allOptions[correct - 1].classList.add('selected-correct');
      }

      const explainEl = document.getElementById(`bank_explain_${qid}`);
      if (explainEl) {
        explainEl.classList.add('show');
        if (selected !== correct) {
          explainEl.innerHTML = `<strong>💡 官方公佈答案：選項 (${correct})</strong> ` + (selected === correct ? '<span style="color:var(--primary); margin-left:8px;">(答對了！掌握核心觀念)</span>' : '<span style="color:var(--danger); margin-left:8px;">(答錯了，已自動納入錯題分析)</span>');

        }
      }
    }


    // ==================== 官方法規 Modal 邏輯 ====================
    const lawsModal = document.getElementById('lawsModalOverlay');
    const lawCatSelect = document.getElementById('lawCategorySelect');
    const lawListContainer = document.getElementById('lawArticlesList');

    if (lawCatSelect) {
      lawCatSelect.onchange = () => {
        const key = lawCatSelect.value;
        if (!key || !courseData.laws[key]) {
          lawListContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">請選擇上方條文項目。</p>';
          return;
        }
        const law = courseData.laws[key];
        let html = `<div style="margin-bottom:8px; font-size:0.85rem; color:var(--text-muted);">
                      來源機關：<strong>${law.owner}</strong> ｜ 條文數量：${Object.keys(law.articles).length} 條 ｜
                      <a href="${law.url}" target="_blank" rel="noopener" style="color:var(--accent);">全國法規資料庫官方全文 ↗</a>
                    </div>`;
        for (const [artNum, artText] of Object.entries(law.articles)) {
          const parts = artNum.split('-');
          const artTitle = `第 ${parts[0]} 條${parts[1] ? '之 ' + parts[1] : ''}`;
          html += `<div class="law-article-card">
                     <h5>${artTitle}</h5>
                     <p>${highlightLegalText(artText)}</p>
                   </div>`;
        }
        lawListContainer.innerHTML = html;
      };
    }

    // ==================== 73 觀念主題篩選器 ====================
    function updateBankConceptSelect(chapId) {
      const bankConceptSelect = document.getElementById('bankConceptSelect');
      if (!bankConceptSelect) return;
      bankConceptSelect.innerHTML = '<option value="ALL">💡 所有觀念主題 (73大考點)</option>';
      const bankData = window.EXAM_BANK_DATA || courseData.full_bank || {};
      const bankItems = bankData[chapId] || [];
      const topics = {};
      bankItems.forEach(q => {
        if (q.topic) {
          topics[q.topic] = (topics[q.topic] || 0) + 1;
        }
      });
      for (const [top, cnt] of Object.entries(topics)) {
        const opt = document.createElement('option');
        opt.value = top;
        opt.textContent = `${top} (${cnt}題)`;
        bankConceptSelect.appendChild(opt);
      }
    }
    const bankConceptSelectEl = document.getElementById('bankConceptSelect');
    if (bankConceptSelectEl) {
      bankConceptSelectEl.onchange = () => {
        currentBankPage = 0;
        filterBankQuestions();
      };
    }


    // ==================== 上一章 / 下一章底部按鈕事件綁定 ====================
    const prevChapterBtn = document.getElementById('prevChapterBtn');
    if (prevChapterBtn) {
      prevChapterBtn.onclick = () => {
        if (currentChapterIndex > 0) {
          loadChapter(currentChapterIndex - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          const mainContent = document.querySelector('.main-content');
          if (mainContent) mainContent.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
    }
    const nextChapterBtn = document.getElementById('nextChapterBtn');
    if (nextChapterBtn) {
      nextChapterBtn.onclick = () => {
        if (currentChapterIndex < courseData.chapters.length - 1) {
          loadChapter(currentChapterIndex + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          const mainContent = document.querySelector('.main-content');
          if (mainContent) mainContent.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
    }

    // ==================== 行動端底部浮動列互動事件 ====================
    if (document.getElementById('mobileBarMenuBtn')) {
      document.getElementById('mobileBarMenuBtn').onclick = () => toggleSidebar(true);
    }
    if (document.getElementById('mobileBarPrevBtn')) {
      document.getElementById('mobileBarPrevBtn').onclick = () => {
        if (currentChapterIndex > 0) loadChapter(currentChapterIndex - 1);
      };
    }
    if (document.getElementById('mobileBarNextBtn')) {
      document.getElementById('mobileBarNextBtn').onclick = () => {
        if (currentChapterIndex < courseData.chapters.length - 1) loadChapter(currentChapterIndex + 1);
      };
    }
    if (document.getElementById('mobileBarQuizBtn')) {
      document.getElementById('mobileBarQuizBtn').onclick = () => {
        const quizSection = document.getElementById('quizSection');
        if (quizSection) {
          quizSection.scrollIntoView({ behavior: 'smooth' });
          switchQuizTab('bank');
        }
      };
    }
    if (document.getElementById('mobileBarThemeBtn')) {
      if (document.getElementById('mobileBarThemeBtn')) document.getElementById('mobileBarThemeBtn').onclick = () => toggleTheme();
    }
    if (document.getElementById('themeToggleBtn')) {
      document.getElementById('themeToggleBtn').onclick = () => toggleTheme();
    }

    // 初始化啟動
    renderSidebar();

    // 全域函式掛載
    window.loadChapter = loadChapter;
    window.switchQuizTab = switchQuizTab;
    window.filterBankQuestions = filterBankQuestions;
    window.changeBankPage = changeBankPage;
    window.checkAnswer = checkAnswer;
    window.checkBankAnswer = checkBankAnswer;
    window.toggleSidebar = toggleSidebar;
    window.openImageLightbox = openImageLightbox;
    window.closeImageLightbox = closeImageLightbox;
    window.zoomImage = zoomImage;
    window.openImageInNewTab = openImageInNewTab;
    window.zoomLightboxImage = zoomLightboxImage;
    window.resetLightboxImage = resetLightboxImage;

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
    }
    window.toggleTheme = toggleTheme;

    loadChapter(0);
    updateGlobalStats();

</script>
