<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="658" viewBox="0 0 1000 658" role="img" aria-labelledby="title desc">
    <title id="title">信託稅制全攻略穿透篇：出題知識點</title>
    <desc id="desc">第 41–62 期｜本章 179 題｜11 個知識點。所得稅與扣繳 55 題；信託課稅原則與形式移轉 22 題；遺產及贈與稅 21 題；土地稅與土地增值稅 19 題；房屋稅與契稅 12 題；員工持股信託的課稅與返還 12 題；贈與權利價值與折現計算 10 題；證券化商品分離課稅與交易稅 9 題；營業稅與印花稅 8 題；證券交易稅 8 題；信託稅務綜合比較 3 題</desc>
    <rect width="1000" height="658" rx="18" fill="#0f172a"/>
    <g font-family="system-ui, 'Noto Sans TC', sans-serif">
      <text x="30" y="40" fill="#f8fafc" font-size="24" font-weight="700">信託稅制全攻略穿透篇：出題知識點</text>
      <text x="30" y="73" fill="#94a3b8" font-size="16">第 41–62 期｜本章 179 題｜11 個知識點</text>
      <g><title>所得稅與扣繳：55 題 · 30.7%</title>
      <text x="30" y="131" fill="#94a3b8" font-size="15">1</text>
      <text x="66" y="131" fill="#e2e8f0" font-size="17">所得稅與扣繳</text>
      <rect x="420" y="110" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="110" width="440.00" height="30" rx="6" fill="#38bdf8"/>
      <text x="970" y="131" text-anchor="end" fill="#f8fafc" font-size="16">55 題 · 30.7%</text></g>
<g><title>信託課稅原則與形式移轉：22 題 · 12.3%</title>
      <text x="30" y="177" fill="#94a3b8" font-size="15">2</text>
      <text x="66" y="177" fill="#e2e8f0" font-size="17">信託課稅原則與形式移轉</text>
      <rect x="420" y="156" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="156" width="176.00" height="30" rx="6" fill="#38bdf8"/>
      <text x="970" y="177" text-anchor="end" fill="#f8fafc" font-size="16">22 題 · 12.3%</text></g>
<g><title>遺產及贈與稅：21 題 · 11.7%</title>
      <text x="30" y="223" fill="#94a3b8" font-size="15">3</text>
      <text x="66" y="223" fill="#e2e8f0" font-size="17">遺產及贈與稅</text>
      <rect x="420" y="202" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="202" width="168.00" height="30" rx="6" fill="#38bdf8"/>
      <text x="970" y="223" text-anchor="end" fill="#f8fafc" font-size="16">21 題 · 11.7%</text></g>
<g><title>土地稅與土地增值稅：19 題 · 10.6%</title>
      <text x="30" y="269" fill="#94a3b8" font-size="15">4</text>
      <text x="66" y="269" fill="#e2e8f0" font-size="17">土地稅與土地增值稅</text>
      <rect x="420" y="248" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="248" width="152.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="269" text-anchor="end" fill="#f8fafc" font-size="16">19 題 · 10.6%</text></g>
<g><title>房屋稅與契稅：12 題 · 6.7%</title>
      <text x="30" y="315" fill="#94a3b8" font-size="15">5</text>
      <text x="66" y="315" fill="#e2e8f0" font-size="17">房屋稅與契稅</text>
      <rect x="420" y="294" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="294" width="96.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="315" text-anchor="end" fill="#f8fafc" font-size="16">12 題 · 6.7%</text></g>
<g><title>員工持股信託的課稅與返還：12 題 · 6.7%</title>
      <text x="30" y="361" fill="#94a3b8" font-size="15">6</text>
      <text x="66" y="361" fill="#e2e8f0" font-size="17">員工持股信託的課稅與返還</text>
      <rect x="420" y="340" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="340" width="96.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="361" text-anchor="end" fill="#f8fafc" font-size="16">12 題 · 6.7%</text></g>
<g><title>贈與權利價值與折現計算：10 題 · 5.6%</title>
      <text x="30" y="407" fill="#94a3b8" font-size="15">7</text>
      <text x="66" y="407" fill="#e2e8f0" font-size="17">贈與權利價值與折現計算</text>
      <rect x="420" y="386" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="386" width="80.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="407" text-anchor="end" fill="#f8fafc" font-size="16">10 題 · 5.6%</text></g>
<g><title>證券化商品分離課稅與交易稅：9 題 · 5.0%</title>
      <text x="30" y="453" fill="#94a3b8" font-size="15">8</text>
      <text x="66" y="453" fill="#e2e8f0" font-size="17">證券化商品分離課稅與交易稅</text>
      <rect x="420" y="432" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="432" width="72.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="453" text-anchor="end" fill="#f8fafc" font-size="16">9 題 · 5.0%</text></g>
<g><title>營業稅與印花稅：8 題 · 4.5%</title>
      <text x="30" y="499" fill="#94a3b8" font-size="15">9</text>
      <text x="66" y="499" fill="#e2e8f0" font-size="17">營業稅與印花稅</text>
      <rect x="420" y="478" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="478" width="64.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="499" text-anchor="end" fill="#f8fafc" font-size="16">8 題 · 4.5%</text></g>
<g><title>證券交易稅：8 題 · 4.5%</title>
      <text x="30" y="545" fill="#94a3b8" font-size="15">10</text>
      <text x="66" y="545" fill="#e2e8f0" font-size="17">證券交易稅</text>
      <rect x="420" y="524" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="524" width="64.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="545" text-anchor="end" fill="#f8fafc" font-size="16">8 題 · 4.5%</text></g>
<g><title>信託稅務綜合比較：3 題 · 1.7%</title>
      <text x="30" y="591" fill="#94a3b8" font-size="15">11</text>
      <text x="66" y="591" fill="#e2e8f0" font-size="17">信託稅務綜合比較</text>
      <rect x="420" y="570" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="570" width="24.00" height="30" rx="6" fill="#818cf8"/>
      <text x="970" y="591" text-anchor="end" fill="#f8fafc" font-size="16">3 題 · 1.7%</text></g>
      <text x="30" y="638" fill="#94a3b8" font-size="15">橫條長度代表出題次數；百分比以179題為分母，非未來考試配分預測。</text>
    </g>
  </svg>
