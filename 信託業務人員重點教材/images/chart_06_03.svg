<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="100%" height="430" style="background-color: #0b1120; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gradAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <text x="460" y="38" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">🏢 REITs vs REATs 雙雄世紀對決 (歷屆最愛考！)</text>

  <!-- REITs 卡片 -->
  <g transform="translate(40, 70)" filter="url(#shadow)">
    <rect width="400" height="320" rx="14" fill="#0f2942" stroke="#38bdf8" stroke-width="2.5"/>
    <rect width="400" height="56" rx="14" fill="url(#gradBlue)"/>
    <text x="200" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">🏢 REITs 不動產投資信託 (股權收益型)</text>
    
    <text x="25" y="90" fill="#7dd3fc" font-size="15" font-weight="700">1. 發起思維：</text>
    <text x="120" y="90" fill="#e2e8f0" font-size="14">向大眾募資，去買商辦大樓收租 (投資型)</text>
    
    <text x="25" y="130" fill="#7dd3fc" font-size="15" font-weight="700">2. 證券本質：</text>
    <text x="120" y="130" fill="#e2e8f0" font-size="14">類似「股票」，享有房價上漲與租金分紅</text>

    <text x="25" y="170" fill="#7dd3fc" font-size="15" font-weight="700">3. 存續期間：</text>
    <text x="120" y="170" fill="#e2e8f0" font-size="14">封閉型為主，原則上無特定到期日</text>

    <text x="25" y="215" fill="#38bdf8" font-size="15" font-weight="700">4. 追加發行：</text>
    <text x="120" y="215" fill="#34d399" font-size="15" font-weight="700">⭐ 符合法定條件得追加募集！</text>

    <text x="25" y="260" fill="#38bdf8" font-size="15" font-weight="700">5. 收益分配：</text>
    <text x="120" y="260" fill="#fbbf24" font-size="15" font-weight="700">⭐ 每年收益應分配達 90% 以上！</text>

    <text x="25" y="300" fill="#7dd3fc" font-size="15" font-weight="700">6. 借款限制：</text>
    <text x="120" y="300" fill="#e2e8f0" font-size="14">經主管機關核准後得辦理借款</text>
  </g>

  <!-- REATs 卡片 -->
  <g transform="translate(480, 70)" filter="url(#shadow)">
    <rect width="400" height="320" rx="14" fill="#3d2806" stroke="#fbbf24" stroke-width="2.5"/>
    <rect width="400" height="56" rx="14" fill="url(#gradAmber)"/>
    <text x="200" y="36" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">🏦 REATs 不動產資產信託 (債權融資型)</text>
    
    <text x="25" y="90" fill="#fde68a" font-size="15" font-weight="700">1. 發起思維：</text>
    <text x="120" y="90" fill="#e2e8f0" font-size="14">地主有現成大樓，交付信託換取現金 (融資型)</text>
    
    <text x="25" y="130" fill="#fde68a" font-size="15" font-weight="700">2. 證券本質：</text>
    <text x="120" y="130" fill="#e2e8f0" font-size="14">類似「債券」，享有固定票息與到期還本</text>

    <text x="25" y="170" fill="#fde68a" font-size="15" font-weight="700">3. 存續期間：</text>
    <text x="120" y="170" fill="#e2e8f0" font-size="14">具有明確固定到期期限 (如 3 年、5 年)</text>

    <text x="25" y="215" fill="#f87171" font-size="15" font-weight="700">4. 追加發行：</text>
    <text x="120" y="215" fill="#f87171" font-size="15" font-weight="700">❌ 財產標的已確定，不得追加發行！</text>

    <text x="25" y="260" fill="#fde68a" font-size="15" font-weight="700">5. 收益分配：</text>
    <text x="120" y="260" fill="#e2e8f0" font-size="14">依受託契約約定按期支付約定利息與本金</text>

    <text x="25" y="300" fill="#f87171" font-size="15" font-weight="700">6. 借款限制：</text>
    <text x="120" y="300" fill="#f87171" font-size="14">原則上不得借款 (修繕目的等除外)</text>
  </g>

</svg>