<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc">
    <title id="title">有價證券與員工福利信託：出題知識點</title>
    <desc id="desc">第 41–62 期｜本章 133 題｜3 個知識點。證券信託種類與保管差異 51 題；有價證券借貸交易與擔保 44 題；內部人持股申報與權益行使 38 題</desc>
    <rect width="1000" height="290" rx="18" fill="#0f172a"/>
    <g font-family="system-ui, 'Noto Sans TC', sans-serif">
      <text x="30" y="40" fill="#f8fafc" font-size="24" font-weight="700">有價證券與員工福利信託：出題知識點</text>
      <text x="30" y="73" fill="#94a3b8" font-size="16">第 41–62 期｜本章 133 題｜3 個知識點</text>
      <g><title>證券信託種類與保管差異：51 題 · 38.3%</title>
      <text x="30" y="131" fill="#94a3b8" font-size="15">1</text>
      <text x="66" y="131" fill="#e2e8f0" font-size="17">證券信託種類與保管差異</text>
      <rect x="420" y="110" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="110" width="440.00" height="30" rx="6" fill="#38bdf8"/>
      <text x="970" y="131" text-anchor="end" fill="#f8fafc" font-size="16">51 題 · 38.3%</text></g>
<g><title>有價證券借貸交易與擔保：44 題 · 33.1%</title>
      <text x="30" y="177" fill="#94a3b8" font-size="15">2</text>
      <text x="66" y="177" fill="#e2e8f0" font-size="17">有價證券借貸交易與擔保</text>
      <rect x="420" y="156" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="156" width="379.61" height="30" rx="6" fill="#38bdf8"/>
      <text x="970" y="177" text-anchor="end" fill="#f8fafc" font-size="16">44 題 · 33.1%</text></g>
<g><title>內部人持股申報與權益行使：38 題 · 28.6%</title>
      <text x="30" y="223" fill="#94a3b8" font-size="15">3</text>
      <text x="66" y="223" fill="#e2e8f0" font-size="17">內部人持股申報與權益行使</text>
      <rect x="420" y="202" width="440" height="30" rx="6" fill="#1e293b"/>
      <rect x="420" y="202" width="327.84" height="30" rx="6" fill="#38bdf8"/>
      <text x="970" y="223" text-anchor="end" fill="#f8fafc" font-size="16">38 題 · 28.6%</text></g>
      <text x="30" y="270" fill="#94a3b8" font-size="15">橫條長度代表出題次數；百分比以133題為分母，非未來考試配分預測。</text>
    </g>
  </svg>
